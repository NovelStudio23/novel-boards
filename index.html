<script>
(function(){
  'use strict';

  /* ===================== Icons (dynamic) ===================== */
  const ICONS = {
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    grip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 1 12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-12"/></svg>',
    duplicate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16.5 3.5 4 4L7 21H3v-4L16.5 3.5Z"/></svg>',
    film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>',
    chevronUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
    chevronDown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    chevronLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
    chevronRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
  };

  /* ===================== State ===================== */
  let projects = [];               /* [{id, title, createdAt, updatedAt}] */
  let projectDataCache = {};       /* id -> {title, order, trashOrder, cuts} — fully preloaded for instant switching */
  let currentProjectId = null;
  let state = { title: 'Untitled Storyboard', order: [], trashOrder: [], cuts: {} };
  let editMode = false;
  let appMode = 'main'; /* 'main' | 'trash' */
  let selectMode = false;
  let selectedIds = new Set();
  let openMenuUnitId = null;
  let projectSort = { field: 'created', dir: 'desc' }; /* 'title' | 'created' | 'updated' | 'custom' */
  let viewMode = 'basic'; /* 'basic' | 'tile' */
  let sceneEditedIds = new Set();
  let undoStack = [];
  let redoStackGlobal = [];
  const MAX_UNDO = 30;

  const CANVAS_W = 1332, CANVAS_H = 720; /* 1.85:1 */
  const MIN_LINES = 10;

  const saveTimers = {};

  function uid(prefix){ return (prefix||'c') + Math.random().toString(36).slice(2, 9); }

  /* Default starter content for a brand-new project: 10 blank shots in a single scene. Shared
     by ensureProjectLoaded (an existing project whose storage turned out empty) and
     createNewProject (an explicit new project) — both mutate a freshly-initialized {order,
     cuts} data object the same way before persisting it. */
  function addDefaultStarterCuts(data){
    for(let i = 0; i < 10; i++){
      const cid = uid('c');
      data.cuts[cid] = { id: cid, scene: 'S#1', notes: '', image: null };
      data.order.push(cid);
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* Forces an <input>'s value to uppercase in place, preserving cursor position
     (setting .value directly would otherwise jump the cursor to the end). */
  function enforceUppercaseInput(input){
    const pos = input.selectionStart;
    const upper = input.value.toUpperCase();
    if(upper !== input.value){
      input.value = upper;
      try{ input.setSelectionRange(pos, pos); }catch(e){}
    }
  }

  function isPortrait(){ return window.innerWidth < window.innerHeight; }

  /* ===================== Storage (Claude storage in-chat, localStorage standalone) ===================== */
  const hasClaudeStorage = !!(window.storage && window.storage.get && window.storage.set);
  function lsAvailable(){
    try{ const k = '__lstest__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }catch(e){ return false; }
  }
  const hasLocalStorage = !hasClaudeStorage && lsAvailable();
  const LS_PREFIX = 'storyboard-app:';

  let storageFailureShown = false;
  /* Shows the persistent storage-warning banner (see its CSS comment for why this needs to be
     more durable than the auto-dismissing toast). Safe to call on every single failed save —
     it's just a class toggle, not spammy, and re-calling it while already shown is a no-op. */
  function notifyStorageFailure(){
    storageFailureShown = true;
    const banner = document.getElementById('storageWarningBanner');
    if(banner) banner.classList.add('show');
  }
  /* Called on every successful save — cheap no-op unless the banner is actually showing, in
     which case a save going through again means whatever was blocking storage has cleared. */
  function notifyStorageRecovered(){
    if(!storageFailureShown) return;
    storageFailureShown = false;
    const banner = document.getElementById('storageWarningBanner');
    if(banner) banner.classList.remove('show');
  }
  document.getElementById('storageWarningDismiss').addEventListener('click', () => {
    document.getElementById('storageWarningBanner').classList.remove('show');
  });
  async function storGet(key){
    if(hasClaudeStorage){
      try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
    }
    if(hasLocalStorage){
      try{ return localStorage.getItem(LS_PREFIX + key); }catch(e){ return null; }
    }
    return null;
  }
  async function storSet(key, value){
    if(hasClaudeStorage){
      try{ await window.storage.set(key, value, false); notifyStorageRecovered(); return true; }
      catch(e){ console.error('storage set failed', key, e); notifyStorageFailure(); return false; }
    }
    if(hasLocalStorage){
      try{ localStorage.setItem(LS_PREFIX + key, value); notifyStorageRecovered(); return true; }
      catch(e){ console.error('localStorage set failed', key, e); notifyStorageFailure(); return false; }
    }
    notifyStorageFailure();
    return false;
  }
  async function storDelete(key){
    if(hasClaudeStorage){
      try{ await window.storage.delete(key, false); notifyStorageRecovered(); return true; }
      catch(e){ notifyStorageFailure(); return false; }
    }
    if(hasLocalStorage){
      try{ localStorage.removeItem(LS_PREFIX + key); notifyStorageRecovered(); return true; }
      catch(e){ notifyStorageFailure(); return false; }
    }
    notifyStorageFailure();
    return false;
  }
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(() => {});
  }

  /* ---- project-scoped save helpers (explicit id, safe to use during preload) ---- */
  function saveMetaFor(pid, title){ return storSet('project:' + pid + ':meta', JSON.stringify({ title })); }
  function saveOrderFor(pid, order){ return storSet('project:' + pid + ':order', JSON.stringify(order)); }
  function saveTrashOrderFor(pid, trashOrder){ return storSet('project:' + pid + ':trash', JSON.stringify(trashOrder)); }
  function saveCutFor(pid, id, cut){
    return storSet('project:' + pid + ':cut:' + id, JSON.stringify({
      scene: cut.scene || '', notes: cut.notes || '', image: cut.image || null,
      notesHtml: cut.notesHtml || null,
      editorStrokes: Array.isArray(cut.editorStrokes) ? cut.editorStrokes : null,
      editorPhoto: cut.editorPhoto || null,
      editorPhotoTransform: cut.editorPhotoTransform || null,
      editorActions: Array.isArray(cut.editorActions) ? cut.editorActions : null,
      editorRedoActions: Array.isArray(cut.editorRedoActions) ? cut.editorRedoActions : null,
      trashedScene: cut.trashedScene != null ? cut.trashedScene : null,
      trashedShotNumber: cut.trashedShotNumber != null ? cut.trashedShotNumber : null,
      trashedAt: cut.trashedAt != null ? cut.trashedAt : null
    }));
  }
  function saveProjectsIndex(){ return storSet('projects-index', JSON.stringify(projects)); }

  function touchProjectUpdated(pid){
    const p = projects.find(x => x.id === pid);
    if(p){ p.updatedAt = Date.now(); debouncedSaveProjectsIndex(); }
  }

  /* ---- current-project save wrappers ----
     touch=true (default) marks the project as edited (bumps updatedAt, drives "Date Edited"
     sorting) in addition to persisting. A few call sites persist purely to keep storage in sync
     with in-memory state after loading/switching/booting — nothing the user actually changed —
     and pass touch=false so opening the app, switching projects, or entering/exiting Trash
     doesn't make a project look freshly edited. saveMeta/saveCut don't take this parameter: every
     call site for those is already tied to an actual content change. */
  function saveOrder(touch = true){ if(touch) touchProjectUpdated(currentProjectId); return saveOrderFor(currentProjectId, state.order); }
  function saveTrashOrder(touch = true){ if(touch) touchProjectUpdated(currentProjectId); return saveTrashOrderFor(currentProjectId, state.trashOrder); }
  function saveMeta(){ touchProjectUpdated(currentProjectId); return saveMetaFor(currentProjectId, state.title); }
  function saveCut(id){
    const c = state.cuts[id];
    if(!c) return;
    touchProjectUpdated(currentProjectId);
    return saveCutFor(currentProjectId, id, c);
  }
  function debouncedSaveCut(id){
    const pid = currentProjectId;
    clearTimeout(saveTimers[id]);
    saveTimers[id] = setTimeout(() => { if(pid === currentProjectId) saveCut(id); }, 650);
  }
  function debouncedSaveMeta(){
    const pid = currentProjectId;
    clearTimeout(saveTimers.__meta);
    saveTimers.__meta = setTimeout(() => { if(pid === currentProjectId) saveMeta(); }, 650);
  }
  function debouncedSaveProjectsIndex(){
    clearTimeout(saveTimers.__projidx);
    saveTimers.__projidx = setTimeout(() => saveProjectsIndex(), 500);
  }

  async function loadProjectsIndex(){
    const raw = await storGet('projects-index');
    if(raw){ try{ projects = JSON.parse(raw); }catch(e){ projects = []; } }
    if(!projects || !Array.isArray(projects) || projects.length === 0){
      const now = Date.now();
      const id = uid('p');
      projects = [{ id, title: 'Untitled Storyboard', createdAt: now, updatedAt: now }];
      await storSet('projects-index', JSON.stringify(projects));
      await storSet('active-project', id);
      currentProjectId = id;
      return;
    }
    const activeRaw = await storGet('active-project');
    currentProjectId = (activeRaw && projects.some(p => p.id === activeRaw)) ? activeRaw : projects[0].id;
  }

  async function loadProjectDataFresh(id){
    const data = { title: 'Untitled Storyboard', order: [], trashOrder: [], cuts: {} };
    const metaRaw = await storGet('project:' + id + ':meta');
    if(metaRaw){ try{ const m = JSON.parse(metaRaw); if(m.title) data.title = m.title; }catch(e){} }
    const orderRaw = await storGet('project:' + id + ':order');
    if(orderRaw){ try{ data.order = JSON.parse(orderRaw); }catch(e){ data.order = []; } }
    const trashRaw = await storGet('project:' + id + ':trash');
    if(trashRaw){ try{ data.trashOrder = JSON.parse(trashRaw); }catch(e){ data.trashOrder = []; } }
    const allIds = data.order.concat(data.trashOrder);
    await Promise.all(allIds.map(async cid => {
      const raw = await storGet('project:' + id + ':cut:' + cid);
      if(raw){ try{ const c = JSON.parse(raw); c.id = cid; data.cuts[cid] = c; }catch(e){} }
    }));
    data.order = data.order.filter(cid => data.cuts[cid]);
    data.trashOrder = data.trashOrder.filter(cid => data.cuts[cid]);
    if(data.order.length === 0 && data.trashOrder.length === 0){
      addDefaultStarterCuts(data);
      saveOrderFor(id, data.order);
      data.order.forEach(cid => saveCutFor(id, cid, data.cuts[cid]));
    }
    const proj = projects.find(p => p.id === id);
    if(proj) proj.title = data.title;
    return data;
  }

  async function ensureProjectLoaded(id){
    if(projectDataCache[id]) return projectDataCache[id];
    const data = await loadProjectDataFresh(id);
    projectDataCache[id] = data;
    return data;
  }

  /* Loads whichever projects aren't cached yet, in the background (does not block rendering). */
  async function preloadRemainingProjects(){
    await Promise.all(projects.filter(p => !projectDataCache[p.id]).map(p => ensureProjectLoaded(p.id)));
    /* Trash folder's per-project counts depend on data that may have just finished loading. */
    renderTrashProjectsList();
  }

  /* ===================== Confirm dialog (custom — window.confirm is unreliable in sandboxed iframes) ===================== */
  function showConfirm(message, okLabel, cancelLabel){

  /* ===================== Prompt dialog (custom — window.prompt is unreliable in sandboxed iframes) ===================== */

        cancelBtn.removeEventListener('click', onCancel);
        backdrop.removeEventListener('click', onCancel);

  /* ===================== Search (shot number or notes text, current project only) ===================== */
  /* Scope is intentionally just the active project's visible shots — trash and other projects
     require actually navigating there first (search box lives in topbarMainControls, which is
     already hidden while in Trash, so this falls out naturally with no extra mode-check needed).
     No manual "search by number vs text" toggle: a query is treated as a shot-number lookup only
     when it's <digits><letters> with no space (e.g. "3B", "12AA") — a bare number with no letter
     yet (e.g. "3") is searched as notes text instead, same as any other non-matching query. */
  const SHOT_NUMBER_QUERY_RE = /^\d+[A-Za-z]+$/;
  const searchToggleBtn = document.getElementById('searchToggleBtn');
  const searchPanelEl = document.getElementById('searchPanel');
  const searchInputEl = document.getElementById('searchInput');
  const searchClearBtn = document.getElementById('searchClearBtn');
  const searchResultsEl = document.getElementById('searchResults');

  function getNotesPlainText(cut){
    return (typeof cut.notesHtml === 'string' && cut.notesHtml) ? stripTagsToText(cut.notesHtml) : (cut.notes || '');
  }
  function runShotSearch(query){
    const q = query.trim();
    if(!q) return [];
    const labels = computeMainShotLabels();
    const results = [];
    if(SHOT_NUMBER_QUERY_RE.test(q)){
      const qUpper = q.toUpperCase();
      state.order.forEach(id => {
        const label = labels[id];
        if(label && label.toUpperCase().startsWith(qUpper)) results.push({ id, label, snippet: null });
      });
    } else {
      const qLower = q.toLowerCase();
      state.order.forEach(id => {
        const cut = state.cuts[id];
        if(!cut) return;
        const text = getNotesPlainText(cut);
        if(text && text.toLowerCase().includes(qLower)) results.push({ id, label: labels[id] || '', snippet: text });
      });
    }
    return results.slice(0, 40);
  }
  function renderSearchResults(query){
    searchResultsEl.innerHTML = '';
    if(!query.trim()) return;
    const results = runShotSearch(query);
    if(results.length === 0){
      const empty = document.createElement('div');
      empty.className = 'search-empty-row';
      empty.textContent = 'No matches';
      searchResultsEl.appendChild(empty);
      return;
    }
    results.forEach(r => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'search-result-row';
      const labelSpan = document.createElement('span');
      labelSpan.className = 'search-result-label';
      labelSpan.textContent = r.label;
      row.appendChild(labelSpan);
      if(r.snippet){
        const snippetSpan = document.createElement('span');
        snippetSpan.className = 'search-result-snippet';
        snippetSpan.textContent = r.snippet;
        row.appendChild(snippetSpan);
      }
      row.addEventListener('click', () => {
        closeSearch();
        jumpToCut(r.id, { instant: true });
      });
      searchResultsEl.appendChild(row);
    });
  }
  function isSearchOpen(){ return searchPanelEl.style.display === 'flex'; }
  function openSearch(){
    searchPanelEl.style.display = 'flex';
    searchToggleBtn.classList.add('active');
    searchInputEl.value = '';
    searchResultsEl.innerHTML = '';
    requestAnimationFrame(() => searchInputEl.focus());

  function closeSearch(){

  searchToggleBtn.addEventListener('click', () => { isSearchOpen() ? closeSearch() : openSearch(); });
  searchClearBtn.addEventListener('click', closeSearch);
  searchInputEl.addEventListener('input', () => renderSearchResults(searchInputEl.value));
  searchInputEl.addEventListener('keydown', (e) => {

  /* Closes on any click outside the panel/toggle — covers switching projects, entering Trash,

  document.addEventListener('click', (e) => {

  document.getElementById('sidebarToggle').addEventListener('click', () => {

  document.getElementById('viewBasicBtn').addEventListener('click', () => setViewMode('basic'));
  document.getElementById('viewTileBtn').addEventListener('click', () => setViewMode('tile'));
  function setViewMode(m){
    /* A momentum scroll only ever starts from a Tile View flick (onTilePointerDown), but the
       RAF loop it kicks off keeps calling filmstripEl.scrollTo regardless of which view's
       content is currently rendered inside that same container — switching to Normal View
       mid-flick doesn't stop it. Left uncancelled, it would keep fighting over scrollTop
       against Normal View's own handle-drag scrolling (onHandlePointerDown), making the
       scrollbar/content look like it's jumping around erratically. */
    if(tileMomentumCancel){ tileMomentumCancel(); tileMomentumCancel = null; }
    viewMode = m;

    document.getElementById('viewTileBtn').classList.toggle('active', m === 'tile');
