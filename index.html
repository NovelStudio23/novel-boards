    /* The main app view is sitting there the whole time, already fully rendered behind the
       modal's opaque background — it never needed "loading", just a reason to be visible sooner.
       Snapping it to slightly-enlarged-and-transparent first, then animating both it and the
       modal's own background back to normal in step with the frame shrinking, is what makes the
       two feel like one continuous motion landing together instead of the frame shrinking alone
       on a blank dark screen and everything else just cutting in once it's done. */
    editorModal.style.transition = 'none';
    appEl.style.transition = 'none';
    appEl.style.transform = 'scale(1.045)';
    appEl.style.opacity = '0';

    void editorFrameInnerEl.offsetHeight; /* force layout before starting the transition */

    requestAnimationFrame(() => {
      editorFrameInnerEl.style.transition = 'transform .34s cubic-bezier(.32,.72,0,1)';
      editorFrameInnerEl.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scaleX}, ${scaleY})`;
      editorTopbarEl.style.transition = 'opacity .2s ease';
      editorTopbarEl.style.opacity = '0';
      editorToolbarEl.style.transition = 'opacity .2s ease';
      editorToolbarEl.style.opacity = '0';
      editorModal.style.transition = 'background-color .34s cubic-bezier(.32,.72,0,1)';
      editorModal.style.backgroundColor = 'rgba(44,44,47,0)';
      appEl.style.transition = 'transform .34s cubic-bezier(.32,.72,0,1), opacity .34s cubic-bezier(.32,.72,0,1)';
      appEl.style.transform = 'scale(1)';
      appEl.style.opacity = '1';
    });

    const finish = () => {
      if(finish.done) return;
      finish.done = true;
      clearTimeout(fallbackId);
      editorFrameInnerEl.removeEventListener('transitionend', finish);
      /* Hide the modal instantly (no-slide-transition) now that the frame has already visually
         shrunk down to the source — letting the normal slide transition run here too would show
         the whole (now tiny-framed) modal sliding downward as an unwanted second motion. */
      editorModal.classList.add('no-slide-transition');
      editorModal.classList.remove('open');
      editorFrameInnerEl.style.transition = '';
      editorFrameInnerEl.style.transform = '';
      editorFrameInnerEl.style.transformOrigin = '';
      editorFrameInnerEl.style.boxShadow = '';
      editorTopbarEl.style.transition = '';
      editorTopbarEl.style.opacity = '';
      editorToolbarEl.style.transition = '';
      editorToolbarEl.style.opacity = '';
      editorModal.style.transition = '';
      editorModal.style.backgroundColor = '';
      appEl.style.transition = '';
      appEl.style.transform = '';
      appEl.style.opacity = '';
      void editorModal.offsetHeight;
      editorModal.classList.remove('no-slide-transition');
      onDone();
    };
    /* See the matching comment in animateEditorFrameOpen: not using {once:true} and instead
       explicitly removing this listener (from whichever of transitionend/the fallback timer
       actually runs finish()) is what stops a late, unrelated transitionend on this same element
       — most often from the NEXT open/close — from re-triggering this stale callback and
       stomping on a brand new animation's styles mid-flight. */
    editorFrameInnerEl.addEventListener('transitionend', finish);
    const fallbackId = setTimeout(finish, 370);
  }

  /* photo-set actions (pushed on photo attach/replace) embed full copies of the photo's dataURL —
     both the previous and the new one — so undo/redo can restore either instantly during a live
     editing session. Once persisted into cut.editorActions/editorRedoActions for the "still works
     after reopening" guarantee above, though, any copy that happens to exactly match the cut's
     current cut.editorPhoto is pure duplication: that exact string is already sitting right next
     to it on the same cut object. These two swap such copies for a short sentinel before saving
     and back for the real string on load, so the in-memory action objects that actual undo/redo
     logic runs against are always the real, full dataURLs — undo/redo itself is completely
     unchanged and unaware this happens. Only the on-disk JSON gets smaller. Deliberately scoped to
     just this one field: cut.image (the flattened composite) is separate, legitimately-different
     data and isn't touched. The larger duplication in 'add'/'erase' actions (whole stroke
     objects, also present in editorStrokes) uses the same strategy — see the block below. */
  const PHOTO_ACTION_SENTINEL = '__CURRENT_PHOTO__';
  function compressPhotoActionsForStorage(actions, currentPhoto){
    if(!currentPhoto) return actions;
    return actions.map(a => {
      if(a.type !== 'photo-set') return a;
      const copy = Object.assign({}, a);
      if(copy.prevPhotoDataURL === currentPhoto) copy.prevPhotoDataURL = PHOTO_ACTION_SENTINEL;
      if(copy.newPhotoDataURL === currentPhoto) copy.newPhotoDataURL = PHOTO_ACTION_SENTINEL;
      return copy;
    });
  }
  function hydratePhotoActionsFromStorage(actions, currentPhoto){
    if(!currentPhoto) return actions;
    return actions.map(a => {
      if(a.type !== 'photo-set') return a;
      const copy = Object.assign({}, a);
      if(copy.prevPhotoDataURL === PHOTO_ACTION_SENTINEL) copy.prevPhotoDataURL = currentPhoto;
      if(copy.newPhotoDataURL === PHOTO_ACTION_SENTINEL) copy.newPhotoDataURL = currentPhoto;
      return copy;
    });
  }

  /* Same idea, for the bigger offender (#18): an 'add' action's strokeData is a full duplicate of
     the same stroke object already sitting in editorStrokes for as long as that stroke hasn't
     since been erased — every single stroke drawn duplicates its entire point array this way,
     which adds up far faster than the photo case above ever could. An 'erase' action's removed[]
     entries are the mirror case: duplicates of strokes NOT currently in editorStrokes (they were
     just erased) — unless the erase itself later gets undone (moving the action to
     editorRedoActions), which puts those exact strokes back into editorStrokes and makes that
     copy compressible too. Both directions are checked fresh against the CURRENT editorStrokes
     every time this runs, since which entries are compressible shifts as the user keeps
     drawing/erasing/undoing/redoing within the same session — this isn't a one-time decision.
     Deliberately scoped to just 'add' and 'erase' (the high-volume cases): 'clear' actions store a
     bulk prevStrokes snapshot and 'transform' actions store before/after point snapshots, both of
     which could in principle be compressed the same way, but they're comparatively rare (at most
     a handful per session vs. potentially hundreds of strokes), so the added complexity isn't
     worth it here — left as a possible follow-up, not attempted in this pass. */
  const STROKE_ACTION_SENTINEL = '__CURRENT_STROKE__';
  function compressStrokeActionsForStorage(actions, currentStrokes){
    const byId = {};
    currentStrokes.forEach(s => { byId[s.id] = true; });
    return actions.map(a => {
      if(a.type === 'add' && byId[a.strokeId]){
        return Object.assign({}, a, { strokeData: STROKE_ACTION_SENTINEL });
      }
      if(a.type === 'erase' && Array.isArray(a.removed)){
        const newRemoved = a.removed.map(entry => byId[entry.strokeId]
          ? Object.assign({}, entry, { strokeData: STROKE_ACTION_SENTINEL })
          : entry);
        return Object.assign({}, a, { removed: newRemoved });
      }
      return a;
    });
  }
  function hydrateStrokeActionsFromStorage(actions, currentStrokes){
    const byId = {};
    currentStrokes.forEach(s => { byId[s.id] = s; });
    return actions.map(a => {
      if(a.type === 'add' && a.strokeData === STROKE_ACTION_SENTINEL && byId[a.strokeId]){
        return Object.assign({}, a, { strokeData: JSON.parse(JSON.stringify(byId[a.strokeId])) });
      }
      if(a.type === 'erase' && Array.isArray(a.removed)){
        const newRemoved = a.removed.map(entry => (entry.strokeData === STROKE_ACTION_SENTINEL && byId[entry.strokeId])
          ? Object.assign({}, entry, { strokeData: JSON.parse(JSON.stringify(byId[entry.strokeId])) })
          : entry);
        return Object.assign({}, a, { removed: newRemoved });
      }
      return a;
    });
  }

  function openEditor(cutId, sourceEl){
    if(!editMode) return;
    const cut = state.cuts[cutId];
    if(!cut) return;
    editorOpenSourceEl = sourceEl || null;
    editorState.cutId = cutId;
    editorState.baseImage = null;
    editorState.photoDataURL = null;
    editorState.strokes = [];
    editorState.tool = 'pen';
    editorState.color = '#221F1C';
    editorState.photoTransform = cut.editorPhotoTransform ? JSON.parse(JSON.stringify(cut.editorPhotoTransform)) : { scale: 1, offsetX: 0, offsetY: 0 };
    movePointers.clear();
    clearTimeout(photoLongPressTimer);
    hidePhotoSelectUI();
    moveGestureStart = null;
    setActiveToolUI();

    /* Undo/redo history is restored right alongside the strokes themselves — otherwise the
       first thing anyone does after reopening (erase, then hit Undo) looks broken, since there'd
       be no record of anything to undo even though the drawing is sitting right there. */
    const restoredStrokesForHydration = Array.isArray(cut.editorStrokes) ? JSON.parse(JSON.stringify(cut.editorStrokes)) : [];
    editorState.actions = Array.isArray(cut.editorActions)
      ? hydrateStrokeActionsFromStorage(hydratePhotoActionsFromStorage(JSON.parse(JSON.stringify(cut.editorActions)), cut.editorPhoto || null), restoredStrokesForHydration)
      : [];
    editorState.redoActions = Array.isArray(cut.editorRedoActions)
      ? hydrateStrokeActionsFromStorage(hydratePhotoActionsFromStorage(JSON.parse(JSON.stringify(cut.editorRedoActions)), cut.editorPhoto || null), restoredStrokesForHydration)
      : [];
    updateEditorUndoRedoButtons();

    editorCutNumEl.textContent = shotLabelFor(cutId);

    if(!animateEditorFrameOpen(sourceEl)) editorModal.classList.add('open');
    /* Size/scale the canvas for the current display now — offsetWidth/offsetHeight are already
       correct at this point regardless of animateEditorFrameOpen's in-flight transform (see
       resizeEditorCanvasForDPI's block comment above for why that distinction matters). Doing
       this before any of the branches below call redrawEditor() means their very first paint is
       already at full resolution, instead of painting once at the old size and immediately again. */
    resizeEditorCanvasForDPI();
    /* One more pass a couple paints later, same double-rAF "let layout settle" pattern used
       elsewhere in this file (e.g. closeEditor's flatten timing) — .editor-frame-inner's actual
       laid-out size can still shift very slightly after the call above (observed ~2% in testing,
       not tied to animateEditorFrameOpen since this still happened even opening with no source
       element and thus no in-flight FLIP transform) — catching it here means the canvas settles
       at full sharpness immediately rather than staying very slightly under-resolved until the
       next unrelated resize happens to trigger a recompute. */
    requestAnimationFrame(() => requestAnimationFrame(() => resizeEditorCanvasForDPI()));

    /* editorStrokes/editorPhoto hold the still-editable, un-flattened drawing from the last
       time THIS cut was edited in the fullscreen editor — restoring them (instead of just
       reloading the flattened cut.image as an opaque picture) is what lets the object eraser
       keep working after closing and reopening. (The inline card canvas can no longer draw at
       all, so there's no longer a way for cut.image to change behind the editor's back and
       invalidate these — they only ever change here, inside the editor itself.) */
    const restoreStrokes = Array.isArray(cut.editorStrokes) ? JSON.parse(JSON.stringify(cut.editorStrokes)) : null;
    if(cut.editorPhoto){
      editorEmptyHint.style.display = 'none';
      editorState.photoDataURL = cut.editorPhoto;
      const img = new Image();
      img.onload = () => {
        if(editorState.cutId !== cutId) return; /* user switched to a different cut while this was decoding */
        editorState.baseImage = img; if(restoreStrokes) editorState.strokes = restoreStrokes; redrawEditor();
      };
      img.onerror = () => {
        if(editorState.cutId !== cutId) return;
        if(restoreStrokes) editorState.strokes = restoreStrokes; redrawEditor();
      };
      img.src = cut.editorPhoto;
    } else if(restoreStrokes && restoreStrokes.length > 0){
      editorState.strokes = restoreStrokes;
      editorEmptyHint.style.display = 'none';
      redrawEditor();
    } else if(cut.image){
      /* No live stroke data available for this cut — fall back to the flattened image as a
         flat background (object eraser has nothing to pick apart in this case). */
      editorEmptyHint.style.display = 'none';
      const img = new Image();
      img.onload = () => {
        if(editorState.cutId !== cutId) return; /* same stale-switch guard as above */
        editorState.baseImage = img; redrawEditor();
      };
      img.onerror = () => { if(editorState.cutId === cutId) redrawEditor(); };
      img.src = cut.image;
    } else {
      redrawEditor();
      editorEmptyHint.style.display = 'flex';
    }
    editorModal.focus({ preventScroll: true });
  }

  function redrawEditor(){
    renderFrameCanvas(ectx, editorState.baseImage, editorState.strokes, editorState.photoTransform);
    if(photoSelectShown) positionPhotoSelectBox();
    if(selection) selection.strokes.forEach(s => drawStroke(ectx, s, true));
    if(lassoPoints && lassoPoints.length > 1) drawLassoPath(ectx, lassoPoints);
  }

  function drawLassoPath(ctx, pts){
    ctx.save();
    ctx.strokeStyle = '#E0502A';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.restore();
  }

  function positionPhotoSelectBox(){
    const box = document.getElementById('photoSelectBox');
    if(!editorState.baseImage){ box.style.display = 'none'; return; }
    const t = editorState.photoTransform;
    const fitScale = Math.min(CANVAS_W / editorState.baseImage.width, CANVAS_H / editorState.baseImage.height);
    const scale = fitScale * t.scale;
    const w = editorState.baseImage.width * scale, h = editorState.baseImage.height * scale;
    const x = (CANVAS_W - w) / 2 + t.offsetX, y = (CANVAS_H - h) / 2 + t.offsetY;
    const cssScale = editorCanvas.clientWidth / CANVAS_W;
    box.style.left = (x * cssScale) + 'px';
    box.style.top = (y * cssScale) + 'px';
    box.style.width = (w * cssScale) + 'px';
    box.style.height = (h * cssScale) + 'px';
    box.style.display = 'block';
  }
  function showPhotoSelectUI(){
    if(!editorState.baseImage) return;
    photoSelectShown = true;
    positionPhotoSelectBox();
  }
  function hidePhotoSelectUI(){
    photoSelectShown = false;
    document.getElementById('photoSelectBox').style.display = 'none';
  }

  /* Applies a saved photo snapshot (dataURL + transform) — shared by undo/redo for the
     'photo-set' action type, and by attach/delete themselves. Passing a null dataURL clears
     the photo entirely. */
  function applyPhotoState(dataURL, transform){
    editorState.photoDataURL = dataURL;
    editorState.photoTransform = transform ? JSON.parse(JSON.stringify(transform)) : { scale: 1, offsetX: 0, offsetY: 0 };
    if(!dataURL){
      editorState.baseImage = null;
      hidePhotoSelectUI();
      if(editorState.strokes.length === 0) editorEmptyHint.style.display = '';
      redrawEditor();
      return;
    }
    const img = new Image();
    img.onload = () => {
      editorState.baseImage = img;
      editorEmptyHint.style.display = 'none';
      redrawEditor();
    };
    img.src = dataURL;
  }

  function deletePhotoFromEditor(){
    if(!editorState.baseImage) return;
    const prevPhotoDataURL = editorState.photoDataURL;
    const prevPhotoTransform = JSON.parse(JSON.stringify(editorState.photoTransform));
    editorState.actions.push({ type: 'photo-set', prevPhotoDataURL, prevPhotoTransform, newPhotoDataURL: null, newPhotoTransform: { scale: 1, offsetX: 0, offsetY: 0 } });
    editorState.redoActions = [];
    applyPhotoState(null, null);
    updateEditorUndoRedoButtons();
    autosaveEditorState();
  }

  function refreshTileImage(id){
    const tile = filmstripEl.querySelector('.tile[data-unit-id="' + id + '"]');
    if(!tile) return;
    const cut = state.cuts[id];
    tile.querySelectorAll('img, .tile-hint').forEach(el => el.remove());
    /* Insert after the guides (not as firstChild) so guides stay behind the image, matching buildTile. */
    const badge = tile.querySelector('.tile-badge');
    if(cut.image){
      const img = document.createElement('img');
      img.src = cut.image;
      tile.insertBefore(img, badge);
    } else {
      const hint = document.createElement('div');
      hint.className = 'tile-hint';
      hint.innerHTML = ICONS.pencil;
      tile.insertBefore(hint, badge);
    }
  }

  /* Autosaves the live, restorable editing state periodically while the editor is open, so a
     crash/reload/app-kill mid-session doesn't lose everything back to whatever was last saved at
     Done. Deliberately does NOT recompute cut.image here (the flattened thumbnail) — that's a
     real canvas-encode cost, only worth paying once, at actual close time; the thumbnail staying
     one session behind after an interrupted session is a much smaller problem than losing the
     actual editable content. Debounced via debouncedSaveCut, so calling this after every
     completed gesture (not just occasionally) doesn't mean a write on every single one. */
  function autosaveEditorState(){
    if(!editorState.cutId) return;
    const cut = state.cuts[editorState.cutId];
    if(!cut) return;
    cut.editorPhoto = editorState.photoDataURL || null;
    cut.editorPhotoTransform = editorState.photoDataURL ? JSON.parse(JSON.stringify(editorState.photoTransform)) : null;
    cut.editorStrokes = JSON.parse(JSON.stringify(editorState.strokes));
    cut.editorActions = compressStrokeActionsForStorage(compressPhotoActionsForStorage(JSON.parse(JSON.stringify(editorState.actions)), cut.editorPhoto), editorState.strokes);
    cut.editorRedoActions = compressStrokeActionsForStorage(compressPhotoActionsForStorage(JSON.parse(JSON.stringify(editorState.redoActions)), cut.editorPhoto), editorState.strokes);
    debouncedSaveCut(cut.id);
  }

  function closeEditor(commit){
    clearTimeout(photoLongPressTimer);
    hidePhotoSelectUI();
    clearSelection();

    /* Snapshot everything the delayed save below needs, right now, synchronously — not inside
       the delayed callback. editorState is a single shared object reused for every cut; if the
       person taps to open a different cut before this fires (very plausible — two rAFs is only
       a frame or two, easily beaten by a quick tap), openEditor() for that other cut resets
       editorState.cutId/baseImage/strokes/etc. out from under this closure. Reading editorState
       lazily inside the callback would then save THIS cut's data onto whatever cut is now open
       (or worse, null out editorState.cutId for that other cut's already-active session — see
       the guard at the very end of this function). Snapshotting now makes this closure immune
       to anything that happens to editorState afterward, regardless of what the person does next. */
    const closingCutId = editorState.cutId;
    const snapshotBaseImage = editorState.baseImage;
    const snapshotStrokes = JSON.parse(JSON.stringify(editorState.strokes));
    const snapshotPhotoDataURL = editorState.photoDataURL;
    const snapshotPhotoTransform = JSON.parse(JSON.stringify(editorState.photoTransform));
    const snapshotActions = JSON.parse(JSON.stringify(editorState.actions));
    const snapshotRedoActions = JSON.parse(JSON.stringify(editorState.redoActions));

    /* Kick the shrink animation off first, before any of the save/thumbnail work below, so Done
       feels instantly responsive instead of visibly waiting on a canvas encode + localStorage
       write before it even starts moving. The actual save work is then deferred two rAFs out —
       past the point the browser has painted the animation's first real frame — since transform/
       opacity transitions run on the compositor and don't depend on the main thread once
       started, but a big synchronous block (toDataURL, JSON.stringify, localStorage) run in the
       very same tick as kicking the transition off can still delay that first paint. */
    animateEditorFrameClose(() => {
      editorOpenSourceEl = null;
    });

    requestAnimationFrame(() => requestAnimationFrame(() => {
      if(commit && closingCutId){
        const cut = state.cuts[closingCutId];
        if(cut){
          const hasContent = snapshotBaseImage || snapshotStrokes.length > 0;
          cut.image = hasContent ? flattenToDataURL(flattenCtx, snapshotBaseImage, snapshotStrokes, snapshotPhotoTransform) : null;
          /* Keep the live, still-editable drawing data around (separate from the flattened
             cut.image) so reopening the editor can restore individual strokes instead of one
             opaque picture — that's what object eraser needs to keep working. */
          cut.editorPhoto = snapshotPhotoDataURL || null;
          cut.editorPhotoTransform = snapshotPhotoDataURL ? snapshotPhotoTransform : null;
          cut.editorStrokes = snapshotStrokes;
          cut.editorActions = compressStrokeActionsForStorage(compressPhotoActionsForStorage(snapshotActions, cut.editorPhoto), snapshotStrokes);
          cut.editorRedoActions = compressStrokeActionsForStorage(compressPhotoActionsForStorage(snapshotRedoActions, cut.editorPhoto), snapshotStrokes);
          saveCut(cut.id);
          if(viewMode === 'tile'){
            refreshTileImage(cut.id);
          } else {
            const unit = filmstripEl.querySelector('.cut-unit[data-unit-id="' + cut.id + '"]');
            if(unit && unit._inline){
              /* Draws straight from the editor's own in-memory baseImage/strokes instead of
                 going through reloadInlineCanvas's cut.image → new Image() → onload round-trip —
                 that decode is asynchronous and not reliably done by the time the close animation
                 settles, which is what let this specific card visibly pop in a beat late instead
                 of just being there already, right as the modal disappears. */
              const rec = unit._inline;
              rec.baseImage = snapshotBaseImage;
              rec.strokes = snapshotStrokes;
              renderFrameCanvas(rec.ctx, rec.baseImage, rec.strokes, snapshotPhotoTransform);
              unit._hintEl.style.display = hasContent ? 'none' : 'flex';
            }
          }
        }
      }
      /* Only clear editorState.cutId if it still refers to the cut THIS call was closing — if the
         person has since opened a different cut, that cut's own editorState.cutId is what's
         currently there, and clearing it here would silently break every autosave for it from
         this point on (autosaveEditorState no-ops whenever editorState.cutId is falsy). */
      if(editorState.cutId === closingCutId) editorState.cutId = null;
    }));
  }
  document.getElementById('editorCloseBtn').addEventListener('click', () => closeEditor(true));

  function pointToSegmentDist(px, py, x1, y1, x2, y2){
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }
  function strokeHitTest(stroke, x, y, tolerance){
    const pts = stroke.points;
    const margin = tolerance + stroke.size / 2;
    if(pts.length < 2){
      const p = pts[0];
      return !!p && Math.hypot(x - p.x, y - p.y) <= margin;
    }
    for(let i = 1; i < pts.length; i++){
      if(pointToSegmentDist(x, y, pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y) <= margin) return true;
    }
    return false;
  }
  function eraseObjectsAt(x, y){
    const tolerance = editorState.eraserSize;
    const remaining = [];
    let removedAny = false;
    editorState.strokes.forEach((s, idx) => {
      /* Eraser strokes are erasing actions, not drawn "objects" — they must never themselves
         be treated as a hit target, or object-erasing near a spot you previously pixel-erased
         would remove that erase stroke and bring the erased ink back. */
      if(s.mode !== 'eraser' && strokeHitTest(s, x, y, tolerance)){
        eraseSessionRemovals.push({ strokeId: s.id, strokeData: s, index: idx });
        removedAny = true;
      } else {
        remaining.push(s);
      }
    });
    if(removedAny){
      editorState.strokes = remaining;
      redrawEditor();
    }
  }

  /* ---- Selection tool geometry/model ---- */
  function pointInPolygon(x, y, poly){
    let inside = false;
    for(let i = 0, j = poly.length - 1; i < poly.length; j = i++){
      const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
      const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if(intersect) inside = !inside;
    }
    return inside;
  }
  function clonePoints(pts){
    return pts.map(p => ({ x: p.x, y: p.y, pressure: p.pressure }));
  }
  /* Maps one of a selected stroke's *original* (session-start) points through the selection's
     current cumulative transform: scale and rotate around the fixed session-start center, then
     translate. Re-deriving every point fresh from the pristine original on every frame (rather
     than incrementally mutating the previous frame's already-transformed points) is what keeps
     repeated move/resize/rotate gestures in the same session from drifting — same reasoning as
     the Move-photo tool's moveGestureStart snapshot, applied here to ink instead of a photo. */
  function transformSelectionPoint(orig, center, t){
    let dx = (orig.x - center.x) * t.scale;
    let dy = (orig.y - center.y) * t.scale;
    const cos = Math.cos(t.rotation), sin = Math.sin(t.rotation);
    const rdx = dx * cos - dy * sin, rdy = dx * sin + dy * cos;
    return { x: center.x + rdx + t.tx, y: center.y + rdy + t.ty, pressure: orig.pressure };
  }
  function applySelectionTransform(){
    if(!selection) return;
    selection.strokes.forEach(s => {
      const orig = selection.originalPoints.get(s.id);
      s.points = orig.map(p => transformSelectionPoint(p, selection.center, selection.transform));
      s.size = Math.max(1, selection.originalSize.get(s.id) * selection.transform.scale);
    });
    redrawEditor();
  }
  function selectionVisualCenter(){
    return { x: selection.center.x + selection.transform.tx, y: selection.center.y + selection.transform.ty };
  }
  function updateSelectionBoxUI(){
    if(!selection){ selectionBoxEl.style.display = 'none'; return; }
    const vc = selectionVisualCenter();
    const w = selection.baseW * selection.transform.scale;
    const h = selection.baseH * selection.transform.scale;
    const cssScale = editorCanvas.clientWidth / CANVAS_W;
    const cw = w * cssScale, ch = h * cssScale;

    } else if(action.type === 'erase'){
      action.removed.forEach(({ strokeId }) => {
        const idx = editorState.strokes.findIndex(s => s.id === strokeId);
        if(idx !== -1) editorState.strokes.splice(idx, 1);
      });
    } else if(action.type === 'photo-set'){
      applyPhotoState(action.newPhotoDataURL, action.newPhotoTransform);
    } else if(action.type === 'photo-transform'){
      editorState.photoTransform = JSON.parse(JSON.stringify(action.newTransform));
    } else if(action.type === 'clear'){
      editorState.strokes = [];
      applyPhotoState(null, null);
    } else if(action.type === 'transform'){
      action.after.forEach(entry => {
        const s = editorState.strokes.find(st => st.id === entry.id);
        if(s){ s.points = clonePoints(entry.points); s.size = entry.size; }
      });
    }
    editorState.actions.push(action);
    updateEditorUndoRedoButtons();
    redrawEditor();
    autosaveEditorState();
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    if(editorState.strokes.length === 0 && !editorState.photoDataURL) return; /* nothing to clear */
    const prevStrokes = JSON.parse(JSON.stringify(editorState.strokes));
    const prevPhotoDataURL = editorState.photoDataURL;
    const prevPhotoTransform = JSON.parse(JSON.stringify(editorState.photoTransform));
    editorState.actions.push({ type: 'clear', prevStrokes, prevPhotoDataURL, prevPhotoTransform });
    editorState.redoActions = [];
    editorState.strokes = [];
    hidePhotoSelectUI();
    clearSelection();
    applyPhotoState(null, null);
    updateEditorUndoRedoButtons();
    redrawEditor();
    autosaveEditorState();
  });


  document.getElementById('photoDeleteBtn').addEventListener('click', () => {
    deletePhotoFromEditor();
  });

  document.getElementById('choosePhotoBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if(file) loadImageBlobIntoEditor(file);
    fileInput.value = '';
  });

  document.getElementById('pasteBtn').addEventListener('click', async () => {
    try{
      if(!navigator.clipboard || !navigator.clipboard.read) throw new Error('unsupported');
      const items = await navigator.clipboard.read();
      let found = false;
      for(const item of items){
        const type = item.types.find(t => t.startsWith('image/'));
        if(type){
          const blob = await item.getType(type);
          loadImageBlobIntoEditor(blob);
          found = true;
          break;
        }
      }
      if(!found) showToast('No image found on the clipboard');
    }catch(err){
      showToast("Paste isn't available here — try Photo instead");
    }
  });

  document.addEventListener('paste', e => {
    if(!editorModal.classList.contains('open')) return;
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(const item of items){
      if(item.type && item.type.indexOf('image/') === 0){
        e.preventDefault();
        const blob = item.getAsFile();
        if(blob) loadImageBlobIntoEditor(blob);
        return;
      }
    }
  });

  canvasWrap.addEventListener('dragover', e => e.preventDefault());
  canvasWrap.addEventListener('drop', e => {
    e.preventDefault();
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(file && file.type.indexOf('image/') === 0) loadImageBlobIntoEditor(file);
  });

  function loadImageBlobIntoEditor(blob){
    const prevPhotoDataURL = editorState.photoDataURL;
    const prevPhotoTransform = editorState.photoTransform ? JSON.parse(JSON.stringify(editorState.photoTransform)) : { scale: 1, offsetX: 0, offsetY: 0 };
    const reader = new FileReader();
    reader.onload = () => {
      const dataURL = reader.result;
      const img = new Image();
      img.onload = () => {
        editorState.baseImage = img;
        editorState.photoDataURL = dataURL;
        editorState.photoTransform = { scale: 1, offsetX: 0, offsetY: 0 };
        editorEmptyHint.style.display = 'none';
        editorState.actions.push({
          type: 'photo-set', prevPhotoDataURL, prevPhotoTransform,
          newPhotoDataURL: dataURL, newPhotoTransform: { scale: 1, offsetX: 0, offsetY: 0 }
        });
        editorState.redoActions = [];
        updateEditorUndoRedoButtons();
        redrawEditor();
        autosaveEditorState();
      };
      img.onerror = () => { showToast("Couldn't load that image"); };
      img.src = dataURL;
    };
    reader.onerror = () => { showToast("Couldn't load that image"); };
    reader.readAsDataURL(blob);
  }

  /* ===================== Boot ===================== */
  async function boot(){
    await loadProjectsIndex();
    /* Load only the active project so we can render right away; everything else loads in the background. */
    state = await ensureProjectLoaded(currentProjectId);
    appMode = 'main';
    resortOrderByScene();
    saveOrder(false);
    setEditMode(false);
    syncModeUI();
    updateUndoRedoButtons();
    renderFilmstrip();
    renderSidebar();
    preloadRemainingProjects();
  }
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW registration failed:', err));
    });
  }

  boot();

})();
</script>
</body>
</html>
