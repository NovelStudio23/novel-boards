  /* ===================== Reorder cuts (drag, orientation-aware) ===================== */
  function onHandlePointerDown(e, id, unitEl){
    if(!editMode || appMode === 'trash') return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    const portrait = isPortrait();
    const pointerId = e.pointerId;
    const startX = e.clientX, startY = e.clientY;
    const startScroll = portrait ? filmstripEl.scrollTop : filmstripEl.scrollLeft;
    let dragging = false;

    function computeTargetIndex(clientX, clientY){
      /* Re-query sibling rects on every call — caching them once at drag-start goes stale
         the moment autoscroll fires, which is what caused the reorder jitter. */
      const otherEntries = Array.from(filmstripEl.querySelectorAll('.cut-unit'))
        .filter(el => el.dataset.unitId !== id)
        .map(el => ({ id: el.dataset.unitId, rect: el.getBoundingClientRect() }));
      let count = 0;
      for(const o of otherEntries){
        const mid = portrait ? (o.rect.top + o.rect.height / 2) : (o.rect.left + o.rect.width / 2);
        const val = portrait ? clientY : clientX;
        if(val > mid) count++;
      }
      return count;
    }
    let currentTarget = computeTargetIndex(startX, startY);

    let scrollDir = 0;
    let rafId = null;
    /* Finger position as of the last real pointermove — cached so autoScrollLoop can recompute
       the drag transform on its own every frame too, not just when onMove happens to fire. See
       updateDragTransform's comment below for why that matters. */
    let lastPointerX = startX, lastPointerY = startY;
    /* Shared by onMove and autoScrollLoop so the compensating transform is recalculated on every
       single frame autoscroll actually moves the container — not just on pointermove events.
       Previously this only ran inside onMove, so holding the finger still near an edge (letting
       autoscroll run on its own via the independent rAF loop below) left the transform frozen at
       its last computed value while the container kept scrolling out from under it — the card
       would visibly lag/stick in place for however long the finger stayed still, then snap back
       to the correct position all at once the next time a pointermove happened to fire. Recomputing
       here too, using the latest actual scroll position every frame, keeps it glued to the finger
       continuously instead. */
    function updateDragTransform(){
      const dx = lastPointerX - startX, dy = lastPointerY - startY;
      const scrollDelta = (portrait ? filmstripEl.scrollTop : filmstripEl.scrollLeft) - startScroll;
      const adjDx = portrait ? dx : dx + scrollDelta;
      const adjDy = portrait ? dy + scrollDelta : dy;
      const primary = portrait ? adjDy : adjDx;
      const rot = Math.max(-4, Math.min(4, primary / 40));
      unitEl.style.transform = portrait
        ? 'translate(' + (dx * 0.12) + 'px,' + adjDy + 'px) scale(1.035) rotate(' + rot + 'deg)'
        : 'translate(' + adjDx + 'px,' + (dy * 0.12) + 'px) scale(1.035) rotate(' + rot + 'deg)';
    }
    function autoScrollLoop(){
      if(scrollDir !== 0){
        if(portrait) filmstripEl.scrollTo({ top: filmstripEl.scrollTop + scrollDir * 14, behavior: 'instant' });
        else filmstripEl.scrollTo({ left: filmstripEl.scrollLeft + scrollDir * 14, behavior: 'instant' });
        if(dragging) updateDragTransform();
      }
      rafId = requestAnimationFrame(autoScrollLoop);
    }

    function onMove(ev){
      if(ev.pointerId !== pointerId) return;
      lastPointerX = ev.clientX; lastPointerY = ev.clientY;
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if(!dragging && Math.hypot(dx, dy) > 7){
        dragging = true;
        unitEl.classList.add('dragging');
        if(!rafId) rafId = requestAnimationFrame(autoScrollLoop);
      }
      if(dragging){
        updateDragTransform();
        const contRect = filmstripEl.getBoundingClientRect();
        const edge = 50;
        if(portrait){
          if(ev.clientY < contRect.top + edge) scrollDir = -1;
          else if(ev.clientY > contRect.bottom - edge) scrollDir = 1;
          else scrollDir = 0;
        } else {
          if(ev.clientX < contRect.left + edge) scrollDir = -1;
          else if(ev.clientX > contRect.right - edge) scrollDir = 1;
          else scrollDir = 0;
        }
        currentTarget = computeTargetIndex(ev.clientX, ev.clientY);
      }
    }

    function onUp(ev){
      if(ev.pointerId !== pointerId) return;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      scrollDir = 0;
      if(rafId){ cancelAnimationFrame(rafId); rafId = null; }

      if(dragging){
        unitEl.classList.remove('dragging');
        unitEl.style.transform = '';
        applySceneAwareReorder(id, currentTarget);
      } else {
        toggleUnitMenu(id);
      }
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  function flashUnit(id){
    /* Only one of these exists at a time — .cut-unit in basic view, .tile in tile view. */
    const unit = filmstripEl.querySelector('.cut-unit[data-unit-id="' + id + '"], .tile[data-unit-id="' + id + '"]');
    if(!unit) return;
    unit.classList.remove('just-moved');
    void unit.offsetWidth;
    unit.classList.add('just-moved');
    setTimeout(() => unit.classList.remove('just-moved'), 1600);
  }
  function flashRow(el){
    if(!el) return;
    el.classList.remove('just-moved');
    void el.offsetWidth;
    el.classList.add('just-moved');
    setTimeout(() => el.classList.remove('just-moved'), 1600);
  }

  /* ===================== Insert / delete ===================== */
  /* Snapshots every current card's on-screen rect, keyed by cut id, so a subsequent re-render
     can FLIP-animate any survivors from their old position to their new one. Only meaningful
     in Normal View (tile view has no "+" insert entry point), but harmless to call regardless
     — tile mode just yields an empty map and the animation pass below becomes a no-op. */
  function captureCutUnitRects(){
    const map = {};
    filmstripEl.querySelectorAll('.cut-unit[data-unit-id]').forEach(el => {
      map[el.dataset.unitId] = el.getBoundingClientRect();
    });
    return map;
  }
  /* Plays the actual insertion animation after the DOM has already been rebuilt by
     renderFilmstrip(): every pre-existing card slides (via an inverted-transform FLIP) from its
     captured old rect into wherever it landed now — this is what reads as the trailing cards
     smoothly shifting right (landscape) or down (portrait) to make room — while the brand-new
     card (no old rect to slide from) simply fades into the gap that opened up for it. */
  function playInsertShiftAnimation(oldRects, newId){
    const DURATION = 620;
    const els = filmstripEl.querySelectorAll('.cut-unit[data-unit-id]');
    const portrait = isPortrait();
    const contRect = filmstripEl.getBoundingClientRect();
    const BUFFER = 600; // px beyond the visible edge to still animate, for smooth continuity
    const viewMin = (portrait ? contRect.top : contRect.left) - BUFFER;
    const viewMax = (portrait ? contRect.bottom : contRect.right) + BUFFER;

    /* READ PHASE: gather every element's new rect before touching any styles. The previous
       version read + wrote + forced a reflow (`void el.offsetWidth`) for one element at a time
       inside a single loop — interleaving reads and writes like that is textbook layout
       thrashing: each element's forced reflow invalidates the layout cache the *next*
       element's getBoundingClientRect() would otherwise reuse, so cost scaled up sharply with
       element count. Splitting into a read pass, then a write pass, then a *single* forced
       reflow for the whole batch fixes that regardless of how many cards are shifting.
       Separately: cards whose old *and* new position both sit well outside the viewport are
       skipped from the animation entirely — nobody can see them move either way, so spending
       transform/transition/compositor work on them just steals frame budget from the cards
       actually on screen. That combination is what made inserting near the start of a large
       (100+ shot) project specifically janky for the *visible* cards near the insertion point
       — most of the "shifting" work was being wasted animating an off-screen tail nobody could
       see, while inserting near the end never had that off-screen tail to begin with. */
    const moves = [];
    let newEl = null;
    els.forEach(el => {
      const id = el.dataset.unitId;
      if(id === newId){ newEl = el; return; }
      const oldRect = oldRects[id];
      if(!oldRect) return;
      const newRect = el.getBoundingClientRect();
      const dx = oldRect.left - newRect.left, dy = oldRect.top - newRect.top;
      if(!dx && !dy) return;
      const oldPos = portrait ? oldRect.top : oldRect.left;
      const newPos = portrait ? newRect.top : newRect.left;
      if((oldPos < viewMin || oldPos > viewMax) && (newPos < viewMin || newPos > viewMax)) return;
      moves.push({ el, dx, dy });
    });

    // WRITE PHASE: apply every "from" state in one batch.
    moves.forEach(m => {
      m.el.style.transition = 'none';
      m.el.style.transform = 'translate(' + m.dx + 'px,' + m.dy + 'px)';
    });
    if(newEl){
      newEl.style.transition = 'none';
      newEl.style.opacity = '0';
    }
    if(moves.length || newEl) void filmstripEl.offsetWidth; // one forced reflow for the whole batch

    requestAnimationFrame(() => requestAnimationFrame(() => {
      moves.forEach(m => {
        m.el.style.transition = 'transform ' + DURATION + 'ms cubic-bezier(.32,.72,0,1)';
        m.el.style.transform = '';
      });
      if(newEl){
        newEl.style.transition = 'opacity ' + DURATION + 'ms ease';
        newEl.style.opacity = '';
      }
    }));
    setTimeout(() => {
      moves.forEach(m => { m.el.style.transition = ''; m.el.style.transform = ''; });
      if(newEl){ newEl.style.transition = ''; newEl.style.opacity = ''; }
    }, DURATION + 20);
  }
  function insertCut(index){
    if(!editMode || appMode === 'trash') return;
    pushUndoSnapshot();
    const id = uid('c');
    let inheritedScene = '';
    if(state.order.length === 0) inheritedScene = 'S#1';
    else if(index > 0) inheritedScene = state.cuts[state.order[index - 1]].scene || '';
    else inheritedScene = state.cuts[state.order[0]].scene || '';
    state.cuts[id] = { id, scene: inheritedScene, notes: '', image: null };
    const oldRects = captureCutUnitRects();
    state.order.splice(index, 0, id);
    saveOrder();
    saveCut(id);
    renderFilmstrip();
    renderScenesList();
    playInsertShiftAnimation(oldRects, id);
    requestAnimationFrame(() => jumpToCut(id));
  }

  /* Deliberately does NOT call renumberAllScenesSequentially() — unlike delete/move-to-scene,
     duplicating never empties a scene or changes which scenes exist (the copy lands in the same
     scene as its source), so there's no scene-number gap it could ever create. Per-scene shot
     LETTERS (the "1A"/"1B" part) aren't stored on the cut at all — they're recomputed from
     position within the scene at render time, so the new shot correctly pushes later letters in
     its scene forward with no extra step here, same as insertCut above needs none either. */
  function duplicateCut(id){
    if(!editMode || appMode === 'trash') return;
    closeAllMenus();
    const src = state.cuts[id];
    if(!src || !state.order.includes(id)) return;
    pushUndoSnapshot();
    const newId = uid('c');
    const dup = { ...src, id: newId };
    /* Arrays inside a cut are always reassigned wholesale elsewhere, never mutated in place —
       the same invariant shallowCloneCuts (below) relies on for the global undo snapshot — so a
       shallow copy of the array itself is enough for the duplicate to get its own independent
       array without needing to also clone every element inside it. */
    if(Array.isArray(src.editorStrokes)) dup.editorStrokes = [...src.editorStrokes];
    if(Array.isArray(src.editorActions)) dup.editorActions = [...src.editorActions];
    if(Array.isArray(src.editorRedoActions)) dup.editorRedoActions = [...src.editorRedoActions];
    state.cuts[newId] = dup;
    const oldRects = captureCutUnitRects();
    const idx = state.order.indexOf(id);
    state.order.splice(idx + 1, 0, newId);
    saveOrder();
    saveCut(newId);
    renderFilmstrip();
    renderScenesList();
    playInsertShiftAnimation(oldRects, newId);
    requestAnimationFrame(() => jumpToCut(newId));
    showToast('Shot duplicated');
  }

  function deleteCut(id){
    if(!editMode) return;
    closeAllMenus();
    if(!state.order.includes(id)) return;
    pushUndoSnapshot();
    moveCutToTrash(id);
    resortTrashOrder();
    saveOrder();
    saveTrashOrder();
    saveCut(id);
    renumberAllScenesSequentially();
    renderFilmstrip();
    renderScenesList();
    renderTrashProjectsList();
    showToast('Moved to Trash');
  }

  /* opts.instant: search-result taps use this to jump without the smooth-scroll travel time —
     scrollIntoView({behavior:'instant'}) resolves synchronously, so the flash can fire right
     after it instead of via requestAnimationFrame (which is timed for the smooth case below,
     where the animation is still in flight and flashing immediately would fire mid-travel).
     Default (no opts) is unchanged: this remains the one documented exception to "scroll only
     via instant" — nav buttons, add-scene, etc. all still get the smooth travel + delayed flash. */
  function jumpToCut(id, opts){
    const instant = !!(opts && opts.instant);
    const unit = filmstripEl.querySelector('.cut-unit[data-unit-id="' + id + '"], .tile[data-unit-id="' + id + '"]');
    if(unit){
      const portrait = isPortrait();
      /* A leftover momentum scroll (from a flick just before this jump) would otherwise keep
         calling filmstripEl.scrollTo every animation frame right alongside the smooth
         scrollIntoView below — two drivers fighting over the same scrollTop each frame, which
         is exactly what makes the scrollbar/content look like it's jumping around erratically
         instead of traveling cleanly to the target. */
      if(tileMomentumCancel){ tileMomentumCancel(); tileMomentumCancel = null; }
      /* A nav-button jump can cover the whole list's scroll distance on a large project,
         producing many scroll events over a second or more. The scroll tracker above
         (findCenteredCutId) is O(shot count) per call, so letting it run on every one of
         those events adds real main-thread contention during exactly the window when the
         animation needs to stay smooth — on large projects (100+ shots) this was severe
         enough to visibly stall rendering. Suppress that tracking for the jump; we already
         know the destination, so set lastViewedCutId directly instead of waiting for the
         tracker to (re)discover it once scrolling settles. */
      jumpScrollSuppressed = true;
      clearTimeout(jumpScrollSuppressTimer);
      markViewedCut(id);
      unit.scrollIntoView({ behavior: instant ? 'instant' : 'smooth', inline: portrait ? 'nearest' : 'center', block: portrait ? 'center' : 'nearest' });
      if(instant) flashUnit(id);
      else requestAnimationFrame(() => flashUnit(id));
    }
  }

  /* ===================== Global undo / redo (structural changes) ===================== */
  /* This undo system only ever needs to track STRUCTURAL changes (order, scene assignment,
     trash state) — never drawing/photo content, which has its own separate per-cut undo system
     (editorActions/editorRedoActions, see the fullscreen editor). Every field that global undo
     might need to roll back (scene, notes, notesHtml, trashedScene/trashedShotNumber/trashedAt)
     is always *reassigned wholesale* elsewhere in the code, never mutated in place inside a
     nested array/object — so a one-level-deep shallow copy per cut is enough to correctly
     freeze a snapshot; it doesn't need JSON.parse(JSON.stringify(...)) walking into (and
     duplicating) every shot's image dataURL / editorStrokes / editorActions. That deep clone
     was happening on *every single* structural edit (it's what pushUndoSnapshot did under the
     hood), so its cost scaled with the *entire project's* image data, not just what changed —
     on a large project (250+ shots) this got expensive enough to exhaust memory and crash. */
  function shallowCloneCuts(cuts){
    const out = {};
    for(const id in cuts) out[id] = { ...cuts[id] };
    return out;
  }
  function snapshotState(){
    return { order: state.order.slice(), trashOrder: (state.trashOrder || []).slice(), cuts: shallowCloneCuts(state.cuts) };
  }
  function applySnapshot(snap){
    state.order = snap.order.slice();
    state.trashOrder = (snap.trashOrder || []).slice();
    state.cuts = shallowCloneCuts(snap.cuts);
  }
  function pushUndoSnapshot(){
    undoStack.push(snapshotState());
    if(undoStack.length > MAX_UNDO) undoStack.shift();
    redoStackGlobal = [];
    updateUndoRedoButtons();
  }
  /* Only re-persists cuts whose structural fields actually differ between oldCuts (the set
     just before an undo/redo swapped state.cuts) and the newly-restored state.cuts — comparing
     cheap string/primitive fields only, never touching image/editorStrokes data. Previously this
     unconditionally called saveCut() for every single cut in the project on every undo/redo
     click, which on a large project meant rewriting hundreds of storage entries (each
     potentially containing image data) for a single click. */
  function persistWholeState(oldCuts){
    saveOrder();
    saveTrashOrder();
    const newCuts = state.cuts;
    const ids = new Set([...Object.keys(oldCuts), ...Object.keys(newCuts)]);
    ids.forEach(id => {
      const before = oldCuts[id], after = newCuts[id];
      if(!after) return; // no longer present -- nothing to persist
      if(!before ||
         before.scene !== after.scene ||
         before.notes !== after.notes ||
         before.notesHtml !== after.notesHtml ||
         before.trashedScene !== after.trashedScene ||
         before.trashedShotNumber !== after.trashedShotNumber ||
         before.trashedAt !== after.trashedAt){
        saveCut(id);
      }
    });
  }
  function doUndo(){
    if(undoStack.length === 0) return;
    const current = snapshotState();
    const prev = undoStack.pop();
    redoStackGlobal.push(current);
    const oldCuts = state.cuts;
    applySnapshot(prev);
    persistWholeState(oldCuts);
    renderFilmstrip();
    renderScenesList();
    updateUndoRedoButtons();
  }
  function doRedo(){
    if(redoStackGlobal.length === 0) return;
    const current = snapshotState();
    const next = redoStackGlobal.pop();
    undoStack.push(current);
    const oldCuts = state.cuts;
    applySnapshot(next);
    persistWholeState(oldCuts);
    renderFilmstrip();
    renderScenesList();
    updateUndoRedoButtons();
  }
  function updateUndoRedoButtons(){
    const u = document.getElementById('topUndoBtn'), r = document.getElementById('topRedoBtn');
    if(u) u.classList.toggle('disabled', undoStack.length === 0);
    if(r) r.classList.toggle('disabled', redoStackGlobal.length === 0);
  }
  function resetUndoHistory(){
    undoStack = []; redoStackGlobal = []; updateUndoRedoButtons();
  }

  /* ===================== Scene auto-sort / reposition ===================== */
  function resortOrderByScene(){
    const withIndex = state.order.map((id, i) => ({ id, i, n: parseSceneNumber(state.cuts[id].scene) }));
    withIndex.sort((a, b) => {
      const an = a.n === null ? Infinity : a.n;
      const bn = b.n === null ? Infinity : b.n;
      if(an !== bn) return an - bn;
      return a.i - b.i;
    });
    state.order = withIndex.map(x => x.id);
  }

  function moveCutToEndOfScene(id, targetScene){
    const curIdx = state.order.indexOf(id);
    if(curIdx === -1) return;
    state.order.splice(curIdx, 1);
    if(!targetScene){ state.order.push(id); return; }
    let lastIdx = -1;
    state.order.forEach((oid, i) => { if((state.cuts[oid].scene || '').trim() === targetScene) lastIdx = i; });
    if(lastIdx === -1) state.order.push(id);
    else state.order.splice(lastIdx + 1, 0, id);
  }

  function applySceneReordering(){
    if(sceneEditedIds.size === 0) return;
    pushUndoSnapshot();
    sceneEditedIds.forEach(id => {
      if(!state.cuts[id]) return;
      moveCutToEndOfScene(id, (state.cuts[id].scene || '').trim());
    });
    sceneEditedIds.clear();
    resortOrderByScene();
    saveOrder();
    renumberAllScenesSequentially();
    renderFilmstrip();
    renderScenesList();
  }

  /* Moves a single cut from the main order into trash, freezing its scene/shot number as of
     this moment — trash display reads these frozen fields instead of cut.scene/position so a
     trashed shot's "last known" numbering doesn't drift as other things are trashed or restored
     around it. Caller is responsible for pushUndoSnapshot/save/render. */
  function moveCutToTrash(id, frozenIdx){
    const idx = state.order.indexOf(id);
    if(idx === -1) return false;
    const cut = state.cuts[id];
    if(cut){
      cut.trashedScene = cut.scene || '';
      cut.trashedShotNumber = (frozenIdx != null ? frozenIdx : idx) + 1;
      cut.trashedAt = Date.now();
    }
    state.order.splice(idx, 1);
    if(!state.trashOrder.includes(id)) state.trashOrder.push(id);
    return true;
  }

  /* Trash sort: most-recently-trashed first, then by the frozen scene number, then frozen
     shot number for ties (e.g. an entire scene trashed together, all at the same timestamp). */
  function resortTrashOrder(){
    const withMeta = state.trashOrder.map((id, i) => {
      const cut = state.cuts[id];
      return {
        id, i,
        trashedAt: cut && cut.trashedAt ? cut.trashedAt : 0,
        sceneNum: cut ? parseSceneNumber(cut.trashedScene) : null,
        shotNum: cut && cut.trashedShotNumber != null ? cut.trashedShotNumber : 0
      };
    });
    withMeta.sort((a, b) => {
      if(a.trashedAt !== b.trashedAt) return b.trashedAt - a.trashedAt;
      const asn = a.sceneNum === null ? Infinity : a.sceneNum;
      const bsn = b.sceneNum === null ? Infinity : b.sceneNum;
      if(asn !== bsn) return asn - bsn;
      if(a.shotNum !== b.shotNum) return a.shotNum - b.shotNum;
      return a.i - b.i;
    });
    state.trashOrder = withMeta.map(x => x.id);
  }

  /* Renumbers every remaining scene sequentially (1, 2, 3, ...) in their current order — used
     after any operation that can leave a gap, like moving or trashing a whole scene. */
  function renumberAllScenesSequentially(){
    const groups = computeSceneGroups();
    if(groups.length === 0) return;
    applySceneRenumbering(groups.map(g => g.scene));
  }

  /* Moves every shot in sourceScene into the end of targetScene, then renumbers every
     remaining scene sequentially so trashing/moving a middle scene never leaves a gap
     (e.g. 1,2,3,4 with 2 moved into 1 becomes 1,2,3 — not 1,3,4). */
  function moveSceneInto(sourceScene, targetScene){
    const affectedIds = state.order.filter(id => (state.cuts[id].scene || '').trim() === sourceScene);
    if(affectedIds.length === 0) return;
    pushUndoSnapshot();
    affectedIds.forEach(id => { state.cuts[id].scene = targetScene; });
    affectedIds.forEach(id => moveCutToEndOfScene(id, targetScene));
    resortOrderByScene();
    saveOrder();
    affectedIds.forEach(id => saveCut(id));
    renumberAllScenesSequentially();
    renderFilmstrip();
    renderScenesList();
  }
  async function renameScene(sceneText){
    closeAllSceneMenus();
    const number = parseSceneNumber(sceneText);
    if(number === null) return; /* no number to anchor the rename to — shouldn't normally happen */
    const currentName = parseSceneName(sceneText);
    const prefillText = buildSceneText(number, currentName);
    const result = await showPrompt('Rename Scene ' + number, prefillText, 'Rename');
    if(result === null) return; /* cancelled */
    let newName = result.trim();
    const prefixMatch = newName.match(new RegExp('^\\s*S#' + number + '\\s*-\\s*(.*)$'));
    if(prefixMatch) newName = prefixMatch[1].trim();
    const newText = buildSceneText(number, newName);
    if(newText === sceneText) return;
    pushUndoSnapshot();
    const changedIds = [];
    state.order.forEach(id => {
      if((state.cuts[id].scene || '').trim() === sceneText){
        state.cuts[id].scene = newText;
        changedIds.push(id);
      }
    });
    if(changedIds.length === 0) return;
    changedIds.forEach(id => saveCut(id));
    renderFilmstrip();
    renderScenesList();
  }

  function trashScene(sceneText){
    const affectedIds = state.order.filter(id => (state.cuts[id].scene || '').trim() === sceneText);
    if(affectedIds.length === 0) return;
    pushUndoSnapshot();
    const originalIndices = new Map(affectedIds.map(id => [id, state.order.indexOf(id)]));
    affectedIds.forEach(id => moveCutToTrash(id, originalIndices.get(id)));
    resortTrashOrder();
    saveOrder();
    saveTrashOrder();
    affectedIds.forEach(id => saveCut(id));
    renumberAllScenesSequentially();
    renderFilmstrip();
    renderScenesList();
    renderTrashProjectsList();
  }
  async function confirmTrashScene(sceneText){
    const ok = await showConfirm('Move all shots in scene "' + sceneText + '" to Trash?', 'Move to Trash');
    if(!ok) return;
    trashScene(sceneText);
    closeAllSceneMenus();
  }

  /* ===================== Mode management (main <-> trash) ===================== */
  function updateTitleDisplay(){
    if(appMode === 'trash'){
      titleEl.textContent = (state.title || 'Untitled Storyboard') + ' — Trash';
      titleEl.setAttribute('contenteditable', 'false');

  function enterSelectMode(){

    updateSelectToolbarSpacing();

  function exitSelectMode(){

    updateSelectButtonsUI();
  }
  function toggleSelectMode(){
    if(selectMode) exitSelectMode(); else enterSelectMode();
    if(!selectMode){ renderFilmstrip(); renderScenesList(); }
  }
  function toggleCutSelection(id, circleEl){
    if(selectedIds.has(id)){ selectedIds.delete(id); circleEl.classList.remove('selected'); }
    else { selectedIds.add(id); circleEl.classList.add('selected'); }
    updateSelectToolbar();
  }
  function buildSelectCircle(id){
    const circle = document.createElement('button');
    circle.className = 'select-circle' + (selectedIds.has(id) ? ' selected' : '');
    circle.innerHTML = ICONS.check;
    circle.addEventListener('click', e => { e.stopPropagation(); toggleCutSelection(id, circle); });
    return circle;
  }
  /* Scene-row selection (sidebar): selects/deselects every shot in a scene at once, so a whole
     scene can be picked for a batch action (Trash, Move to Scene, Delete) without hunting down
     each of its shots individually in the filmstrip. */
  function buildSceneSelectCircle(ids){
    const allSelected = ids.length > 0 && ids.every(id => selectedIds.has(id));
    const circle = document.createElement('button');
    circle.className = 'select-circle scene-select-circle' + (allSelected ? ' selected' : '');
    circle.innerHTML = ICONS.check;
    circle.addEventListener('click', e => { e.stopPropagation(); toggleSceneSelection(ids, circle, circle.closest('.scene-row')); });
    return circle;
  }
  function toggleSceneSelection(ids, circleEl, rowEl){
    if(ids.length === 0) return;
    const allSelected = ids.every(id => selectedIds.has(id));
    if(allSelected) ids.forEach(id => selectedIds.delete(id));
    else ids.forEach(id => selectedIds.add(id));
    if(circleEl) circleEl.classList.toggle('selected', !allSelected);
    if(rowEl) rowEl.classList.toggle('scene-selected', !allSelected);
    /* Sync each affected shot's own select-circle directly instead of a full renderFilmstrip()
       — cheap here, and avoids re-triggering the per-cut canvas setup cost (see Progress doc)
       for every shot in the scene on every tap. */
    ids.forEach(id => {
      const cutCircle = filmstripEl.querySelector(
        '.cut-unit[data-unit-id="' + id + '"] .select-circle, .tile[data-unit-id="' + id + '"] .select-circle'
      );
      if(cutCircle) cutCircle.classList.toggle('selected', !allSelected);
    });
    updateSelectToolbar();
  }

  /* ===================== Batch actions on selected cuts ===================== */
  function trashSelectedCuts(){
    if(selectedIds.size === 0) return;
    pushUndoSnapshot();
    const ids = Array.from(selectedIds);
    const originalIndices = new Map(ids.map(id => [id, state.order.indexOf(id)]));
    ids.forEach(id => moveCutToTrash(id, originalIndices.get(id)));
    resortTrashOrder();
    saveOrder();
    saveTrashOrder();
    ids.forEach(id => saveCut(id));
    renumberAllScenesSequentially();
    exitSelectMode();
    renderFilmstrip();
    renderScenesList();
    renderTrashProjectsList();
  }

  /* A "blank" shot has no drawn/attached content and no note text — genuinely nothing on it yet.
     Checks editorStrokes/editorPhoto in addition to cut.image, since autosave (Session 5) can
     leave real stroke/photo content sitting there even if the editor was never closed with Done
     (the only thing that flattens content into cut.image) — a shot with unsaved in-progress
     drawing should never be swept into Trash as "blank". */
  function isCutBlank(cut){
    if(!cut) return true;
    const hasImage = !!cut.image;
    const hasStrokes = Array.isArray(cut.editorStrokes) && cut.editorStrokes.length > 0;
    const hasPhoto = !!cut.editorPhoto;
    const hasNotes = getNotesPlainText(cut).trim().length > 0;
    return !hasImage && !hasStrokes && !hasPhoto && !hasNotes;
  }
  /* Same batch-trash pattern as trashSelectedCuts above (frozenIdx snapshotted before the loop
     starts, not per-iteration) — reversible via Trash/Put Back rather than a permanent delete,
     consistent with every other bulk-removal entry point in the app. */
  async function clearBlankShots(){
    const blankIds = state.order.filter(id => isCutBlank(state.cuts[id]));
    if(blankIds.length === 0){ showToast('No blank shots found'); return; }
    const plural = blankIds.length === 1 ? '' : 's';
    const ok = await showConfirm('Move ' + blankIds.length + ' blank shot' + plural + ' to Trash?', 'Move to Trash');
    if(!ok) return;
    pushUndoSnapshot();
    const originalIndices = new Map(blankIds.map(id => [id, state.order.indexOf(id)]));
    blankIds.forEach(id => moveCutToTrash(id, originalIndices.get(id)));
    resortTrashOrder();
    saveOrder();
    saveTrashOrder();
    blankIds.forEach(id => saveCut(id));
    renumberAllScenesSequentially();
    renderFilmstrip();
    renderScenesList();
    renderTrashProjectsList();
    showToast(blankIds.length + ' blank shot' + plural + ' moved to Trash');
  }
  function sortIdsByTrashOrder(ids){
    return ids.slice().sort((a, b) => {
      const ca = state.cuts[a], cb = state.cuts[b];
      const an = ca ? parseSceneNumber(ca.trashedScene) : null, bn = cb ? parseSceneNumber(cb.trashedScene) : null;
      const asn = an === null ? Infinity : an, bsn = bn === null ? Infinity : bn;
      if(asn !== bsn) return asn - bsn;
      const as = ca && ca.trashedShotNumber != null ? ca.trashedShotNumber : 0;
      const bs = cb && cb.trashedShotNumber != null ? cb.trashedShotNumber : 0;
      return as - bs;
    });
  }
  function finishPutBack(ids){
    resortOrderByScene();
    saveOrder();
    saveTrashOrder();
    ids.forEach(id => saveCut(id));
    exitSelectMode();
    renderFilmstrip();
    renderScenesList();
    renderTrashProjectsList();
    showToast(ids.length === 1 ? 'Shot restored' : ids.length + ' shots restored');
  }
  function clearTrashMeta(id){
    state.cuts[id].trashedScene = null;
    state.cuts[id].trashedShotNumber = null;
    state.cuts[id].trashedAt = null;
  }

  function openPutBackPicker(){
    if(selectedIds.size === 0) return;
    const groups = computeSceneGroups();
    const items = [
      { label: 'Beginning of Project', onClick: () => putBackAtEdge('start') },
      { label: 'End of Project', onClick: () => putBackAtEdge('end') }
    ];
    groups.forEach(g => {
      items.push({ label: 'Merge Into ' + g.scene, sublabel: g.count + (g.count === 1 ? ' shot' : ' shots'), onClick: () => putBackMergeIntoScene(g.scene) });
      items.push({ label: 'New Scene After ' + g.scene, sublabel: 'Independent scene', onClick: () => putBackAfterScene(g.scene) });
    });
    openGenericScenePicker('Put Back To…', items);
  }
  function putBackAtEdge(position){
    if(selectedIds.size === 0) return;
    pushUndoSnapshot();
    const ids = sortIdsByTrashOrder(Array.from(selectedIds));
    ids.forEach(id => { const idx = state.trashOrder.indexOf(id); if(idx !== -1) state.trashOrder.splice(idx, 1); });

    let newN;
    if(position === 'start'){
      newN = 1;
      applySceneShiftMapping(computeSceneShiftMapping(newN));
    } else {
      newN = getNextSceneNumber();
    }
    const sceneLabel = 'S#' + newN;
    ids.forEach(id => { state.cuts[id].scene = sceneLabel; clearTrashMeta(id); });
    state.order = position === 'start' ? ids.concat(state.order) : state.order.concat(ids);
    finishPutBack(ids);
  }
  function putBackAfterScene(afterScene){
    if(selectedIds.size === 0) return;
    const curNum = parseSceneNumber(afterScene);
    if(curNum === null) return;
    pushUndoSnapshot();
    const ids = sortIdsByTrashOrder(Array.from(selectedIds));
    ids.forEach(id => { const idx = state.trashOrder.indexOf(id); if(idx !== -1) state.trashOrder.splice(idx, 1); });

    const newN = curNum + 1;
    applySceneShiftMapping(computeSceneShiftMapping(newN));
    const sceneLabel = 'S#' + newN;
    ids.forEach(id => {
      state.cuts[id].scene = sceneLabel;
      clearTrashMeta(id);
      if(!state.order.includes(id)) state.order.push(id);
    });
    finishPutBack(ids);
  }
  function putBackMergeIntoScene(targetScene){
    if(selectedIds.size === 0) return;
    pushUndoSnapshot();
    const ids = sortIdsByTrashOrder(Array.from(selectedIds));
    ids.forEach(id => { const idx = state.trashOrder.indexOf(id); if(idx !== -1) state.trashOrder.splice(idx, 1); });
    ids.forEach(id => {
      state.cuts[id].scene = targetScene;
      clearTrashMeta(id);
      if(!state.order.includes(id)) state.order.push(id);
      moveCutToEndOfScene(id, targetScene);
    });
    finishPutBack(ids);
  }
  async function permanentlyDeleteCuts(ids){
    if(ids.length === 0) return;
    /* Deliberately NOT pushUndoSnapshot() here — both confirmation dialogs that lead to this
       promise the deletion "cannot be undone", but pushUndoSnapshot() would put it right back on
       the global Undo stack, letting the toolbar Undo button both restore the "deleted" cuts AND
       (via persistWholeState) re-save them to storage — the opposite of what was promised. Still
       clear the redo stack and refresh the buttons: any state-changing action should invalidate
       whatever used to be redoable, undoable-or-not. */
    redoStackGlobal = [];
    updateUndoRedoButtons();
    ids.forEach(id => {
      const oIdx = state.order.indexOf(id);
      if(oIdx !== -1) state.order.splice(oIdx, 1);
      const tIdx = state.trashOrder.indexOf(id);
      if(tIdx !== -1) state.trashOrder.splice(tIdx, 1);
      delete state.cuts[id];
    });
    saveOrder();
    saveTrashOrder();
    /* Deleting from the main list (not Trash) changes scene structure the same way trashing
       does, so it needs the same renumbering pass — e.g. deleting every shot in S#2 should
       collapse S#3, S#4... down to S#2, S#3... with no gap. Deleting from Trash instead (ids
       already absent from state.order) makes this a harmless no-op, since Trash's frozen
       scene/shot numbers are intentionally never renumbered — see moveCutToTrash. */
    renumberAllScenesSequentially();
    await Promise.all(ids.map(id => storDelete('project:' + currentProjectId + ':cut:' + id)));
    exitSelectMode();
    renderFilmstrip();
    renderScenesList();
    renderTrashProjectsList();
  }
  document.getElementById('selectAllBtn').addEventListener('click', () => {
    const activeOrder = appMode === 'trash' ? state.trashOrder : state.order;
    const allSelected = activeOrder.length > 0 && activeOrder.every(id => selectedIds.has(id));
    if(allSelected) selectedIds.clear();
    else activeOrder.forEach(id => selectedIds.add(id));
    renderFilmstrip();
    updateSelectToolbar();
  });
  document.getElementById('selectMoveBtn').addEventListener('click', () => openScenePicker());
  document.getElementById('selectTrashBtn').addEventListener('click', () => trashSelectedCuts());
  document.getElementById('selectDeleteBtn').addEventListener('click', async () => {
    const n = selectedIds.size;
    if(n === 0) return;
    const ok = await showConfirm('Permanently delete ' + n + (n === 1 ? ' shot' : ' shots') + '? This skips Trash and cannot be undone from here.', 'Delete');
    if(!ok) return;
    permanentlyDeleteCuts(Array.from(selectedIds));
  });
  document.getElementById('selectPutBackBtn').addEventListener('click', () => openPutBackPicker());
  document.getElementById('selectDeleteForeverBtn').addEventListener('click', async () => {
    const n = selectedIds.size;
    if(n === 0) return;
    const ok = await showConfirm('Permanently delete ' + n + (n === 1 ? ' shot' : ' shots') + '? This cannot be undone.', 'Delete');
    if(!ok) return;
    permanentlyDeleteCuts(Array.from(selectedIds));
  });

  /* ===================== Scene picker (Move to Scene) ===================== */
  /* Generic bottom-sheet picker reused for: moving selected shots to a scene, moving a whole
     scene into another, and (later) choosing a Put Back destination. */
  function openGenericScenePicker(title, items, emptyMessage){
    document.getElementById('scenePickerTitle').textContent = title;
    const listEl = document.getElementById('scenePickerList');
    listEl.innerHTML = '';
    if(items.length === 0){
      const empty = document.createElement('div');
      empty.className = 'sidebar-empty';
      empty.textContent = emptyMessage || 'Nothing available.';
      listEl.appendChild(empty);
    } else {
      items.forEach(it => {
        const row = document.createElement('button');
        row.className = 'scene-picker-item';
        row.innerHTML = '<span class="scene-item-num">' + escapeHtml(it.label) + '</span>' +
          (it.sublabel ? '<span class="scene-item-count">' + escapeHtml(it.sublabel) + '</span>' : '');
        row.addEventListener('click', () => { it.onClick(); closeScenePicker(); });
        listEl.appendChild(row);
      });
    }
    document.getElementById('scenePickerBackdrop').classList.add('show');
    document.getElementById('scenePickerModal').classList.add('show');
  }
  function closeScenePicker(){
    document.getElementById('scenePickerBackdrop').classList.remove('show');
    document.getElementById('scenePickerModal').classList.remove('show');
  }
  document.getElementById('scenePickerCancel').addEventListener('click', closeScenePicker);
  document.getElementById('scenePickerBackdrop').addEventListener('click', closeScenePicker);

  function openScenePicker(){
    if(selectedIds.size === 0) return;
    const groups = computeSceneGroups();
    const items = groups.map(g => ({
      label: 'SCENE ' + g.scene, sublabel: g.count + (g.count === 1 ? ' shot' : ' shots'),
      onClick: () => moveSelectedCutsToScene(g.scene)
    }));
    openGenericScenePicker('Move to Scene', items, 'No scenes yet — add one from the top bar first.');
  }
  function openMoveScenePicker(sourceScene){
    const groups = computeSceneGroups().filter(g => g.scene !== sourceScene);
    const items = groups.map(g => ({
      label: 'SCENE ' + g.scene, sublabel: g.count + (g.count === 1 ? ' shot' : ' shots'),
      onClick: () => moveSceneInto(sourceScene, g.scene)
    }));
    openGenericScenePicker('Move Scene ' + sourceScene + ' Into…', items, 'No other scenes to move into.');
  }

  function moveSelectedCutsToScene(sceneText){
    if(selectedIds.size === 0) return;
    pushUndoSnapshot();
    const ids = Array.from(selectedIds);
    ids.forEach(id => {
      if(!state.cuts[id]) return;
      state.cuts[id].scene = sceneText;
    });
    ids.forEach(id => moveCutToEndOfScene(id, sceneText));
    resortOrderByScene();
    saveOrder();
    ids.forEach(id => saveCut(id));
    renumberAllScenesSequentially();
    exitSelectMode();
    renderFilmstrip();
    renderScenesList();
  }

  /* ===================== Trash: empty actions ===================== */
  async function emptyTrash(){
    if(state.trashOrder.length === 0){ showToast('Trash is already empty'); return; }
    const n = state.trashOrder.length;
    const ok = await showConfirm('Permanently delete all ' + n + (n === 1 ? ' shot' : ' shots') + ' in Trash? This cannot be undone.', 'Empty Trash');
    if(!ok) return;
    await permanentlyDeleteCuts(state.trashOrder.slice());
    showToast('Trash emptied');
  }
  document.getElementById('emptyTrashBtn').addEventListener('click', emptyTrash);

  async function emptyProjectTrashById(id){
    const data = await ensureProjectLoaded(id);
    const trashIds = (data && data.trashOrder) ? data.trashOrder.slice() : [];
    if(trashIds.length === 0){ showToast('That trash is already empty'); return; }
    const proj = projects.find(p => p.id === id);
    const name = proj ? (proj.title || 'Untitled Storyboard') : 'this project';
    const ok = await showConfirm('Permanently delete all shots in "' + name + '"\u2019s trash? This cannot be undone.', 'Empty Trash');
    if(!ok) return;
    await Promise.all(trashIds.map(cid => storDelete('project:' + id + ':cut:' + cid)));
    trashIds.forEach(cid => { delete data.cuts[cid]; });
    data.trashOrder = [];
    await saveTrashOrderFor(id, data.trashOrder);
    if(currentProjectId === id){
      state.trashOrder = data.trashOrder;
      if(appMode === 'trash') renderFilmstrip();
    }
    closeAllTrashProjectMenus();
    renderTrashProjectsList();
    showToast('Trash emptied');
  }

  /* ===================== Sidebar: Trash folder project list ===================== */
  const trashProjectsListEl = document.getElementById('trashProjectsList');
  function renderTrashProjectsList(){
    trashProjectsListEl.innerHTML = '';
    sortedProjectsList().forEach(p => {
      const row = document.createElement('div');
      row.className = 'project-row';
      row.dataset.projectId = p.id;
      const data = projectDataCache[p.id];
      const count = data && data.trashOrder ? data.trashOrder.length : 0;

      const item = document.createElement('button');

  let sceneRefreshTimer = null;

  function computeSceneGroups(){
    const map = new Map();
    state.order.forEach((id, idx) => {
      const scene = (state.cuts[id].scene || '').trim();
      if(!scene) return;
      if(!map.has(scene)) map.set(scene, { scene, firstIndex: idx, firstId: id, count: 1 });
      else map.get(scene).count++;
    });
    const groups = Array.from(map.values());
    groups.sort((a, b) => {
      const na = parseSceneNumber(a.scene), nb = parseSceneNumber(b.scene);
      if(na !== null && nb !== null) return na - nb;
      if(na !== null) return -1;
      if(nb !== null) return 1;
      return a.scene.localeCompare(b.scene);
    });
    return groups;
  }

  function cutIdsForScene(sceneText){

      if(selectableHere){

  function renumberScene(oldText, newNumber){
    if(parseSceneNumber(oldText) === null) return oldText;
    return oldText.replace(/\d+/, String(newNumber));
  }

  /* Shared by every "make room for a scene at position N" operation (inserting a scene via
     +Scene, putting a trashed scene back at the very start, putting one back right after a
     given scene): every existing scene numbered >= minNumber needs to shift up by one first.
     Kept as two small steps (compute the mapping, then apply it) rather than one combined
     function since a caller occasionally needs the mapping's size before deciding whether
     there's anything to shift at all. */
  function computeSceneShiftMapping(minNumber){
    const groups = computeSceneGroups();
    const mapping = new Map();
    groups.forEach(g => {
      const n = parseSceneNumber(g.scene);
      if(n !== null && n >= minNumber) mapping.set(g.scene, renumberScene(g.scene, n + 1));
    });
    return mapping;
  }
  function applySceneShiftMapping(mapping){
    if(mapping.size === 0) return;
    state.order.forEach(id => {
      const cur = (state.cuts[id].scene || '').trim();
      if(mapping.has(cur)){
        const newText = mapping.get(cur);
        if(newText !== cur){ state.cuts[id].scene = newText; saveCut(id); }
      }
    });
  }

  function applySceneRenumbering(orderedSceneTexts){
    const mapping = new Map();
    orderedSceneTexts.forEach((oldText, i) => mapping.set(oldText, renumberScene(oldText, i + 1)));
    const changedIds = [];
    state.order.forEach(id => {
      const cur = (state.cuts[id].scene || '').trim();
      if(mapping.has(cur)){
        const newText = mapping.get(cur);
        if(newText !== cur){
          state.cuts[id].scene = newText;
          changedIds.push(id);
        }
      }
    });
    resortOrderByScene();
    saveOrder();
    changedIds.forEach(id => saveCut(id));
    renderFilmstrip();
    renderScenesList();
    return mapping;
  }

  let sceneMomentumCancel = null;
  function onSceneItemPointerDown(e, sceneText, firstId, itemEl, rowEl, opts){
    const restrictedMode = !!(opts && opts.restrictedMode);
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    if(sceneMomentumCancel){ sceneMomentumCancel(); sceneMomentumCancel = null; }
    const pointerId = e.pointerId;
    const startX = e.clientX, startY = e.clientY;
    const scroller = document.querySelector('.sidebar-scroll');
    const startScrollTop = scroller ? scroller.scrollTop : 0;
    let phase = 'idle'; /* idle -> scrolling | longpress -> drag, or tap, or cancelled */
    const velTracker = createVelocityTracker(startY);

    const timer = setTimeout(() => {
      /* Select mode: no long-press action sheet and no reorder-drag — a plain tap is the only
         gesture here, handled by the item's own .click listener (toggles the whole scene). */
      if(phase !== 'idle' || restrictedMode) return;
      phase = 'longpress';
      closeAllSceneMenus();
      rowEl.classList.add('menu-open');
      openSceneMenuId = sceneText;
      openSceneActionSheet(sceneText, rowEl);
    }, 420);

    function onMove(ev){
      if(ev.pointerId !== pointerId) return;
      const dist = Math.hypot(ev.clientX - startX, ev.clientY - startY);
      if(phase === 'idle'){
        if(dist > 10){
          /* Moved before the long-press fired — take this over as a manual scroll (scene rows
             use touch-action:none precisely so native scroll never gets a head start racing
             against our long-press timer, which is what used to make the list scroll out from
             under a reorder attempt). */
          phase = 'scrolling';
          clearTimeout(timer);
          velTracker.reset(ev.clientY);
        }
      } else if(phase === 'scrolling'){
        if(scroller) scroller.scrollTo({ top: startScrollTop - (ev.clientY - startY), behavior: 'instant' });
        velTracker.sample(ev.clientY);
      } else if(phase === 'longpress' && dist > 12){
        closeAllSceneMenus();
        phase = 'drag';
        cleanup();
        beginDrag();
      }
    }
    function onUp(ev){
      if(ev.pointerId !== pointerId) return;
      clearTimeout(timer);
      const wasIdle = phase === 'idle';
      const wasScrolling = phase === 'scrolling';
      cleanup();
      if(wasIdle){
        if(restrictedMode){
          /* Select mode: let the native click event bubble to the item's own .click listener
             (toggles selection for the whole scene) instead of navigating away and closing
             the sidebar — same convention as tile-view's restrictedMode tap handling. */
        } else {
          if(appMode === 'trash') exitTrashModeToMain();
          jumpToCut(firstId);
          closeSidebar();
        }
      } else if(wasScrolling && scroller){
        const perFrame = velocityToPerFrame(velTracker);
        if(perFrame !== null){
          sceneMomentumCancel = startMomentumScroll(scroller, 'y', perFrame);
        }
      }
    }
    function cleanup(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);

    function beginDrag(){
      rowEl.classList.add('dragging');
      const dragStartScrollTop = scroller ? scroller.scrollTop : 0;

      function computeTargetIndex(clientY){
        /* Re-query sibling rects on every call — caching them once at drag-start goes stale
           the moment autoscroll fires, which is what caused the reorder jitter. */
        const otherEntries = Array.from(sidebarListEl.querySelectorAll('.scene-row[data-scene]'))
          .filter(el => el.dataset.scene !== sceneText)
          .map(el => ({ scene: el.dataset.scene, rect: el.getBoundingClientRect() }));
        let count = 0;
        for(const o of otherEntries){
          const mid = o.rect.top + o.rect.height / 2;
          if(clientY > mid) count++;
        }
        return count;
      }
      let currentTarget = computeTargetIndex(startY);
      let scrollDir = 0, rafId = null;
      function autoScrollLoop(){
        if(scrollDir !== 0 && scroller) scroller.scrollTo({ top: scroller.scrollTop + scrollDir * 12, behavior: 'instant' });
        rafId = requestAnimationFrame(autoScrollLoop);
      }
      rafId = requestAnimationFrame(autoScrollLoop);

      function onDragMove(ev){
        if(ev.pointerId !== pointerId) return;
        ev.preventDefault();
        /* The item stays in normal flow, so container autoscroll already moves it on its own;
           compensate the manual translate by that same scroll delta so it doesn't double-move
           and drift away from the finger. */
        const scrollDelta = scroller ? (scroller.scrollTop - dragStartScrollTop) : 0;
        const dy = (ev.clientY - startY) + scrollDelta;
        rowEl.style.transform = 'translateY(' + dy + 'px) scale(1.02)';
        if(scroller){
          /* Boundary is the scene list's own top/bottom, not the whole sidebar — dragging past
             it into the projects/trash sections below shouldn't be what triggers autoscroll.
             But when the list is longer than the visible sidebar, its real top/bottom can sit
             off-screen — clamp to the scroller's own visible viewport too, or dragging near the
             edge of the SCREEN (which is all the user can actually reach) would never cross a
             boundary that isn't there to see, and autoscroll would never fire. */
          const listRect = sidebarListEl.getBoundingClientRect();
          const scrollerRect = scroller.getBoundingClientRect();
          const visibleTop = Math.max(listRect.top, scrollerRect.top);
          const visibleBottom = Math.min(listRect.bottom, scrollerRect.bottom);
          const edge = 40;
          if(ev.clientY < visibleTop + edge) scrollDir = -1;
          else if(ev.clientY > visibleBottom - edge) scrollDir = 1;
          else scrollDir = 0;
        }
        currentTarget = computeTargetIndex(ev.clientY);
      }
      function onDragUp(ev){
        if(ev.pointerId !== pointerId) return;
        document.removeEventListener('pointermove', onDragMove);
        document.removeEventListener('pointerup', onDragUp);
        scrollDir = 0;
        if(rafId) cancelAnimationFrame(rafId);
        rowEl.classList.remove('dragging');
        rowEl.style.transform = '';
        const visualOrderScenes = Array.from(sidebarListEl.querySelectorAll('.scene-row[data-scene]')).map(el => el.dataset.scene);
        const arr = visualOrderScenes.filter(s => s !== sceneText);
        arr.splice(currentTarget, 0, sceneText);
        pushUndoSnapshot();
        const mapping = applySceneRenumbering(arr);
        const newText = mapping.get(sceneText);
        requestAnimationFrame(() => flashRow(sidebarListEl.querySelector('.scene-row[data-scene="' + newText + '"]')));
      }
      document.addEventListener('pointermove', onDragMove);
      document.addEventListener('pointerup', onDragUp);
    }
  }

  /* ===================== Projects: sort + list + drag reorder ===================== */
  function sortedProjectsList(){
    if(projectSort.field === 'custom') return projects.slice();
    const arr = projects.slice();
    arr.sort((a, b) => {
      if(projectSort.field === 'title'){
        const cmp = (a.title || '').toLowerCase().localeCompare((b.title || '').toLowerCase());
        return projectSort.dir === 'asc' ? cmp : -cmp;
      }
      const av = (projectSort.field === 'created' ? a.createdAt : a.updatedAt) || 0;
      const bv = (projectSort.field === 'created' ? b.createdAt : b.updatedAt) || 0;
      return projectSort.dir === 'asc' ? (av - bv) : (bv - av);
    });
    return arr;
  }

  async function deleteProject(id){
    const proj = projects.find(p => p.id === id);
    const name = proj ? (proj.title || 'Untitled Storyboard') : 'this project';
    const ok = await showConfirm('Delete "' + name + '"? This cannot be undone.', 'Delete');
    if(!ok) return;
    closeAllProjectMenus();
    const data = await ensureProjectLoaded(id);
    if(data){
      const allCutIds = (data.order || []).concat(data.trashOrder || []);
      await Promise.all(allCutIds.map(cid => storDelete('project:' + id + ':cut:' + cid)));
    }
    await storDelete('project:' + id + ':order');
    await storDelete('project:' + id + ':trash');
    await storDelete('project:' + id + ':meta');
    delete projectDataCache[id];
    projects = projects.filter(p => p.id !== id);
    await saveProjectsIndex();
    if(currentProjectId === id){
      if(projects.length > 0){
        currentProjectId = projects[0].id;
        await storSet('active-project', currentProjectId);
        state = await ensureProjectLoaded(currentProjectId);
        appMode = 'main';
        resortOrderByScene();

  }

  function onProjectItemPointerDown(e, id, itemEl, rowEl){

    const pointerId = e.pointerId;

    let phase = 'idle'; /* idle -> longpress (reveals the delete chip), or cancelled by movement, or a tap */

      phase = 'longpress';
      closeAllProjectMenus();

      if(phase === 'idle' && dist > 10){
        phase = 'cancelled';
        clearTimeout(timer);
        cleanup();
      }
    }
    function onUp(ev){
      if(ev.pointerId !== pointerId) return;
      clearTimeout(timer);

    currentProjectId = id;

    appMode = 'main';

  function createNewProject(){
    const now = Date.now();
    const id = uid('p');
    projects.push({ id, title: 'Untitled Storyboard', createdAt: now, updatedAt: now });
    saveProjectsIndex();
    const data = { title: 'Untitled Storyboard', order: [], trashOrder: [], cuts: {} };
    addDefaultStarterCuts(data);
    projectDataCache[id] = data;
    saveOrderFor(id, data.order);
    data.order.forEach(cid => saveCutFor(id, cid, data.cuts[cid]));
    saveMetaFor(id, data.title);
    currentProjectId = id;

    resetUndoHistory();
    setViewMode('basic');

     cancel) via the same CSS classes, just as a separate element/id so it's not entangled with

  document.getElementById('exportMenuBackupBtn').addEventListener('click', async () => {
    closeExportMenu();
    try{
      const bundle = await gatherFullBackup();
      const stamp = new Date().toISOString().slice(0, 10);
      const filename = 'storyboard-backup-' + stamp + '.json';
      const blob = new Blob([JSON.stringify(bundle)], { type: 'application/json' });

      if(navigator.canShare && navigator.share){
        const file = new File([blob], filename, { type: 'application/json' });
        if(navigator.canShare({ files: [file] })){
          try{
            await navigator.share({ files: [file], title: filename });
            return;
          }catch(shareErr){
            if(shareErr && shareErr.name === 'AbortError') return;
            /* fall through to plain download */
          }
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      showToast('Backup saved to Downloads');
    }catch(err){
      showToast('Could not create a backup file');
    }

    document.getElementById('importInput').click();

  async function importBackupBundle(bundle){
    if(!bundle || !Array.isArray(bundle.projects) || !bundle.projectData){
      showToast("That file doesn't look like a valid backup");
      return false;
    }
    if(bundle.projects.length === 0){
      showToast('That backup has no projects — nothing to restore');
      return false;
    }
    const ok = await showConfirm("This replaces everything currently in the app with this backup. This can't be undone.", 'Restore');
    if(!ok) return false;

    /* Load every existing project's data first (some may only exist in storage, not yet in
       projectDataCache, if background preload hasn't reached them) — needed below to know the
       complete old cut list for orphan cleanup. oldProjectDataCache is the same object
       projectDataCache currently points to; ensureProjectLoaded mutates it in place, so reading
       from this reference after the awaits below still sees everything it loaded. */
    const oldProjects = projects.slice();
    const oldProjectDataCache = projectDataCache;
    await Promise.all(oldProjects.map(p => ensureProjectLoaded(p.id)));

    /* Whole projects that existed before but aren't in the new backup: delete all their
       storage (meta/order/trash/every cut), not just drop them from the in-memory list —
       otherwise they're orphaned in storage forever, invisible but still taking up space. */
    const newProjectIds = new Set(bundle.projects.map(p => p.id));
    const orphanedProjectIds = oldProjects.map(p => p.id).filter(id => !newProjectIds.has(id));
    await Promise.all(orphanedProjectIds.map(async pid => {
      const cached = oldProjectDataCache[pid];
      const cutIds = cached ? Object.keys(cached.cuts || {}) : [];
      await Promise.all(cutIds.map(cid => storDelete('project:' + pid + ':cut:' + cid)));
      await storDelete('project:' + pid + ':meta');
      await storDelete('project:' + pid + ':order');
      await storDelete('project:' + pid + ':trash');
    }));

    /* Fresh cache — otherwise any project or cut absent from this backup would keep showing
       its old in-memory data even though its storage was just deleted above (or, for a kept
       project whose cut list shrank, its removed cuts would still render from stale cache). */
    projectDataCache = {};

    for(const p of bundle.projects){
      const data = bundle.projectData[p.id];
      if(!data) continue;
      const newCuts = data.cuts || {};
      /* Same orphan cleanup as above, one level down: a project that's kept (same id, both
         old and new) can still have individual cuts that existed before but aren't in this
         backup's data for it. */
      const oldCached = oldProjectDataCache[p.id];
      if(oldCached && oldCached.cuts){
        const newCutIds = new Set(Object.keys(newCuts));
        const orphanedCutIds = Object.keys(oldCached.cuts).filter(cid => !newCutIds.has(cid));
        await Promise.all(orphanedCutIds.map(cid => storDelete('project:' + p.id + ':cut:' + cid)));
      }
      await saveMetaFor(p.id, data.title || p.title);
      await saveOrderFor(p.id, data.order || []);
      await saveTrashOrderFor(p.id, data.trashOrder || []);
      await Promise.all(Object.keys(newCuts).map(cid => saveCutFor(p.id, cid, newCuts[cid])));
      projectDataCache[p.id] = { title: data.title || p.title, order: data.order || [], trashOrder: data.trashOrder || [], cuts: newCuts };
    }
    projects = bundle.projects;
    await saveProjectsIndex();
    currentProjectId = projects[0].id;
    appMode = 'main';
    exitSelectMode();
    resetUndoHistory();
    await storSet('active-project', currentProjectId);
    state = projectDataCache[currentProjectId];
    syncModeUI();
    renderFilmstrip();
    renderSidebar();
    showToast('Backup restored');
    return true;
  }

  document.getElementById('importInput').addEventListener('change', async e => {

  /* ===================== PDF export ===================== */
  /* Independent of the app's own current viewMode ('basic'/'tile') — Export PDF is always
     reachable from the sidebar regardless of which view is on screen, but the export itself only
     ever offers two layouts (Vertical / Horizontal); there is no "tile" PDF layout. Scope is
     always the CURRENT project's active shots (state.order), grouped by scene via the same
     computeSceneGroups()/cutIdsForScene() the sidebar Scenes list already uses, so ordering and
     scene-text parsing stay consistent with the rest of the app. No library dependency: the
     "PDF" is a real print-formatted HTML document, generated fresh for both the in-app preview
     (an iframe, so it renders pixel-for-pixel identical to what actually prints) and the final
     export (the exact same document opened in a new tab, then window.print() — the person saves
     it as a PDF from Safari's own print sheet). */
  const HORIZONTAL_MAX_NOTE_LINES = 3;

  /* Plain-text note lines for export, trimmed of trailing blanks — deliberately NOT
     getRichLinesForCut/getNotesPlainText (Session 1's helper), which either pad to MIN_LINES
     (wrong for print, which should only show real content) or flatten multi-line HTML into one
     unbroken string (loses the line breaks export needs to lay out and to measure overflow
     against). Formatting (bold/italic/etc.) is intentionally dropped here — plain text keeps the
     print HTML generator simple, and nothing in the spec asked for styled text on the page. */
  function getExportNoteLines(cut){
    let rawLines;
    if(typeof cut.notesHtml === 'string' && cut.notesHtml){
      const tmp = document.createElement('div');
      tmp.innerHTML = sanitizeRichHtml(cut.notesHtml);
      rawLines = (tmp.children.length > 0 && Array.from(tmp.children).every(c => c.tagName === 'DIV'))
        ? Array.from(tmp.children).map(c => c.innerHTML)
        : [tmp.innerHTML];
    } else {
      rawLines = (cut.notes || '').split('\n').map(l => escapeHtml(l));
    }
    const lines = rawLines.map(h => stripTagsToText(h));
    while(lines.length && lines[lines.length - 1].trim() === '') lines.pop();
    return lines;
  }
  function getExportSceneGroups(){
    const labels = computeMainShotLabels();
    return computeSceneGroups().map(g => ({
      sceneText: g.scene,
      shots: cutIdsForScene(g.scene).map(id => {
        const cut = state.cuts[id];
        return {
          id, label: labels[id] || '',
          sceneNumber: parseSceneNumber(cut.scene || g.scene),
          image: cut.image || null,
          noteLines: getExportNoteLines(cut)
        };
      })
    }));
  }

    const css =

      '.frame-col{ flex:0 0 auto; width:330px; text-align:left; }' +

      '@media print{ .doc-inner{ width:auto; margin:0; padding:0; box-shadow:none; background:none; } }';

  function buildHorizontalExportHtml(groups){
    const PANELS_PER_PAGE = 6;
    const pages = [];
    let current = [];
    let currentSceneText = '';
    function flush(){ if(current.length){ pages.push({ sceneText: currentSceneText, panels: current }); current = []; } }
    groups.forEach(g => {
      flush(); /* new page per scene, same as before */
      currentSceneText = g.sceneText;
      g.shots.forEach(s => {
        /* Horizontal is the image-focused layout — notes are always a brief silent-truncated
           snippet here; Vertical is the layout for complete notes instead. Padded to exactly
           HORIZONTAL_MAX_NOTE_LINES slots (blank ones still ruled) so every panel's notes area
           reads as consistent ruled paper regardless of how much a shot's note actually has,
           matching the reference template's look. */
        const lines = s.noteLines.slice(0, HORIZONTAL_MAX_NOTE_LINES);
        while(lines.length < HORIZONTAL_MAX_NOTE_LINES) lines.push('');
        current.push({ label: s.label, image: s.image, noteLines: lines });
        if(current.length === PANELS_PER_PAGE) flush();
      });
    });
    flush();

    const pagesHtml = pages.map(pg => {
      const panelsHtml = pg.panels.map(p =>
        '<div class="panel">' +
          '<div class="panel-frame">' +
            '<div class="frame-label">' + escapeHtml(p.label) + '</div>' +
            (p.image ? '<img src="' + p.image + '">' : '') +
          '</div>' +
          '<div class="panel-notes">' + p.noteLines.map(l => '<div class="note-line">' + escapeHtml(l) + '</div>').join('') + '</div>' +
        '</div>'
      ).join('');
      return '<div class="page"><div class="page-header">' + escapeHtml(pg.sceneText) + '</div><div class="panel-grid">' + panelsHtml + '</div></div>';
    }).join('');

    const css =
      '@page{ size:A4 landscape; margin:0; }' +
      '.page{ width:297mm; height:210mm; padding:10mm; page-break-after:always; }' +
      '.page:last-child{ page-break-after:auto; }' +
      '.page-header{ font-weight:800; font-size:13px; letter-spacing:.05em; text-transform:uppercase; margin-bottom:6mm; padding-bottom:2mm; border-bottom:1.5px solid #111; }' +
      '.panel-grid{ display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:auto; gap:8mm; width:100%; justify-content:start; align-content:start; }' +
      /* Near-square rectangle (slightly wider than tall), not a perfect square — matches the
         reference template Kevin shared, which measures roughly 9:8 per panel. */
      '.panel{ aspect-ratio:9/8; border:2px solid #111; display:flex; flex-direction:column; overflow:hidden; }' +
      /* Divider line between image and notes areas, ~73/27 split — matches the reference. */
      '.panel-frame{ position:relative; flex:73 1 0; min-height:0; background:#eee; display:flex; align-items:center; justify-content:center; }' +
      '.panel-frame img{ width:100%; height:100%; object-fit:contain; }' +
      '.frame-label{ position:absolute; top:3px; left:3px; z-index:2; background:rgba(0,0,0,.6); color:#fff; font-size:9.6px; font-weight:800; letter-spacing:.03em; padding:2px 5px; border-radius:3px; }' +
      '.panel-notes{ flex:27 1 0; min-height:0; padding:2px 7px; border-top:1.5px solid #111; display:flex; flex-direction:column; justify-content:center; gap:2px; }' +
      '.panel-notes .note-line{ font-size:10.5px; line-height:1.35; border-bottom:1px solid #ccc; padding:1px 0; min-height:13px; }' +
      '@media screen{ body{ background:#6b6b6e; padding:20px 0; } .page{ margin:0 auto 20px; background:#fff; box-shadow:0 6px 20px rgba(0,0,0,.35); zoom:.42; } }' +
      '@media print{ .page{ margin:0; box-shadow:none; } }';
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Storyboard</title><style>' + PDF_BASE_CSS + css + '</style></head>' +
      '<body>' + pagesHtml + '</body></html>';
  }

  /* ---- Overlay state + wiring ---- */
  const pdfExportBackdrop = document.getElementById('pdfExportBackdrop');
  const pdfExportPanel = document.getElementById('pdfExportPanel');

  /* Range is picked by array INDEX into the current full scene-group list, not by parsed scene
     number — sidesteps any edge case around non-numeric or gapped scene text entirely, since the
     select options are built directly from whatever computeSceneGroups() actually returned. */
  function populatePdfSceneRange(groups){
    const optionsHtml = groups.map((g, i) => '<option value="' + i + '">' + escapeHtml(g.sceneText) + '</option>').join('');
    pdfSceneFromSelect.innerHTML = optionsHtml;

    renderPdfPreview();

       but still async decode) and layout to settle before print() captures accurate page content. */
    setTimeout(() => { try{ win.print(); }catch(e){} }, 400);
  });

  /* ===================== Shared canvas drawing helpers ===================== */
  function renderFrameCanvas(ctx, baseImage, strokes, transform){
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.globalCompositeOperation = 'source-over';
    if(baseImage){
      const t = transform || { scale: 1, offsetX: 0, offsetY: 0 };
      const fitScale = Math.min(CANVAS_W / baseImage.width, CANVAS_H / baseImage.height);
      const scale = fitScale * t.scale;
      const w = baseImage.width * scale, h = baseImage.height * scale;
      const x = (CANVAS_W - w) / 2 + t.offsetX, y = (CANVAS_H - h) / 2 + t.offsetY;
      ctx.drawImage(baseImage, x, y, w, h);
    }
    strokes.forEach(s => drawStroke(ctx, s));
    ctx.globalCompositeOperation = 'source-over';
  }

  function flattenToDataURL(ctx, baseImage, strokes, transform){
    const canvas = ctx.canvas;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
    /* No white fillRect here: baking an opaque background over the *entire* canvas is what
       made the guide lines disappear the moment this got reloaded as baseImage elsewhere —
       the flattened image, being opaque everywhere, sat in front of the guide divs and hid
       them even in empty areas that were never actually drawn on. PNG keeps true transparency
       so only the actually-drawn pixels (strokes / pasted photo) cover the guides. */
    if(baseImage){
      const t = transform || { scale: 1, offsetX: 0, offsetY: 0 };
      const fitScale = Math.min(canvas.width / baseImage.width, canvas.height / baseImage.height);
      const scale = fitScale * t.scale;
      const w = baseImage.width * scale, h = baseImage.height * scale;
      const x = (canvas.width - w) / 2 + t.offsetX, y = (canvas.height - h) / 2 + t.offsetY;
      ctx.drawImage(baseImage, x, y, w, h);
    }
    strokes.forEach(s => drawStroke(ctx, s));
    const url = canvas.toDataURL('image/png');
    renderFrameCanvas(ctx, baseImage, strokes, transform);
    return url;
  }

  function drawStroke(ctx, stroke, highlight){
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    /* Highlight pass (selection tool) always draws normally on top — it's a visual indicator,
       never an eraser mask — and paints wider than the real ink so it reads as a soft glow
       around the stroke rather than replacing it. */
    const effSize = highlight ? stroke.size + 10 : stroke.size;
    ctx.globalCompositeOperation = (!highlight && stroke.mode === 'eraser') ? 'destination-out' : 'source-over';
    ctx.strokeStyle = highlight ? 'rgba(224,80,42,0.35)' : (stroke.mode === 'eraser' ? 'rgba(0,0,0,1)' : stroke.color);
    ctx.fillStyle = ctx.strokeStyle;
    const pts = stroke.points;
    if(pts.length < 2){
      const p = pts[0];
      if(p){ ctx.beginPath(); ctx.arc(p.x, p.y, effSize / 2, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
      return;
    }
    if(pts.length === 2){
      const a = pts[0], b = pts[1];
      ctx.lineWidth = effSize * (0.5 + 0.5 * (b.pressure == null ? 0.5 : b.pressure));
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.restore();
      return;
    }
    /* Quadratic-curve-through-midpoints: instead of straight lineTo segments between raw
       samples (which looks like a jagged polygon at normal sampling rates), curve through
       the midpoint of each consecutive pair, using the actual sampled point as the control
       point. This is the standard technique native drawing apps use for natural-looking
       freehand strokes. Each segment is still stroked separately so pressure-based width
       variation per point is preserved. */
    for(let i = 1; i < pts.length - 1; i++){
      const cur = pts[i], next = pts[i + 1];
      const midX = (cur.x + next.x) / 2, midY = (cur.y + next.y) / 2;
      const prevMid = i === 1 ? pts[0] : { x: (pts[i - 1].x + cur.x) / 2, y: (pts[i - 1].y + cur.y) / 2 };
      ctx.lineWidth = effSize * (0.5 + 0.5 * (cur.pressure == null ? 0.5 : cur.pressure));
      ctx.beginPath();
      ctx.moveTo(prevMid.x, prevMid.y);
      ctx.quadraticCurveTo(cur.x, cur.y, midX, midY);
      ctx.stroke();
    }
    const last = pts[pts.length - 1];
    const secondLast = pts[pts.length - 2];
    const lastMid = { x: (secondLast.x + last.x) / 2, y: (secondLast.y + last.y) / 2 };
    ctx.lineWidth = effSize * (0.5 + 0.5 * (last.pressure == null ? 0.5 : last.pressure));
    ctx.beginPath();
    ctx.moveTo(lastMid.x, lastMid.y);
    ctx.lineTo(last.x, last.y);
    ctx.stroke();
    ctx.restore();
  }

  function toLocalPoint(canvas, e){
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (CANVAS_W / rect.width);
    const y = (e.clientY - rect.top) * (CANVAS_H / rect.height);
    const pressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
    return { x, y, pressure };
  }

  /* ===================== Inline (on-card) Apple Pencil drawing ===================== */
  function setupInlineCanvas(canvas, cut, unit, hintEl){
    const ctx = canvas.getContext('2d');
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
    const rec = { ctx, baseImage: null, strokes: [] };
    unit._inline = rec;
    unit._hintEl = hintEl;

    if(cut.image){
      hintEl.style.display = 'none';
      const img = new Image();
      img.onload = () => { rec.baseImage = img; renderFrameCanvas(ctx, rec.baseImage, rec.strokes); };
      img.src = cut.image;
    } else {
      renderFrameCanvas(ctx, rec.baseImage, rec.strokes);
    }

    /* Inline-canvas drawing has been removed entirely (neither finger nor Apple Pencil can draw
       here anymore) — drawing only happens in the fullscreen editor now. This canvas now only
       needs to detect a quick tap (any pointer type) to open that editor; anything that isn't a
       clean tap (a drag, a scroll) is ignored so it doesn't fight with normal scrolling. */
    let tap = false, tapId = null, tapX = 0, tapY = 0, tapT = 0;

    canvas.addEventListener('pointerdown', e => {
      if(!editMode || appMode === 'trash') return;
      if(selectMode) return; /* let the tap bubble up as a click and toggle card selection instead */
      tap = true; tapId = e.pointerId; tapX = e.clientX; tapY = e.clientY; tapT = Date.now();
    });
    canvas.addEventListener('pointermove', e => {
      if(tap && e.pointerId === tapId){
        if(Math.hypot(e.clientX - tapX, e.clientY - tapY) > 8) tap = false;
      }
    });
    canvas.addEventListener('pointerup', e => {
      if(tap && e.pointerId === tapId){
        const dt = Date.now() - tapT;
        tap = false;
        if(dt < 500) openEditor(cut.id, canvas.parentElement);
      }
    });
    canvas.addEventListener('pointercancel', () => { tap = false; });
  }

  /* ===================== Fullscreen editor ===================== */
  const editorModal = document.getElementById('editorModal');
  const editorTopbarEl = document.getElementById('editorTopbar');
  const editorFrameInnerEl = document.getElementById('editorFrameInner');
  const editorCanvas = document.getElementById('editorCanvas');
