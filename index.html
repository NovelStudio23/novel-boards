  /* ===================== Edit mode ===================== */
  /* Finds whichever shot card is currently closest to the center of the viewport, so its
     position can be restored after something (a re-render, a CSS-driven width change) would
     otherwise leave the scroll position pointing at different content than what the user was
     actually looking at. */
  function findCenteredCutId(){
    const portrait = isPortrait();
    const selector = viewMode === 'tile' ? '.tile[data-unit-id]' : '.cut-unit[data-unit-id]';
    const els = filmstripEl.querySelectorAll(selector);
    if(els.length === 0) return null;
    const containerRect = filmstripEl.getBoundingClientRect();
    const centerPoint = portrait ? (containerRect.top + containerRect.height / 2) : (containerRect.left + containerRect.width / 2);
    let closestId = null, closestDist = Infinity;
    els.forEach(el => {
      const r = el.getBoundingClientRect();
      const mid = portrait ? (r.top + r.height / 2) : (r.left + r.width / 2);
      const dist = Math.abs(mid - centerPoint);
      if(dist < closestDist){ closestDist = dist; closestId = el.dataset.unitId; }
    });
    return closestId;
  }
  function restoreScrollToCut(id){
    const selector = viewMode === 'tile' ? '.tile[data-unit-id="' + id + '"]' : '.cut-unit[data-unit-id="' + id + '"]';
    const el = filmstripEl.querySelector(selector);
    if(!el) return;
    const portrait = isPortrait();
    el.scrollIntoView({ behavior: 'instant', inline: portrait ? 'nearest' : 'center', block: portrait ? 'center' : 'nearest' });
  }

  /* Continuously track whichever shot is centered as the user scrolls, so that when the device
     rotates (landscape <-> portrait), we know what to scroll back to. Orientation changes swap
     the scroll axis entirely (scrollLeft <-> scrollTop), which otherwise resets to 0 and jumps
     the view back to the first shot with no way to recover "what was centered before" from
     inside the resize handler itself — by then the old layout is already gone. */
  let lastViewedCutId = null;
  let jumpScrollSuppressed = false;
  let jumpScrollSuppressTimer = null;
  /* Every place that scroll-restores to a known shot (this tracker, jumpToCut, setEditMode's own
     restore, the orientation-resize restore below) should also mark that shot as the current
     lastViewedCutId immediately and synchronously, not just leave it to this tracker to
     rediscover asynchronously off the resulting 'scroll' event. Two real, observed failure modes
     came from skipping that: (1) rotating again quickly, before the previous rotation's restore
     had gotten back around to a 'scroll' event confirming lastViewedCutId — the second rotation
     would snapshot a stale pre-restore value instead of where it had just settled; (2) toggling
     edit mode (including pressing Done) restores scroll via a completely separate code path in
     setEditMode that never touched lastViewedCutId at all, so a rotation shortly after used
     whatever was tracked before entering/leaving edit mode instead of the shot actually on
     screen. Centralized here so every restore path stays in sync the same way. */
  function markViewedCut(id){ if(id) lastViewedCutId = id; }
  /* Tracks the viewport size as of the last time we knew it was settled (i.e. not mid-rotation).
     The orientation handler below updates this the instant it runs — but the axis-flip side
     effect (landscape's scrollLeft vs portrait's scrollTop both reset to 0 when the grid
     direction changes) can in some browsers fire its 'scroll' event *before* that handler gets a
     chance to run and snapshot pendingOrientationRestoreId, corrupting lastViewedCutId with
     "whatever's nearest position 0" (the start of the list) ahead of time — occasionally showing
     up as "jumps to the beginning" a rotation or two in, since the corruption only happens when
     that race is lost. Comparing against the last-settled size (rather than relying on which
     event happens to fire first) closes that race regardless of ordering: any scroll event that
     shows up while the live size disagrees with the last-settled one is a rotation artifact, not
     a real user scroll, and is ignored here. */
  let lastSettledW = window.innerWidth, lastSettledH = window.innerHeight;
  let lastScrollTrackTime = 0;
  filmstripEl.addEventListener('scroll', () => {
    if(jumpScrollSuppressed){
      /* Keep pushing the "settled" timer out on every scroll event; once movement genuinely
         stops (no more events for 150ms), this clears and tracking resumes normally. Adapts
         automatically to however long the jump's smooth-scroll animation actually takes for
         its distance, rather than guessing a fixed duration. */
      clearTimeout(jumpScrollSuppressTimer);
      jumpScrollSuppressTimer = setTimeout(() => { jumpScrollSuppressed = false; }, 150);
      return;
    }
    /* Reads synchronously, right on the scroll event, rather than deferring the read to the next
       animation frame — a deferred read leaves a ~16ms window where a resize/orientation event
       could fire and snapshot a value that's one scroll event out of date, which on a quick flick-
       then-immediately-rotate was enough to occasionally grab the wrong shot. findCenteredCutId is
       real DOM work (O(shot count)), so this is throttled by elapsed time instead — cheaper than
       every single scroll event on a long flick/momentum scroll, but without rAF's inherent lag. */
    if(window.innerWidth !== lastSettledW || window.innerHeight !== lastSettledH) return;
    const now = performance.now();
    if(now - lastScrollTrackTime < 48) return;
    lastScrollTrackTime = now;
    markViewedCut(findCenteredCutId());
  }, { passive: true });

  /* ===================== Tile View custom scrollbar ===================== */
  /* See the ::-webkit-scrollbar comment on .filmstrip.tile-mode for why this exists: the native
     overlay scroll indicator doesn't reliably track scrollTop/scrollLeft when the scroll was
     driven by a programmatic scrollTo() rather than a native touch-pan gesture, which is exactly
     what happens whenever a Tile View scroll starts on a .tile (touch-action:none there forces
     onTilePointerDown to drive it manually). This thumb is instead recomputed directly from real
     scroll geometry on every 'scroll' event, so it can never disagree with the actual position —
     regardless of whether that scroll came from a native pan on the gaps between tiles, an
     onTilePointerDown-driven scrollTo, or a drag on this thumb itself (below). */
  let tileScrollbarHideTimer = null;
  function updateTileScrollbar(){
    if(viewMode !== 'tile'){ tileScrollbarEl.classList.remove('show'); return; }
    const portrait = isPortrait();
    const inset = 8;
    if(portrait){
      const max = filmstripEl.scrollHeight - filmstripEl.clientHeight;
      const trackLen = filmstripEl.offsetHeight - inset * 2;
      tileScrollbarEl.style.top = (filmstripEl.offsetTop + inset) + 'px';
      tileScrollbarEl.style.left = (filmstripEl.offsetLeft + filmstripEl.offsetWidth - 7) + 'px';
      tileScrollbarEl.style.width = '5px';
      tileScrollbarEl.style.height = trackLen + 'px';
      if(max <= 0){ tileScrollbarEl.classList.remove('show'); return; }
      const thumbLen = Math.max(28, trackLen * (filmstripEl.clientHeight / filmstripEl.scrollHeight));
      const travel = trackLen - thumbLen;
      const frac = filmstripEl.scrollTop / max;
      tileScrollbarThumbEl.style.top = (travel * frac) + 'px';
      tileScrollbarThumbEl.style.left = '0px';
      tileScrollbarThumbEl.style.width = '5px';
      tileScrollbarThumbEl.style.height = thumbLen + 'px';
    } else {
      const max = filmstripEl.scrollWidth - filmstripEl.clientWidth;
      const trackLen = filmstripEl.offsetWidth - inset * 2;
      tileScrollbarEl.style.left = (filmstripEl.offsetLeft + inset) + 'px';
      tileScrollbarEl.style.top = (filmstripEl.offsetTop + filmstripEl.offsetHeight - 7) + 'px';
      tileScrollbarEl.style.height = '5px';
      tileScrollbarEl.style.width = trackLen + 'px';
      if(max <= 0){ tileScrollbarEl.classList.remove('show'); return; }
      const thumbLen = Math.max(28, trackLen * (filmstripEl.clientWidth / filmstripEl.scrollWidth));
      const travel = trackLen - thumbLen;
      const frac = filmstripEl.scrollLeft / max;
      tileScrollbarThumbEl.style.left = (travel * frac) + 'px';
      tileScrollbarThumbEl.style.top = '0px';
      tileScrollbarThumbEl.style.height = '5px';
      tileScrollbarThumbEl.style.width = thumbLen + 'px';
    }
    tileScrollbarEl.classList.add('show');
  }
  filmstripEl.addEventListener('scroll', () => {
    if(viewMode !== 'tile') return;
    updateTileScrollbar();
    clearTimeout(tileScrollbarHideTimer);
    tileScrollbarHideTimer = setTimeout(() => tileScrollbarEl.classList.remove('show'), 700);
  }, { passive: true });
  /* Lets the thumb itself be grabbed and dragged directly too — the same interaction Kevin
     already relies on with the native scrollbar elsewhere, kept working here even though the
     native one is hidden for Tile View. */
  tileScrollbarThumbEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    if(tileMomentumCancel){ tileMomentumCancel(); tileMomentumCancel = null; }
    const portrait = isPortrait();
    const pointerId = e.pointerId;
    tileScrollbarThumbEl.setPointerCapture(pointerId);
    clearTimeout(tileScrollbarHideTimer);
    const startClient = portrait ? e.clientY : e.clientX;
    const startScroll = portrait ? filmstripEl.scrollTop : filmstripEl.scrollLeft;
    const max = portrait ? (filmstripEl.scrollHeight - filmstripEl.clientHeight) : (filmstripEl.scrollWidth - filmstripEl.clientWidth);
    const trackLen = (portrait ? filmstripEl.offsetHeight : filmstripEl.offsetWidth) - 16;
    const thumbLen = portrait ? tileScrollbarThumbEl.offsetHeight : tileScrollbarThumbEl.offsetWidth;
    const travel = Math.max(1, trackLen - thumbLen);
    function onMove(ev){
      if(ev.pointerId !== pointerId) return;
      const delta = (portrait ? ev.clientY : ev.clientX) - startClient;
      const next = Math.max(0, Math.min(max, startScroll + (delta / travel) * max));
      if(portrait) filmstripEl.scrollTo({ top: next, behavior: 'instant' });
      else filmstripEl.scrollTo({ left: next, behavior: 'instant' });
    }
    function onUp(ev){
      if(ev.pointerId !== pointerId) return;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      tileScrollbarHideTimer = setTimeout(() => tileScrollbarEl.classList.remove('show'), 700);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });

  let orientationRestoreTimer = null;
  let pendingOrientationRestoreId = null;
  let orientationBatchActive = false;
  function handleOrientationSignal(){
    if(!orientationBatchActive){
      orientationBatchActive = true;
      /* Snapshot now, on the first signal of this batch (whichever of 'orientationchange' or
         'resize' happens to fire first — browsers aren't fully consistent about which comes
         first or whether both fire, so both are listened for and share this same guard) — before
         the browser's own axis-flip side effects fire a 'scroll' event that would otherwise
         corrupt lastViewedCutId via the tracker above, wiping out the value we actually need. */
      pendingOrientationRestoreId = lastViewedCutId;
    }
    /* Mark the size as unsettled immediately, synchronously, as the very first thing any signal
       in this batch does — this is what the scroll-tracker guard above compares against. */
    lastSettledW = -1; lastSettledH = -1;
    clearTimeout(orientationRestoreTimer);
    orientationRestoreTimer = setTimeout(() => {
      orientationRestoreTimer = null;
      orientationBatchActive = false;
      if(pendingOrientationRestoreId) restoreScrollToCut(pendingOrientationRestoreId);
      /* Settle now, after the restore's own scrollIntoView has been issued. Also re-confirm
         lastViewedCutId synchronously right here (see markViewedCut's block comment) instead of
         only waiting on the resulting 'scroll' event to (async, next frame) update it — closes
         the window where a second rotation, started quickly, could otherwise read a stale value. */
      lastSettledW = window.innerWidth; lastSettledH = window.innerHeight;
      markViewedCut(pendingOrientationRestoreId);
      /* The notes-expand (long-press zoom) panel is centered via fixed left/top/width/height
         pixel values computed once at open time — with nothing re-running that math on rotation,
         it kept its pre-rotation position/size verbatim, which centered it for the OLD viewport
         dimensions but not the new ones (visibly off to one side after rotating while it's open).
         Repositioning here, in the same settled callback as the filmstrip restore above, rather
         than in a separate listener — one settle point for everything that needs to react to the
         viewport's new size. transition is suppressed the same way the main FLIP animations in
         this file always do before a snap-into-place (see e.g. animateEditorFrameClose): forced
         off, forced reflow, then restored, so this reads as an instant re-center rather than a
         0.32s slide/resize competing visually with the OS's own rotation animation. */
      if(expandedCutId){
        const prevTransition = notesExpandPanel.style.transition;
        notesExpandPanel.style.transition = 'none';
        repositionNotesExpandPanel();
        void notesExpandPanel.offsetWidth;
        notesExpandPanel.style.transition = prevTransition;
      }
      /* Same idea for the fullscreen pencil editor's canvas: rotating changes .editor-frame-inner's
         laid-out CSS size (it fills as much of the new viewport as the 1.85 aspect ratio allows),
         so the HiDPI buffer sized for the old orientation is now either needlessly oversized or
         (worse) undersized for the new display size — resize it to match, which also repaints at
         the new resolution via its own redrawEditor() call. */
      if(editorModal.classList.contains('open')) resizeEditorCanvasForDPI();
      updateTileScrollbar();
      reflowAllVisibleNotes();
    }, 120);
  }
  window.addEventListener('resize', handleOrientationSignal);
  window.addEventListener('orientationchange', handleOrientationSignal);

  function setEditMode(on){
    const wasEditing = editMode;
    editMode = on;
    const anchorId = findCenteredCutId();
    document.body.classList.toggle('view-mode', !editMode || appMode === 'trash');
    editToggleBtn.textContent = editMode ? 'Done' : 'Edit';
    editToggleBtn.classList.toggle('active', editMode);
    if(!editMode && editorModal.classList.contains('open')){
      closeEditor(true);
    }
    if(!editMode) closeNotesExpand();
    if(!editMode && selectMode){ exitSelectMode(); renderFilmstrip(); renderScenesList(); }
    if(wasEditing && !editMode) applySceneReordering();
    if(anchorId) restoreScrollToCut(anchorId);
    /* Keep the orientation tracker's notion of "what's currently on screen" in sync with this
       restore too — see markViewedCut's block comment for why (a rotation shortly after toggling
       edit mode, including pressing Done, otherwise used a stale pre-toggle value). */
    markViewedCut(anchorId);
    updateSelectButtonVisibility();
    document.querySelectorAll('.scene-input-top').forEach(el => { el.readOnly = appMode === 'trash' || !editMode; });
    document.querySelectorAll('.note-line').forEach(el => {
      if(notesExpandLines.contains(el)) return;
      el.contentEditable = (appMode === 'trash' || !editMode || selectMode) ? 'false' : 'true';
    });
    notesExpandLines.contentEditable = (appMode === 'trash' || !editMode || selectMode) ? 'false' : 'true';
  }
  editToggleBtn.addEventListener('click', () => setEditMode(!editMode));

  /* ===================== Title editing ===================== */
  titleEl.addEventListener('input', () => {
    state.title = titleEl.textContent.trim() || 'Untitled Storyboard';
    debouncedSaveMeta();
    const proj = projects.find(p => p.id === currentProjectId);
    if(proj){ proj.title = state.title; debouncedSaveProjectsIndex(); }
    renderProjectsList();
  });
  titleEl.addEventListener('blur', () => {
    if(!titleEl.textContent.trim()) titleEl.textContent = 'Untitled Storyboard';
  });
  titleEl.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); titleEl.blur(); }
  });
  titleEl.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  /* ===================== Scenes: numbering ===================== */
  function parseSceneNumber(s){
    const m = String(s || '').match(/(\d+)/);
    return m ? parseInt(m[1], 10) : null;
  }
  /* Extracts the custom label from a scene string formatted as "S#(number) - (NAME)".
     Returns '' if the scene has no such suffix (just a bare "S#3"). */
  function parseSceneName(s){
    const m = String(s || '').match(/^\s*S#\d+\s*-\s*(.+)$/);
    return m ? m[1].trim() : '';
  }
  function buildSceneText(number, name){
    return name ? ('S#' + number + ' - ' + name) : ('S#' + number);
  }
  function getNextSceneNumber(){
    let maxN = 0;
    state.order.forEach(id => {
      const n = parseSceneNumber(state.cuts[id].scene);
      if(n !== null && n > maxN) maxN = n;
    });
    return maxN + 1;
  }

  /* Bijective base-26 (Excel-column-style) conversion: 0->A, 1->B, ..., 25->Z, 26->AA, 27->AB,
     ... Used for per-scene shot lettering so shots read as "1A, 1B, ... 1Z, 1AA, 1AB, ...". */
  function numberToLetters(zeroIndexed){
    let n = zeroIndexed + 1;
    let s = '';
    while(n > 0){
      n--;
      s = String.fromCharCode(65 + (n % 26)) + s;
      n = Math.floor(n / 26);
    }
    return s;
  }
  /* Computes "<scene number><letter>" labels (e.g. "1A", "1B", "2A") for an ordered list of cut
     ids, resetting the letter at every scene-text boundary. sceneFieldFn extracts which scene
     text to group by from a given cut — live cut.scene for the main list, frozen
     cut.trashedScene for trash (trashed shots no longer belong to a live scene group, but the
     trash list is already kept sorted scene-by-scene, so contiguous runs still group correctly). */
  function computeShotLabelsForList(orderedIds, sceneFieldFn){
    const map = {};
    let prevScene, letterIdx = 0;
    orderedIds.forEach(id => {
      const cut = state.cuts[id];
      if(!cut) return;
      const sceneText = sceneFieldFn(cut);
      if(sceneText !== prevScene){ prevScene = sceneText; letterIdx = 0; }
      else letterIdx++;
      const sceneNum = parseSceneNumber(sceneText);
      map[id] = (sceneNum != null ? sceneNum : '?') + numberToLetters(letterIdx);
    });
    return map;
  }
  function computeMainShotLabels(){
    return computeShotLabelsForList(state.order, cut => cut.scene || '');
  }
  function computeTrashShotLabels(){
    return computeShotLabelsForList(state.trashOrder, cut => (cut.trashedScene != null ? cut.trashedScene : (cut.scene || '')));
  }
  /* Single-id convenience lookup for call sites that only need one shot's label (editor header,
     notes-expand header) rather than the whole rendered list. */
  function shotLabelFor(id){
    const isTrash = appMode === 'trash';
    const labels = isTrash ? computeTrashShotLabels() : computeMainShotLabels();
    return labels[id] || '';
  }
  /* Finds the scene of whichever shot is currently nearest the center of the filmstrip
     viewport, so "+ Scene" can insert right after it instead of always at the very end.
     Only meaningful in the basic (non-tile) view of the main project; callers should
     fall back to the old append-at-end behavior when this returns null. */
  function getCurrentlyVisibleSceneText(){
    if(viewMode !== 'basic' || appMode !== 'main') return null;
    const units = Array.from(filmstripEl.querySelectorAll('.cut-unit[data-unit-id]'));
    if(units.length === 0) return null;
    const contRect = filmstripEl.getBoundingClientRect();
    const portrait = isPortrait();
    const center = portrait ? (contRect.top + contRect.height / 2) : (contRect.left + contRect.width / 2);
    let closest = null, closestDist = Infinity;
    units.forEach(u => {
      const r = u.getBoundingClientRect();
      const mid = portrait ? (r.top + r.height / 2) : (r.left + r.width / 2);
      const d = Math.abs(mid - center);
      if(d < closestDist){ closestDist = d; closest = u; }
    });
    if(!closest) return null;
    const cut = state.cuts[closest.dataset.unitId];
    if(!cut) return null;
    return (cut.scene || '').trim() || null;
  }
  addSceneBtn.addEventListener('click', () => {
    if(!editMode) return;
    pushUndoSnapshot();

    const visibleScene = getCurrentlyVisibleSceneText();
    const curNum = visibleScene ? parseSceneNumber(visibleScene) : null;
    let newN, insertAfterScene = null;

    if(curNum !== null){
      newN = curNum + 1;
      insertAfterScene = visibleScene;
      /* Shift every existing scene numbered >= newN up by one to make room, based on each
         scene's original text rather than values already mutated earlier in the same pass —
         see computeSceneShiftMapping/applySceneShiftMapping. */
      applySceneShiftMapping(computeSceneShiftMapping(newN));
    } else {
      newN = getNextSceneNumber();
    }

    const sceneLabel = 'S#' + newN;
    const newIds = [];
    for(let i = 0; i < 10; i++){
      const id = uid('c');
      state.cuts[id] = { id, scene: sceneLabel, notes: '', image: null };
      newIds.push(id);
    }

    let insertIdx = state.order.length;
    if(insertAfterScene){
      let lastIdx = -1;
      state.order.forEach((oid, i) => { if((state.cuts[oid].scene || '').trim() === insertAfterScene) lastIdx = i; });
      insertIdx = (lastIdx === -1) ? state.order.length : lastIdx + 1;
    }
    state.order.splice(insertIdx, 0, ...newIds);

    resortOrderByScene();
    saveOrder();
    newIds.forEach(id => saveCut(id));
    renderFilmstrip();
    renderScenesList();
    requestAnimationFrame(() => jumpToCut(newIds[0]));
  });

  /* ===================== Rendering: filmstrip ===================== */
  function renderFilmstrip(){
    const isTrash = appMode === 'trash';
    /* Trash always uses the full-width "view mode" card layout (see body.view-mode CSS rules),
       regardless of whatever Edit/Done state was active before entering it — editing doesn't
       apply to Trash items anyway (contentEditable/readOnly are already forced off there), so
       the padded Edit-mode layout showing through was just a leftover CSS state, not intended.
       Recomputing here (rather than only in setEditMode's own toggle) catches every path that
       transitions in or out of Trash, since all of them render the filmstrip afterward. */
    document.body.classList.toggle('view-mode', !editMode || isTrash);
    filmstripEl.classList.toggle('tile-mode', viewMode === 'tile');
    openMenuUnitId = null;
    filmstripEl.innerHTML = '';
    const activeOrder = isTrash ? state.trashOrder : state.order;
    const shotLabels = isTrash ? computeTrashShotLabels() : computeMainShotLabels();
    if(activeOrder.length === 0){
      filmstripEl.appendChild(buildEmptyState());
    } else if(viewMode === 'tile'){
      activeOrder.forEach(id => filmstripEl.appendChild(buildTile(state.cuts[id], shotLabels[id])));
    } else if(isTrash){
      activeOrder.forEach(id => filmstripEl.appendChild(buildCutUnit(state.cuts[id], shotLabels[id])));
    } else {
      filmstripEl.appendChild(buildGutter(0));
      activeOrder.forEach((id, index) => {
        const cut = state.cuts[id];
        filmstripEl.appendChild(buildCutUnit(cut, shotLabels[id]));
        filmstripEl.appendChild(buildGutter(index + 1));
      });
    }
    updateSidebarCutCount();
    updateSelectToolbar();
    updateNavButtonsVisibility();
    updateTileScrollbar();
  }

  function buildEmptyState(){
    const wrap = document.createElement('div');
    wrap.className = 'empty-state';
    if(appMode === 'trash'){
      wrap.innerHTML = '<div class="empty-icon">' + ICONS.trash + '</div><p>Trash is empty</p>';
      return wrap;
    }
    wrap.innerHTML =
      '<div class="empty-icon">' + ICONS.film + '</div>' +
      '<p>Your storyboard is empty</p>' +
      '<button class="empty-add-btn">' + ICONS.plus + '<span>Add your first shot</span></button>';
    wrap.querySelector('.empty-add-btn').addEventListener('click', () => insertCut(0));
    return wrap;
  }

  function buildGutter(index){
    const g = document.createElement('div');
    g.className = 'gutter';
    g.dataset.index = String(index);
    const btn = document.createElement('button');
    btn.className = 'add-btn';
    btn.setAttribute('aria-label', 'Add shot');
    btn.innerHTML = ICONS.plus;
    btn.addEventListener('click', () => insertCut(index));
    g.appendChild(btn);
    return g;
  }

  /* ===================== Tile view (Frame-only grid for fast reordering) ===================== */
  function buildTile(cut, label){
    const isTrash = appMode === 'trash';
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.unitId = cut.id;
    /* guides behind, image/hint in front — same layering principle as the card and editor Frame */
    const guide239 = document.createElement('div');
    guide239.className = 'frame-guide-239';
    tile.appendChild(guide239);
    const guide133 = document.createElement('div');
    guide133.className = 'frame-guide-133';
    tile.appendChild(guide133);
    if(cut.image){
      const img = document.createElement('img');
      img.src = cut.image;
      tile.appendChild(img);
    } else {
      const hint = document.createElement('div');
      hint.className = 'tile-hint';
      hint.innerHTML = ICONS.pencil;
      tile.appendChild(hint);
    }
    const badge = document.createElement('div');
    badge.className = 'tile-badge';
    badge.textContent = label || '';
    tile.appendChild(badge);

    if(selectMode){
      const circle = buildSelectCircle(cut.id);
      circle.classList.add('tile-select-circle');
      tile.appendChild(circle);
      tile.addEventListener('click', e => {
        if(e.target.closest('.tile-select-circle')) return;
        toggleCutSelection(cut.id, circle);
      });
    }
    /* Always wire up pointerdown — even in Select mode and in Trash — purely so manual
       scrolling still works. .tile has touch-action:none (needed elsewhere for long-press-to-
       reorder), which also fully blocks native scroll; without this, Select mode and Trash
       tiles had no way to scroll at all. onTilePointerDown itself disables the drag-reorder
       phase and its own tap-to-open action for both those cases (restrictedMode below) — in
       Select mode, tap-to-toggle is handled by the .click listener above instead; in Trash,
       tap continues to do nothing, same as before this fix. */
    tile.addEventListener('pointerdown', e => onTilePointerDown(e, cut.id, tile, { restrictedMode: selectMode || isTrash }));
    return tile;
  }

  function computeTargetIndexGrid(clientX, clientY, otherEntries){
    const portrait = isPortrait();
    let closest = null, closestDist = Infinity, closestIdx = 0;
    otherEntries.forEach((o, i) => {
      const cx = o.rect.left + o.rect.width / 2, cy = o.rect.top + o.rect.height / 2;
      const d = Math.hypot(clientX - cx, clientY - cy);
      if(d < closestDist){ closestDist = d; closest = o; closestIdx = i; }
    });
    if(!closest) return 0;
    const cx = closest.rect.left + closest.rect.width / 2, cy = closest.rect.top + closest.rect.height / 2;
    const past = portrait
      ? ((clientY > cy) || (Math.abs(clientY - cy) < closest.rect.height * 0.3 && clientX > cx))
      : ((clientX > cx) || (Math.abs(clientX - cx) < closest.rect.width * 0.3 && clientY > cy));
    return past ? closestIdx + 1 : closestIdx;
  }

  /* Shot drag-reorder (both Tile View long-press and Normal View's "///" handle) is allowed to
     move a shot into a different scene's run — dropping it there reassigns cut.scene to match
     its new neighbors (inheriting from the shot immediately before the drop point, or the one
     immediately after if dropped at the very start of the whole list — same "inherit from the
     preceding shot" convention insertCut already uses for brand-new shots). Shot labels are
     computed dynamically from contiguous same-scene runs (computeShotLabelsForList), so once
     cut.scene is correctly reassigned, every affected letter — the moved shot's and everything
     after it in its new scene — recomputes correctly on its own with no duplicates; nothing
     needs to be written for the letters themselves. If the shot being moved was the *only*
     member of its old scene, that scene now has zero shots left, which would otherwise leave a
     gap in the sequential scene numbering (see Instructions: "Scene numbers stay sequential
     with no gaps") — so that case additionally triggers a full renumber. Dropping back within
     the shot's own existing scene (including its own current spot) is scene-preserving, as
     before. Returns { arr, newScene, changed, sourceSceneEmptied }; arr is the full new
     state.order with the shot spliced into targetIndex. */
  function computeSceneAwareReorder(id, targetIndex){
    const cut = state.cuts[id];
    const myScene = cut ? (cut.scene || '') : '';
    const withoutId = state.order.filter(x => x !== id);
    let newScene = myScene;
    if(withoutId.length > 0){
      const leftId = targetIndex > 0 ? withoutId[targetIndex - 1] : null;
      const rightId = targetIndex < withoutId.length ? withoutId[targetIndex] : null;
      const leftScene = leftId ? (state.cuts[leftId].scene || '') : null;
      const rightScene = rightId ? (state.cuts[rightId].scene || '') : null;
      if(leftScene !== myScene && rightScene !== myScene){
        if(leftScene !== null) newScene = leftScene;
        else if(rightScene !== null) newScene = rightScene;
      }
    }
    const changed = newScene !== myScene;
    const sourceSceneEmptied = changed && !withoutId.some(otherId => (state.cuts[otherId].scene || '') === myScene);
    const arr = withoutId.slice();
    arr.splice(targetIndex, 0, id);
    return { arr, newScene, changed, sourceSceneEmptied };
  }

  /* Shared apply step for both drag surfaces: commit a computeSceneAwareReorder() result to
     state, persist whatever actually changed, and re-render. Kept in one place so Tile View and
     Normal View's handle-drag can't drift out of sync on this. */
  function applySceneAwareReorder(id, targetIndex){
    const result = computeSceneAwareReorder(id, targetIndex);
    const orderChanged = result.arr.join(',') !== state.order.join(',');
    if(orderChanged || result.changed) pushUndoSnapshot();
    if(result.changed) state.cuts[id].scene = result.newScene;
    state.order = result.arr;
    if(orderChanged) saveOrder();
    if(result.changed) saveCut(id);
    if(result.sourceSceneEmptied){
      /* Moving this shot out emptied its old scene entirely, which would otherwise leave a gap
         in sequential scene numbering — closes that gap. Renders internally. */
      renumberAllScenesSequentially();
    } else {
      renderFilmstrip();
      if(result.changed) renderScenesList(); // per-scene shot counts in the sidebar shifted
    }
    if(orderChanged || result.changed) requestAnimationFrame(() => flashUnit(id));
  }

  /* Rolling-window velocity tracker for a single touch/pointer gesture. Computing release
     velocity from only the single most-recent pointermove delta is fragile: real touch
     gestures very often deliver a final pointermove with a near-zero delta right before
     pointerup (the finger settles for a moment before lifting, even after a fast flick) —
     that last near-zero sample would otherwise overwrite the tracked velocity and make
     momentum feel like it dead-stops the instant you lift your finger. Keeping a short
     trailing window and measuring across its full span at release time smooths past that
     last-sample artifact while still being responsive (a deliberate stop-and-hold still
     correctly reads as ~zero velocity, since by then all samples in the window are stationary). */
  function createVelocityTracker(initialPos){
    const WINDOW_MS = 100;
    let samples = [{ t: performance.now(), pos: initialPos }];
    return {
      reset(pos){ samples = [{ t: performance.now(), pos }]; },
      sample(pos){
        const now = performance.now();
        samples.push({ t: now, pos });
        while(samples.length > 1 && now - samples[0].t > WINDOW_MS) samples.shift();
      },
      /* Returns px/ms in raw pointer-movement direction (not yet sign-adjusted for scroll). */
      release(){
        if(samples.length < 2) return 0;
        const oldest = samples[0], newest = samples[samples.length - 1];
        const dt = newest.t - oldest.t;
        return dt > 0 ? (newest.pos - oldest.pos) / dt : 0;
      }
    };
  }

  /* Converts a released drag's velocity (px/ms, from a velocity tracker's release()) into the
     px/frame value startMomentumScroll expects — assumes ~60fps (16.67ms/frame), flips the
     sign since scroll direction is opposite to raw pointer-movement direction, and clamps to a
     sane max so one unusually fast flick can't send the scroll flying. Returns null when the
     release was too slow to be worth any momentum at all, so callers can skip starting one. */
  function velocityToPerFrame(velTracker){
    const MAX_PER_FRAME = 90;
    let perFrame = -velTracker.release() * 16.67;
    perFrame = Math.max(-MAX_PER_FRAME, Math.min(MAX_PER_FRAME, perFrame));
    return Math.abs(perFrame) > 0.5 ? perFrame : null;
  }


  /* Manual momentum/inertia scroll for surfaces that use touch-action:none (tiles, sidebar
     scene list) — native momentum never kicks in on those since the browser's own pan is
     disabled entirely (4.8), so a plain release just dead-stops the scroll. This replicates
     the missing "flick and coast, decelerating" feel with a simple per-frame friction decay,
     always via explicit instant scrollTo (4.7) — never smooth. Returns a cancel function so a
     fresh touch-down (or a tool/mode change) can stop it instantly, same as a real flick would.

     Two earlier variants tried and reverted here:
     - Pre-damping velocity within a fixed distance of each edge (a "cushion"), meant to avoid
       an abrupt hard-wall stop on short lists. That damping only approaches the edge
       asymptotically, so a flick with any speed left on entering it would decay below the stop
       threshold before actually reaching the edge — leaving the scroll stalled short of the
       true boundary on longer lists.
     - A small recoil pulse on contact (dip back in from the edge, then spring back out —
       scrollTop/scrollLeft are always clamped by the browser to [0, max], so an actual
       past-the-edge rubber-band isn't possible without a separate transform on an inner
       content wrapper, which these containers don't have). Fixed the stalling-short issue, but
       read as an unwanted extra bounce on both Tile View and the sidebar rather than a clean
       stop.

     This version: no pre-damping, no bounce — friction alone carries the scroll at full speed
     right up to the true edge, then clamps and stops there immediately, same as a plain
     non-rubber-band scroll settling at its limit. */
  function startMomentumScroll(container, axis, initialVelocityPerFrame){
    const FRICTION = 0.945;
    const MIN_VELOCITY = 0.4;
    let vel = initialVelocityPerFrame;
    let rafId = null;
    function step(){
      vel *= FRICTION;
      const max = axis === 'y' ? (container.scrollHeight - container.clientHeight) : (container.scrollWidth - container.clientWidth);
      const current = axis === 'y' ? container.scrollTop : container.scrollLeft;
      let next = current + vel;
      let stop = false;
      if(next <= 0){ next = 0; stop = true; }
      else if(next >= max){ next = max; stop = true; }
      else if(Math.abs(vel) < MIN_VELOCITY){ stop = true; }
      if(axis === 'y') container.scrollTo({ top: next, behavior: 'instant' });
      else container.scrollTo({ left: next, behavior: 'instant' });
      if(stop){ rafId = null; return; }
      rafId = requestAnimationFrame(step);
    }
    rafId = requestAnimationFrame(step);
    return function cancel(){ if(rafId){ cancelAnimationFrame(rafId); rafId = null; } };
  }

  let tileMomentumCancel = null;
  function onTilePointerDown(e, id, tileEl, opts){
    const restrictedMode = !!(opts && opts.restrictedMode);
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    if(tileMomentumCancel){ tileMomentumCancel(); tileMomentumCancel = null; }
    const pointerId = e.pointerId;
    const startX = e.clientX, startY = e.clientY;
    const portrait = isPortrait();
    const startScroll = portrait ? filmstripEl.scrollTop : filmstripEl.scrollLeft;
    let phase = 'idle'; /* idle -> scrolling | drag | tap */
    const velTracker = createVelocityTracker(portrait ? startY : startX);

    const timer = setTimeout(() => {
      if(phase !== 'idle' || !editMode || restrictedMode) return;
      phase = 'drag';
      beginDrag();
    }, 260);

    function onPreMove(ev){
      if(ev.pointerId !== pointerId) return;
      if(phase !== 'idle' && phase !== 'scrolling') return;
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if(phase === 'idle'){
        if(Math.hypot(dx, dy) <= 8) return;
        /* Moved enough to be a swipe-to-browse, not a long-press-drag. Take over scrolling
           manually from here — .tile uses touch-action:none precisely so the browser never
           starts its own native pan for this gesture (that race with our long-press timer is
           what caused tiles to get stuck mid-drag: native scroll would already be underway by
           the time our JS drag logic tried to take over). */
        phase = 'scrolling';
        clearTimeout(timer);
        velTracker.reset(portrait ? ev.clientY : ev.clientX);
      }
      ev.preventDefault();
      if(portrait) filmstripEl.scrollTo({ top: startScroll - dy, behavior: 'instant' });
      else filmstripEl.scrollTo({ left: startScroll - dx, behavior: 'instant' });
      velTracker.sample(portrait ? ev.clientY : ev.clientX);
    }
    function onPreUp(ev){
      if(ev.pointerId !== pointerId) return;
      if(phase !== 'idle' && phase !== 'scrolling') return;
      clearTimeout(timer);
      const wasIdle = phase === 'idle';
      const wasScrolling = phase === 'scrolling';
      cleanupPre();
      if(wasIdle){
        if(restrictedMode){
          /* Select mode: let the native click event bubble to the tile's own .click listener
             (toggles selection) instead. Trash: tap intentionally does nothing, same as before
             this fix — this handler exists here purely to enable scrolling. */
        } else if(editMode){
          openEditor(id, tileEl);
        } else {
          setViewMode('basic');
          requestAnimationFrame(() => jumpToCut(id));
        }
      } else if(wasScrolling){
        const perFrame = velocityToPerFrame(velTracker);
        if(perFrame !== null){
          tileMomentumCancel = startMomentumScroll(filmstripEl, portrait ? 'y' : 'x', perFrame);
        }
      }
    }
    function cleanupPre(){
      document.removeEventListener('pointermove', onPreMove);
      document.removeEventListener('pointerup', onPreUp);
      document.removeEventListener('pointercancel', onPreUp);
    }
    document.addEventListener('pointermove', onPreMove);
    document.addEventListener('pointerup', onPreUp);
    document.addEventListener('pointercancel', onPreUp);

    function beginDrag(){
      cleanupPre();
      tileEl.classList.add('dragging');
      const dragStartScroll = portrait ? filmstripEl.scrollTop : filmstripEl.scrollLeft;

      function getOtherEntries(){
        /* Re-query sibling rects on every call — caching them once at drag-start goes stale
           if the grid scrolls during the drag, which is what caused the reorder jitter
           in the other drag-reorder surfaces (project/scene/cut). */
        return Array.from(filmstripEl.querySelectorAll('.tile[data-unit-id]'))
          .filter(el => el.dataset.unitId !== id)
          .map(el => ({ id: el.dataset.unitId, rect: el.getBoundingClientRect() }));
      }
      let currentTarget = computeTargetIndexGrid(startX, startY, getOtherEntries());

      let scrollDir = 0, rafId = null;
      /* Finger position as of the last real pointermove — cached so autoScrollLoop can recompute
         the drag transform on its own every frame too, not just when onMove happens to fire. See
         updateDragTransform's comment below for why that matters. */
      let lastPointerX = startX, lastPointerY = startY;
      /* Shared by onMove and autoScrollLoop so the compensating transform is recalculated on
         every single frame autoscroll actually moves the container — not just on pointermove
         events. Previously this only ran inside onMove, so holding the finger still near an edge
         (letting autoscroll run on its own via the independent rAF loop below) left the transform
         frozen at its last computed value while the container kept scrolling out from under it —
         the tile would visibly lag/stick in place for however long the finger stayed still, then
         snap back to the correct position all at once the next time a pointermove happened to
         fire. Recomputing here too, using the latest actual scroll position every frame, keeps it
         glued to the finger continuously instead. */
      function updateDragTransform(){
        const scrollDelta = (portrait ? filmstripEl.scrollTop : filmstripEl.scrollLeft) - dragStartScroll;
        const dx = lastPointerX - startX, dy = lastPointerY - startY;
        const adjDx = portrait ? dx : dx + scrollDelta;
        const adjDy = portrait ? dy + scrollDelta : dy;
        tileEl.style.transform = 'translate(' + adjDx + 'px,' + adjDy + 'px) scale(1.08)';
      }
      function autoScrollLoop(){
        if(scrollDir !== 0){
          if(portrait) filmstripEl.scrollTo({ top: filmstripEl.scrollTop + scrollDir * 14, behavior: 'instant' });
          else filmstripEl.scrollTo({ left: filmstripEl.scrollLeft + scrollDir * 14, behavior: 'instant' });
          updateDragTransform();
        }
        rafId = requestAnimationFrame(autoScrollLoop);
      }
      rafId = requestAnimationFrame(autoScrollLoop);

      function onMove(ev){
        if(ev.pointerId !== pointerId) return;
        ev.preventDefault();
        lastPointerX = ev.clientX; lastPointerY = ev.clientY;
        updateDragTransform();
        currentTarget = computeTargetIndexGrid(ev.clientX, ev.clientY, getOtherEntries());

        const contRect = filmstripEl.getBoundingClientRect();
        const edge = 50;
        if(portrait){
          if(ev.clientY < contRect.top + edge) scrollDir = -1;
          else if(ev.clientY > contRect.bottom - edge) scrollDir = 1;
          else scrollDir = 0;
        } else {
          if(ev.clientX < contRect.left + edge) scrollDir = -1;
          else if(ev.clientX > contRect.right - edge) scrollDir = 1;
          else scrollDir = 0;
        }
      }
      function onUp(ev){
        if(ev.pointerId !== pointerId) return;
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        scrollDir = 0;
        if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
        tileEl.classList.remove('dragging');
        tileEl.style.transform = '';
        applySceneAwareReorder(id, currentTarget);
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    }
  }

  function buildCutUnit(cut, label){
    const isTrash = appMode === 'trash';
    const unit = document.createElement('div');
    unit.className = 'cut-unit';
    unit.dataset.unitId = cut.id;

    /* handle row: scene (left) / reorder+select (center) / cut number (right) */
    const handleRow = document.createElement('div');
    handleRow.className = 'handle-row';

    const sceneInput = document.createElement('input');
    sceneInput.className = 'scene-input-top';
    sceneInput.placeholder = 'SCENE';
    sceneInput.value = (isTrash ? (cut.trashedScene != null ? cut.trashedScene : cut.scene) : cut.scene) || '';
    sceneInput.maxLength = 24;
    sceneInput.readOnly = isTrash || !editMode;
    sceneInput.addEventListener('input', () => {
      if(isTrash) return;
      enforceUppercaseInput(sceneInput);
      cut.scene = sceneInput.value;
      debouncedSaveCut(cut.id);
      sceneEditedIds.add(cut.id);
      scheduleSceneRefresh();
    });
    handleRow.appendChild(sceneInput);

    const centerGroup = document.createElement('div');
    centerGroup.className = 'handle-center-group';
    if(!isTrash){
      const handleBtn = document.createElement('button');
      handleBtn.className = 'handle-btn';
      handleBtn.innerHTML = ICONS.grip;
      handleBtn.setAttribute('aria-label', 'Reorder or delete');
      handleBtn.addEventListener('pointerdown', e => onHandlePointerDown(e, cut.id, unit));
      centerGroup.appendChild(handleBtn);
    }
    let selectCircleEl = null;
    if(selectMode){
      selectCircleEl = buildSelectCircle(cut.id);
      centerGroup.appendChild(selectCircleEl);
    }
    handleRow.appendChild(centerGroup);

    const badge = document.createElement('div');
    badge.className = 'cut-badge-top';
    badge.textContent = label || '';
    handleRow.appendChild(badge);

    if(!isTrash){
      const handleMenu = document.createElement('div');
      handleMenu.className = 'handle-menu';

      const duplicateBtn = document.createElement('button');
      duplicateBtn.className = 'handle-menu-btn duplicate-btn';
      duplicateBtn.innerHTML = ICONS.duplicate + '<span>Duplicate</span>';
      duplicateBtn.addEventListener('click', e => { e.stopPropagation(); duplicateCut(cut.id); });
      handleMenu.appendChild(duplicateBtn);

      const trashBtn = document.createElement('button');
      trashBtn.className = 'handle-menu-btn trash-btn';
      trashBtn.innerHTML = ICONS.trash + '<span>Trash</span>';
      trashBtn.addEventListener('click', e => { e.stopPropagation(); deleteCut(cut.id); });
      handleMenu.appendChild(trashBtn);

      handleRow.appendChild(handleMenu);
    }

    /* card */
    const card = document.createElement('div');
    card.className = 'card';
    /* In select mode the Frame/notes stop being interactive (see setupInlineCanvas and the
       .note-line pointer-events:none rule) and a tap anywhere on the card selects it instead. */
    card.addEventListener('click', () => {
      if(!selectMode || !selectCircleEl) return;
      toggleCutSelection(cut.id, selectCircleEl);
    });

    /* frame — drawing only */
    const frame = document.createElement('div');
    frame.className = 'frame';

    const guide239 = document.createElement('div');
    guide239.className = 'frame-guide-239';
    frame.appendChild(guide239);

    const guide133 = document.createElement('div');
    guide133.className = 'frame-guide-133';
    frame.appendChild(guide133);

    const canvas = document.createElement('canvas');
    canvas.className = 'frame-canvas';
    frame.appendChild(canvas);

    const hint = document.createElement('div');
    hint.className = 'frame-hint';
    hint.innerHTML = ICONS.pencil + '<span>Tap to draw</span>';
    frame.appendChild(hint);

    setupInlineCanvas(canvas, cut, unit, hint);

    /* notes */
    const notesWrap = document.createElement('div');
    notesWrap.className = 'notes';
    const linesEl = buildNotesLines(cut);
    notesWrap.appendChild(linesEl);
    setupNotesLongPress(notesWrap, cut);

    card.appendChild(frame);
    card.appendChild(notesWrap);

    unit.appendChild(handleRow);
    unit.appendChild(card);

    return unit;
  }

  /* ===================== Notes lines ===================== */
  function stripTagsToText(html){
    const tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    return tmp.textContent || '';
  }
  function placeCaretAtStart(el){
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(true);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  function placeCaretAtEnd(el){
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function getRichLinesForCut(cut){
    let htmlLines;
    if(typeof cut.notesHtml === 'string' && cut.notesHtml){
      const tmp = document.createElement('div');
      tmp.innerHTML = sanitizeRichHtml(cut.notesHtml);
      if(tmp.children.length > 0 && Array.from(tmp.children).every(c => c.tagName === 'DIV')){
        htmlLines = Array.from(tmp.children).map(c => c.innerHTML);
      } else {
        htmlLines = [tmp.innerHTML];
      }
    } else {
      htmlLines = (cut.notes || '').split('\n').map(l => escapeHtml(l));
    }
    let lastNonEmpty = -1;
    htmlLines.forEach((l, i) => { if(stripTagsToText(l).trim() !== '') lastNonEmpty = i; });
    const length = Math.max(MIN_LINES, lastNonEmpty + 2, htmlLines.length);
    const lines = [];
    for(let i = 0; i < length; i++) lines.push(htmlLines[i] || '');
    return lines;
  }

  function buildLinesInto(cut, wrap){
    wrap.innerHTML = '';
    const lines = getRichLinesForCut(cut);
    lines.forEach((html, i) => wrap.appendChild(buildLineDiv(cut, wrap, i, html)));
    /* Blank ruled space below the last line — see .notes-lines-filler's CSS comment. Appended
       here (rather than only in buildNotesLines) so every caller that rebuilds a wrap's lines
       (the expand overlay's own wrap, and the compact card's wrap after syncing back from it)
       gets it too, instead of it only existing on first build and vanishing on any resync. */
    const filler = document.createElement('div');
    filler.className = 'notes-lines-filler';
    wrap.appendChild(filler);
  }

  function buildNotesLines(cut){
    const wrap = document.createElement('div');
    wrap.className = 'notes-lines';
    buildLinesInto(cut, wrap);
    wrap.addEventListener('pointerdown', e => {
      if(!editMode || selectMode) return;
      if(e.target.classList && e.target.classList.contains('note-line')) return;
      const lines = wrap.querySelectorAll('.note-line');
      const last = lines[lines.length - 1];
      if(last){ last.focus(); placeCaretAtEnd(last); }
    });
    return wrap;
  }

  /* buildLineDiv is shared by the compact card view (each wrap is its own fresh element, one per
     card) and the notes-expand overlay (always the single notesExpandLines element). The card
     view keeps each .note-line individually contentEditable — the stable, established approach.
     The expand overlay is deliberately different: individually-contentEditable siblings are each
     their own separate editing host, which is exactly why selection previously couldn't span
     across lines there (pressing Enter split text into two separately-selectable regions). For
     the expand overlay, only notesExpandLines itself carries contentEditable — the line divs
     inherit editability from it, so native selection/Select-All/delete now spans every line, the
     way a normal Notes app works. Everything else (auto-wrap, growing blank lines, undo/redo)
     is untouched — only *which element is the editing host* changed. */
  function buildLineDiv(cut, wrap, index, html){
    const div = document.createElement('div');
    div.className = 'note-line';
    const isExpand = (wrap === notesExpandLines);
    if(!isExpand){
      div.contentEditable = (appMode === 'trash' || !editMode || selectMode) ? 'false' : 'true';
    }
    div.innerHTML = html || '';
    if(index === 0 && !html) div.setAttribute('data-placeholder', 'Blocking, camera moves, notes…');
    if(!isExpand){
      div.addEventListener('input', () => onLineInput(cut, wrap, div));
      div.addEventListener('keydown', e => onLineKeydown(e, cut, wrap, div));
    }
    return div;
  }

  /* Resolves which .note-line the current caret/selection is inside, for the expand overlay's
     container-level input/keydown listeners (see buildLineDiv's comment — individual lines there
     aren't separately focusable, so events target notesExpandLines itself, not a specific line;
     this walks up from the live selection to find which line that actually is). */
  function currentLineFromSelection(wrap){
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return null;
    let node = sel.getRangeAt(0).startContainer;
    if(node.nodeType === 3) node = node.parentElement;
    while(node && node !== wrap){
      if(node.classList && node.classList.contains('note-line')) return node;
      node = node.parentElement;
    }
    return null;
  }

  /* Focuses a specific line and places the caret in it. For the card view each line is its own
     editing host, so focusing the line directly works. For the expand overlay, only the wrap
     itself is a real focusable editing host — focus that, then use Range/Selection (which can
     target any node, focusable or not) to land the caret inside the specific line. */
  function focusLineIn(wrap, div, atStart){
    if(wrap === notesExpandLines) notesExpandLines.focus();
    else div.focus();
    if(atStart) placeCaretAtStart(div); else placeCaretAtEnd(div);
  }

  /* Single source of truth for a cut's notes: cut.notesHtml (rich, per-line divs) — cut.notes
     is just a derived plain-text mirror kept for simple/legacy readers. Both the compact card
     and the expand overlay read/write the same notesHtml, so formatting applied in either place
     shows up in both. */
  function syncNotesFromLines(cut, wrap){
    const lines = Array.from(wrap.querySelectorAll('.note-line'));
    cut.notesHtml = lines.map(l => '<div>' + (l.innerHTML || '<br>') + '</div>').join('');
    cut.notes = lines.map(l => stripTagsToText(l.innerHTML)).join('\n');
    debouncedSaveCut(cut.id);
  }

  function onLineInput(cut, wrap, div){
    if(!editMode || appMode === 'trash') return;
    checkLineOverflow(cut, wrap, div);
    trimTrailingEmptyLines(wrap);
    syncNotesFromLines(cut, wrap);
    if(wrap === notesExpandLines && expandedCutId === cut.id){
      clearTimeout(notesHistoryTypingTimer);
      notesHistoryTypingTimer = setTimeout(() => pushNotesHistoryCheckpoint(cut.notesHtml), NOTES_HISTORY_DEBOUNCE_MS);
    }
  }

  /* ---- Auto-wrap: when a line's content no longer fits its box, push the overflow onto the
     start of the next line. Uses caretRangeFromPoint to find exactly where the line's content
     stops fitting — this naturally accounts for bold/larger glyphs affecting width, unlike a
     manual character-width measurement, and lets the moved fragment keep its own formatting.
     opts.silent (used by reflowNotesWrap below, for the post-rotation reflow pass) skips the
     focus-follows-the-text behavior meant for live typing, and skips the contentEditable check
     so it still works on non-editable notes (view mode, Trash). caretRangeFromPoint is a hit-test
     against real screen pixels, so it only returns a result for on-screen coordinates — callers
     doing a background reflow (not live typing, where the div is on-screen by definition since
     the user is looking at it) need to check the div is actually on-screen themselves first. ---- */
  function checkLineOverflow(cut, wrap, div, opts){
    const silent = !!(opts && opts.silent);
    if(!silent && !div.isContentEditable) return;
    let current = div;
    let moved = false;
    let iterations = 0;
    while(current && iterations < 50){
      iterations++;
      if(current.scrollWidth <= current.clientWidth + 1) break;
      const rect = current.getBoundingClientRect();
      const cs = getComputedStyle(current);
      const paddingR = parseFloat(cs.paddingRight) || 0;
      const edgeX = rect.right - paddingR - 2;
      const y = rect.top + rect.height / 2;
      let point = null;
      if(document.caretRangeFromPoint){
        point = document.caretRangeFromPoint(edgeX, y);
      } else if(document.caretPositionFromPoint){
        const pos = document.caretPositionFromPoint(edgeX, y);
        if(pos) point = { startContainer: pos.offsetNode, startOffset: pos.offset };
      }
      if(!point || !current.contains(point.startContainer)) break;
      const fullRange = document.createRange();
      fullRange.selectNodeContents(current);
      try{ fullRange.setStart(point.startContainer, point.startOffset); }catch(err){ break; }
      if(fullRange.collapsed) break;
      const fragment = fullRange.extractContents();

      const lines = Array.from(wrap.querySelectorAll('.note-line'));
      const idx = lines.indexOf(current);
      let nextLine = lines[idx + 1];
      if(nextLine){
        nextLine.insertBefore(fragment, nextLine.firstChild);
      } else {
        nextLine = buildLineDiv(cut, wrap, idx + 1, '');
        nextLine.appendChild(fragment);
        wrap.appendChild(nextLine);
      }
      current = nextLine;
      moved = true;
    }
    if(moved && current && !silent){
      focusLineIn(wrap, current, false);
    }
  }

  /* ---- Reflow after orientation/width changes (see checkLineOverflow's block comment above for
     why this needs its own pass rather than just re-running the live-typing overflow check).
     cut.notesHtml stores each line's break point baked in from whenever it was last wrapped —
     rotating the device changes the note's actual on-screen width, so those old break points can
     now be wrong in either direction (too-early or too-late). Merging every line back into one
     and re-running the same overflow-push logic from scratch re-derives correct break points for
     the width at the time this runs, regardless of which width they were originally wrapped for.
     Skipped for any wrap currently off-screen (checkLineOverflow can't work there — see above) or
     mid-edit (defensive; merging DOM nodes under an active cursor could lose it, though rotating
     a device while actively typing in a note isn't really physically possible to begin with).
     Off-screen notes are left with their old (possibly now-wrong) wrapping until they're next
     visible during a rotation, or edited (which re-wraps live) — a known, accepted gap rather
     than a full fix, since correctly measuring off-screen text needs a different, non-hit-test
     technique this file doesn't otherwise have a use for. */
  function reflowNotesWrap(cut, wrap){
    const rect = wrap.getBoundingClientRect();
    if(rect.bottom < 0 || rect.top > window.innerHeight || rect.right < 0 || rect.left > window.innerWidth) return;
    if(wrap.contains(document.activeElement)) return;
    const lines = Array.from(wrap.querySelectorAll('.note-line'));
    if(lines.length === 0) return;
    const mergedHTML = lines.map(l => l.innerHTML).join('');
    const first = lines[0];
    for(let i = 1; i < lines.length; i++) wrap.removeChild(lines[i]);
    first.innerHTML = mergedHTML;
    checkLineOverflow(cut, wrap, first, { silent: true });
    trimTrailingEmptyLines(wrap);
    syncNotesFromLines(cut, wrap);
  }
  function reflowAllVisibleNotes(){
    if(viewMode === 'tile') return; /* Tile View doesn't render notes at all */
    filmstripEl.querySelectorAll('.cut-unit[data-unit-id]').forEach(unit => {
      const cut = state.cuts[unit.dataset.unitId];
      const wrap = unit.querySelector('.notes-lines');
      if(cut && wrap) reflowNotesWrap(cut, wrap);
    });
    if(expandedCutId){
      const cut = state.cuts[expandedCutId];
      if(cut) reflowNotesWrap(cut, notesExpandLines);
    }
  }

  function trimTrailingEmptyLines(wrap){
    const lines = Array.from(wrap.querySelectorAll('.note-line'));
    let i = lines.length - 1;
    let emptyCount = 0;
    while(i >= 0 && stripTagsToText(lines[i].innerHTML).trim() === ''){ emptyCount++; i--; }
    const excess = emptyCount - 1;
    if(excess > 0 && lines.length - excess >= MIN_LINES){
      /* wrap's actual last child is now always .notes-lines-filler (the blank ruled-space filler
         appended in buildLinesInto), not a .note-line — removing wrap.lastElementChild directly
         would delete that filler instead of a trailing empty line. Removing the last *line*
         elements by reference instead, from the already-collected lines array, sidesteps that. */
      for(let k = 0; k < excess; k++){
        const last = lines[lines.length - 1 - k];
        if(!last || document.activeElement === last) break;
        wrap.removeChild(last);
      }
    }
  }

  function onLineKeydown(e, cut, wrap, div){
    const lines = Array.from(wrap.querySelectorAll('.note-line'));
    const idx = lines.indexOf(div);
    if(e.key === 'Enter'){
      e.preventDefault();
      if(!div.isContentEditable) return;
      let afterFragment = document.createDocumentFragment();
      const sel = window.getSelection();
      if(sel.rangeCount > 0){
        const range = sel.getRangeAt(0);
        if(div.contains(range.startContainer)){
          const fullRange = document.createRange();
          fullRange.selectNodeContents(div);
          try{ fullRange.setStart(range.startContainer, range.startOffset); }catch(err){}
          afterFragment = fullRange.extractContents();
        }
      }
      const newLine = buildLineDiv(cut, wrap, idx + 1, '');
      newLine.appendChild(afterFragment);
      if(div.nextSibling) wrap.insertBefore(newLine, div.nextSibling);
      else wrap.appendChild(newLine);
      syncNotesFromLines(cut, wrap);
      focusLineIn(wrap, newLine, true);
    } else if(e.key === 'ArrowDown'){
      if(idx < lines.length - 1){ e.preventDefault(); focusLineIn(wrap, lines[idx + 1], true); }
    } else if(e.key === 'ArrowUp'){
      if(idx > 0){ e.preventDefault(); focusLineIn(wrap, lines[idx - 1], true); }
    }
  }

  /* ===================== Notes expand overlay (long-press) ===================== */
  const notesExpandBackdrop = document.getElementById('notesExpandBackdrop');
  const notesExpandPanel = document.getElementById('notesExpandPanel');
  const notesExpandLines = document.getElementById('notesExpandLines');
  const notesExpandLabel = document.getElementById('notesExpandLabel');
  let expandedCutId = null;

  /* ---- Local Undo/Redo for the expand overlay only ---- */
  /* Scoped to a single open session of this overlay — a lightweight safety net (so a select-all-
     and-delete is recoverable), not a persisted history; reset every time the overlay opens/closes.
     Snapshot-based (whole notesHtml strings) rather than action-based: notes are just marked-up
     text with none of the nested stroke/photo state the fullscreen editor's undo has to track,
     so whole-string snapshots are simpler and safer here than trying to diff contenteditable DOM
     mutations. Typing is coalesced into one checkpoint per pause (like most text editors); a
     discrete action (format button, Delete All) pushes its own checkpoint immediately. */
  const notesUndoBtn = document.getElementById('notesUndoBtn');
  const notesRedoBtn = document.getElementById('notesRedoBtn');
  let notesHistory = [];
  let notesHistoryIndex = -1;
  let notesHistoryTypingTimer = null;
  const NOTES_HISTORY_DEBOUNCE_MS = 500;

  function resetNotesHistory(initialHtml){
    notesHistory = [initialHtml || ''];
    notesHistoryIndex = 0;
    updateNotesHistoryButtons();
  }
  function pushNotesHistoryCheckpoint(html){
    const normalized = html || '';
    if(notesHistory[notesHistoryIndex] === normalized) return; /* nothing actually changed */
    notesHistory = notesHistory.slice(0, notesHistoryIndex + 1);
    notesHistory.push(normalized);
    notesHistoryIndex = notesHistory.length - 1;
    updateNotesHistoryButtons();
  }
  function updateNotesHistoryButtons(){
    notesUndoBtn.classList.toggle('disabled', notesHistoryIndex <= 0);
    notesRedoBtn.classList.toggle('disabled', notesHistoryIndex >= notesHistory.length - 1);
  }
  /* Rebuilds the DOM from a given notesHtml string and re-derives the canonical notesHtml/notes
     mirror + saves, by routing through the same buildLinesInto/syncNotesFromLines pair every
     other notes-writing path already uses — deliberately not hand-rolling a separate write path
     here. Clearing cut.notes alongside an empty html avoids getRichLinesForCut's empty-notesHtml
     fallback (which reads cut.notes) from resurrecting stale plain text after undoing back past
     a select-all-and-delete. */
  function applyNotesHtmlAndRebuild(cut, html){
    cut.notesHtml = html || '';
    if(!cut.notesHtml) cut.notes = '';
    buildLinesInto(cut, notesExpandLines);
    syncNotesFromLines(cut, notesExpandLines);
  }
  function applyNotesHistoryIndex(newIndex){
    const cut = state.cuts[expandedCutId];
    if(!cut) return;
    notesHistoryIndex = newIndex;
    applyNotesHtmlAndRebuild(cut, notesHistory[notesHistoryIndex]);
    updateNotesHistoryButtons();
  }
  notesUndoBtn.addEventListener('click', () => { if(notesHistoryIndex > 0) applyNotesHistoryIndex(notesHistoryIndex - 1); });
  notesRedoBtn.addEventListener('click', () => { if(notesHistoryIndex < notesHistory.length - 1) applyNotesHistoryIndex(notesHistoryIndex + 1); });

  /* cut.notesHtml can come from an imported backup file, not just this app's own editor —
     strip it down to a small safe allowlist before ever assigning it via innerHTML. */
  function sanitizeRichHtml(html){
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const allowedTags = new Set(['div', 'br', 'b', 'strong', 'i', 'em', 'u', 's', 'strike', 'span', 'font']);
    (function walk(node){
      Array.from(node.childNodes).forEach(child => {
        if(child.nodeType !== 1){ return; }
        const tag = child.tagName.toLowerCase();
        if(!allowedTags.has(tag)){
          child.replaceWith(document.createTextNode(child.textContent));
          return;
        }
        Array.from(child.attributes).forEach(attr => {
          const name = attr.name.toLowerCase();
          if(name === 'style'){
            const m = attr.value.match(/color\s*:\s*[^;]+/i);
            if(m) child.setAttribute('style', m[0]); else child.removeAttribute('style');
          } else if(name !== 'color'){
            child.removeAttribute(attr.name);
          }
        });
        walk(child);
      });
    })(tmp);
    return tmp.innerHTML;
  }

  function setupNotesLongPress(notesWrap, cut){
    let timer = null, cancelled = false, startX = 0, startY = 0;
    notesWrap.addEventListener('pointerdown', e => {
      if(selectMode) return;
      cancelled = false;
      startX = e.clientX; startY = e.clientY;
      clearTimeout(timer);
      /* See the .longpress-armed CSS comment: suppressed only while this specific hold could
         still become an expand-open, restored the moment it's ruled out or it succeeds. */
      notesWrap.classList.add('longpress-armed');
      timer = setTimeout(() => {
        notesWrap.classList.remove('longpress-armed');
        if(cancelled) return;
        const rect = notesWrap.getBoundingClientRect();
        openNotesExpand(cut, notesWrap, rect);
      }, 480);
      const onMove = ev => {
        if(Math.hypot(ev.clientX - startX, ev.clientY - startY) > 12){
          cancelled = true; clearTimeout(timer);
          notesWrap.classList.remove('longpress-armed');
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
        }
      };
      const onUp = () => {
        cancelled = true; clearTimeout(timer);
        notesWrap.classList.remove('longpress-armed');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }

  function repositionNotesExpandPanel(){
    const margin = 26;
    const targetW = Math.min(window.innerWidth - margin * 2, 620);
    const targetH = Math.min(window.innerHeight - margin * 2 - 30, 780);
    const targetLeft = (window.innerWidth - targetW) / 2;
    const targetTop = (window.innerHeight - targetH) / 2;
    notesExpandPanel.style.left = targetLeft + 'px';
    notesExpandPanel.style.top = targetTop + 'px';
    notesExpandPanel.style.width = targetW + 'px';
    notesExpandPanel.style.height = targetH + 'px';
  }
  function openNotesExpand(cut, notesWrap, sourceRect){
    expandedCutId = cut.id;
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();

    notesExpandLabel.textContent = shotLabelFor(cut.id) + ' — NOTES';

    notesExpandLines.contentEditable = (appMode === 'trash' || !editMode || selectMode) ? 'false' : 'true';
    buildLinesInto(cut, notesExpandLines);
    syncFormatButtonsUI();
    resetNotesHistory(cut.notesHtml || '');

    notesExpandPanel.style.transition = 'none';
    notesExpandPanel.style.left = sourceRect.left + 'px';
    notesExpandPanel.style.top = sourceRect.top + 'px';
    notesExpandPanel.style.width = sourceRect.width + 'px';

  /* ---- Formatting toolbar (color + bold/italic/underline/strikethrough) ----

     on the buttons stops the browser from stealing focus (and clearing the selection) before the

  function syncFormatButtonsUI(){

  function rgbToHex(rgb){

    return '#' + [m[1], m[2], m[3]].map(n => Number(n).toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  function syncExpandedNotesAfterFormat(){

  /* ===================== Menu (handle tap: Duplicate / Trash) ===================== */
  function toggleUnitMenu(id){

  document.addEventListener('pointerdown', e => {
