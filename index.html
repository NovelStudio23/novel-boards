    --bg-deep: #2C2C2F;
    --bg-well: #333336;
    --bg-elevated: #45454A;
    --bg-elevated-2: #505056;
    --line: rgba(255,255,255,0.10);
    --line-strong: rgba(255,255,255,0.20);
    --text: #F0F0F1;
    --text-dim: #ADADB3;
    --text-faint: #7C7C82;
    --paper: #FFFFFF;
    --paper-line: #E2E2E4;
    --ink: #222225;
    --ink-dim: #77777C;
    --frame-border: #2B2B2E;
    --frame-guide: #C7C7CC;
    --accent: #E0502A;
    --accent-dim: #7A3020;
    --accent-soft: rgba(224,80,42,0.16);
    --danger: #D64545;
    --font-display: 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'SF Mono', Menlo, ui-monospace, Consolas, monospace;
    /* Kept in sync with the actual rendered height of #selectToolbar (see
       updateSelectToolbarSpacing) so the filmstrip's scrollable area and the nav buttons can
       reserve exactly enough room to clear it in Select mode — see the select-mode overrides
       near .filmstrip / .nav-buttons below. Safe default before JS runs (or if select mode is
       never entered) is 0, matching the toolbar being off-screen. */
    --select-toolbar-h: 0px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .note-line, #projectTitle{ -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
  /* While a notes long-press is still a candidate to open the expand overlay (see
     setupNotesLongPress), native text selection is suppressed so the two stationary-hold
     gestures can't visibly compete for the same touch. Higher specificity than the rule above,
     which it needs to override. Removed the instant the hold is ruled out (moved/lifted) or
     succeeds, so a genuine text-selection drag right after is completely unaffected. */
  .notes.longpress-armed .note-line{ -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; height:100%; height:-webkit-fill-available; overflow:hidden; overscroll-behavior:none; background:var(--bg); }
  body{ font-family:var(--font-body); color:var(--text); }
  button, input, textarea{ font-family:inherit; color:inherit; }
  button{ appearance:none; -webkit-appearance:none; background:none; border:none; padding:0; cursor:pointer; transition:transform .12s ease, opacity .12s ease, background .15s ease, border-color .15s ease; }
  button:active{ transform:scale(.95); }
  svg{ display:block; }

  button:focus-visible, textarea:focus-visible, input:focus-visible, [contenteditable]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  #app{ height:100vh; height:100dvh; height:-webkit-fill-available; display:flex; flex-direction:column; }

  /* ---------- Top bar ---------- */
  .topbar{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding: max(12px, env(safe-area-inset-top)) 14px 12px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:11px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:transparent; color:var(--text); border:1px solid transparent;
    touch-action:none; -webkit-touch-callout:none;
  }
  .icon-btn:hover{ background:var(--bg-elevated-2); }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn.disabled{ opacity:.3; pointer-events:none; }

  .view-toggle{ display:flex; gap:2px; background:var(--bg-elevated-2); border-radius:11px; padding:2px; flex:0 0 auto; }
  .view-toggle-btn{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); }
  .view-toggle-btn svg{ width:16px; height:16px; }
  .view-toggle-btn.active{ background:var(--bg-elevated); color:var(--accent); }

  .brand{ display:flex; align-items:center; gap:9px; flex:1 1 auto; min-width:0; margin-left:4px; }
  .brand-mark{ color:var(--accent); flex:0 0 auto; display:flex; }
  .brand-mark svg{ width:20px; height:20px; }
  #projectTitle{
    font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; outline:none; min-width:0;
  }
  #projectTitle[contenteditable="false"]{ cursor:default; }
  .topbar-controls{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }

  #searchToggleBtn.active{ background:var(--bg-elevated-2); color:var(--accent); }

  .search-panel{
    position:absolute; top:100%; right:14px; margin-top:6px;
    width:340px; max-width:calc(100vw - 28px); max-height:min(60vh, 480px);
    background:var(--bg-elevated); border:1px solid var(--line-strong); border-radius:14px;
    box-shadow:0 18px 40px rgba(0,0,0,.45); z-index:130;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .search-input-row{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:10px 10px 10px 14px; border-bottom:1px solid var(--line);
  }
  .search-input-icon{ width:17px; height:17px; color:var(--text-dim); flex:0 0 auto; }
  #searchInput{
    flex:1 1 auto; min-width:0; background:none; border:none; outline:none;
    font-size:15px; color:var(--text);
  }
  #searchInput::placeholder{ color:var(--text-dim); }
  .search-panel-close-btn{ width:30px; height:30px; }
  .search-panel-close-btn svg{ width:15px; height:15px; }
  .search-results{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .search-result-row{
    display:flex; align-items:baseline; gap:10px; width:100%;
    padding:10px 14px; text-align:left; border-bottom:1px solid var(--line);
  }
  .search-result-row:last-child{ border-bottom:none; }
  .search-result-row:active{ background:var(--bg-elevated-2); }
  .search-result-label{ flex:0 0 auto; font-weight:700; color:var(--accent); font-size:13.5px; }
  .search-result-snippet{
    flex:1 1 auto; min-width:0; color:var(--text-dim); font-size:13px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .search-empty-row{ padding:16px 14px; color:var(--text-dim); font-size:13.5px; text-align:center; }

  .add-scene-btn{
    flex:0 0 auto; display:flex; align-items:center; gap:4px; padding:8px 12px; border-radius:17px; font-size:12.5px; font-weight:700;
    border:1px solid var(--line-strong); color:var(--text-dim); background:transparent; white-space:nowrap;
  }
  .add-scene-btn svg{ width:12px; height:12px; }
  .add-scene-btn:hover{ background:var(--bg-elevated-2); color:var(--text); }
  body.view-mode .add-scene-btn{ display:none; }

  .edit-toggle-btn, .select-toggle-btn{
    flex:0 0 auto; padding:8px 16px; border-radius:18px; font-size:13px; font-weight:700;
    border:1px solid var(--line-strong); color:var(--text); background:transparent; white-space:nowrap;
  }
  .edit-toggle-btn:hover, .select-toggle-btn:hover{ background:var(--bg-elevated-2); }
  .edit-toggle-btn.active, .select-toggle-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ---------- Workspace / sidebar ---------- */
  .workspace{ position:relative; flex:1 1 auto; min-height:0; display:flex; }

  .sidebar{
    position:absolute; inset:0 auto 0 0; width:280px; max-width:82vw;
    background:var(--bg-elevated); border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    transform:translateX(-100%); transition:transform .32s cubic-bezier(.32,.72,0,1);
    z-index:40; padding-top:env(safe-area-inset-top);
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-scroll{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .folder-header-row{ display:flex; align-items:center; padding:14px 10px 10px 16px; gap:2px; position:relative; }
  .folder-header-toggle{
    display:flex; align-items:center; gap:8px; flex:1 1 auto; min-width:0;
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; color:var(--text-dim); text-transform:uppercase;
  }
  .folder-header-toggle svg{ width:14px; height:14px; flex:0 0 auto; }
  .folder-header-toggle .folder-icon{ color:var(--accent); }
  .folder-chevron{ margin-left:2px; transition:transform .2s ease; color:var(--text-faint); }
  .folder-section.collapsed .folder-chevron{ transform:rotate(-90deg); }
  .sort-btn{ width:27px; height:27px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); flex:0 0 auto; }
  .sort-btn:hover, .sort-btn.active{ background:var(--bg-elevated-2); color:var(--text); }
  .sort-btn svg{ width:14px; height:14px; }
  .sort-menu{
    position:absolute; top:100%; right:10px; z-index:10; background:var(--bg-elevated-2);
    border:1px solid var(--line-strong); border-radius:12px; padding:5px; display:none;
    box-shadow:0 12px 28px rgba(0,0,0,.4); min-width:158px;
  }
  .sort-menu.open{ display:block; }
  .sort-option{ display:flex; align-items:center; justify-content:space-between; width:100%; padding:8px 10px; border-radius:8px; font-size:12.5px; color:var(--text-dim); }
  .sort-option:hover{ background:var(--bg-elevated); color:var(--text); }
  .sort-option.active{ color:var(--accent); font-weight:700; }
  .sort-dir{ font-size:11px; opacity:.85; }

  .folder-body{ display:flex; flex-direction:column; gap:2px; padding:0 10px 10px; overflow:hidden; }
  .folder-section.collapsed .folder-body{ display:none; }

  .project-row{ position:relative; }
  .project-item{ display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:10px; width:100%; text-align:left; font-size:13.5px; position:relative; touch-action:pan-y; }
  .project-item:hover{ background:var(--bg-elevated-2); }
  .project-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .project-item.active svg{ color:var(--accent); }
  .project-item.dragging{ z-index:5; background:var(--bg-elevated-2); box-shadow:0 10px 24px rgba(0,0,0,.4); }
  .project-item svg{ width:15px; height:15px; flex:0 0 auto; opacity:.75; }
  .project-item-title{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .new-project-item{ color:var(--accent); font-weight:700; margin-top:2px; touch-action:auto; }
  .project-delete-chip{
    display:none; align-items:center; gap:5px; position:absolute; right:8px; top:50%; transform:translateY(-50%);
    padding:5px 12px; border-radius:12px; background:var(--danger); color:#fff; font-size:11.5px; font-weight:700; z-index:3;
  }
  .project-delete-chip:active{ transform:translateY(-50%) scale(.95); }
  .project-delete-chip svg{ width:11px; height:11px; }
  .project-row.menu-open .project-delete-chip{ display:inline-flex; }
  .project-row.menu-open .project-item{ padding-right:78px; }

  .sidebar-divider{ height:1px; background:var(--line); margin:6px 16px 4px; }
  .sidebar-header{ padding:10px 18px 8px; font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; color:var(--text-dim); text-transform:uppercase; }
  .sidebar-list{ padding:0 10px; display:flex; flex-direction:column; gap:3px; }
  .scene-row{ position:relative; touch-action:none; }
  .scene-row.dragging{ z-index:5; background:var(--bg-elevated-2); box-shadow:0 10px 24px rgba(0,0,0,.4); border-radius:11px; }
  .scene-item{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:10px 12px; border-radius:11px; width:100%; text-align:left; }
  /* touch-action:none on .scene-row means WE drive scrolling manually (see
     onSceneItemPointerDown) by re-positioning content under a mostly-stationary finger —
     which is exactly what exposes iOS Safari's touch-to-mouse-event emulation: touching a
     button fires a simulated :hover immediately (that's the initial gray flash on touchdown),
     and it doesn't clear as the content scrolls past underneath; at touchend, a synthetic
     mouseover fires for whatever row now happens to sit at the finger's on-screen position,
     and since simulated :hover on iOS doesn't release until a *different* element is tapped,
     that row is left stuck gray — reads as though the scroll snagged there. Scoping the rule
     to real hover-capable pointers (mouse/trackpad) removes the touch-simulated version
     entirely while keeping genuine hover for anyone using the app with a pointing device. */
  @media (hover: hover) and (pointer: fine){
    .scene-item:hover{ background:var(--bg-elevated-2); }
  }
  .scene-item-num{ font-family:var(--font-mono); font-size:13px; color:var(--accent); font-weight:700; letter-spacing:.03em; }
  .scene-item-count{ font-size:11.5px; color:var(--text-dim); }
  .scene-row.menu-open .scene-item{ background:var(--bg-elevated-2); }
  /* Select mode: room for the circle so it doesn't cover the shot-count text, and a tinted
     background (reusing the same accent-soft treatment as an active project row) so a
     fully-selected scene reads clearly at a glance while scrolling the list. */
  .sidebar-list.scene-select-mode .scene-item{ padding-right:44px; }
  .scene-row.scene-selected .scene-item{ background:var(--accent-soft); }
  .scene-select-circle{ position:absolute; top:50%; right:12px; transform:translateY(-50%); }
  /* Without this, the global button:active{transform:scale(.95)} rule (higher specificity —
     it matches both the element and the pseudo-class) replaces our translateY(-50%) outright
     instead of combining with it, so the circle's vertical-centering offset disappears on
     press and it visibly jumps down by half its height. Same fix already used for
     .project-delete-chip above, which centers the same way. */
  .scene-select-circle:active{ transform:translateY(-50%) scale(.95); }
  .sidebar-empty{ padding:2px 12px 10px; color:var(--text-faint); font-size:12.5px; line-height:1.6; }
  .sidebar-footer{ padding:12px 18px calc(16px + env(safe-area-inset-bottom)); font-size:11px; color:var(--text-faint); line-height:1.55; border-top:1px solid var(--line); flex:0 0 auto; }
  .backup-row{ display:flex; gap:8px; }
  .backup-row + .backup-row{ margin-top:8px; }
  .backup-btn{ flex:1 1 0; display:flex; align-items:center; justify-content:center; gap:5px; padding:8px 6px; border-radius:10px; border:1px solid var(--line-strong); color:var(--text-dim); font-size:11px; font-weight:700; }
  .backup-btn svg{ width:13px; height:13px; flex:0 0 auto; }
  .backup-btn:hover{ background:var(--bg-elevated-2); color:var(--text); }

  .backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.42); opacity:0; pointer-events:none; transition:opacity .32s ease; z-index:35; }
  .backdrop.show{ opacity:1; pointer-events:auto; }

  /* ---------- Stage / filmstrip ---------- */
  /* position:relative so the custom Tile View scrollbar overlay (position:absolute, added as a
     sibling of .filmstrip below) can be positioned using .filmstrip's own offsetTop/offsetLeft —
     see the "Tile View custom scrollbar" section further down for why the native one isn't used. */
  .stage{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; position:relative; }

  /* ---------- First/last shot navigation buttons ---------- */
  /* Fixed to the viewport (not .stage) so it's never clipped and always sits in the same
     physical corner regardless of scroll position. z-index 20 is deliberate: above ordinary
     filmstrip content, but below the sidebar backdrop (35) and every modal/editor overlay
     (100+) — so it's correctly covered/blocked whenever any of those are open, with no extra
     JS show/hide logic needed for that case. Stacks vertically (up/down) in portrait and
     horizontally (left/right) in landscape, matching whichever axis the filmstrip itself
     actually scrolls on for that orientation (see "Tile View" / "Scroll only via instant
     scrollTo" in project instructions — orientation always drives the scroll axis here too). */
  .nav-buttons{
    position:fixed; right:calc(16px + env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:20; display:flex; flex-direction:column; gap:10px;
    transition:bottom .28s cubic-bezier(.32,.72,0,1);
  }
  /* Select mode's bottom toolbar sits at z-index 120, well above the nav buttons (20) — without
     this, it would visually bury them under it any time both are on-screen together. Shifting
     the buttons up by the toolbar's actual measured height (--select-toolbar-h, kept current by
     updateSelectToolbarSpacing) keeps them fully clear of it. Portrait only — landscape keeps
     its original behavior unchanged. */
  @media (orientation: portrait){
    body.select-mode .nav-buttons{ bottom:calc(16px + env(safe-area-inset-bottom) + var(--select-toolbar-h)); }
  }
  @media (orientation: landscape){ .nav-buttons{ flex-direction:row; } }
  .nav-buttons.hidden{ display:none; }
  .nav-btn{
    width:44px; height:44px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-elevated); border:1px solid var(--line-strong); color:var(--text-dim);
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .nav-btn:hover{ background:var(--bg-elevated-2); color:var(--text); }
  .nav-btn:active{ transform:scale(0.94); }
  .nav-btn svg{ width:20px; height:20px; }

  .sprockets, .sprockets-bottom{
    height:13px; flex:0 0 auto; background:var(--bg-elevated);
    background-image: radial-gradient(circle, rgba(255,255,255,.14) 2.3px, transparent 2.4px);
    background-size:22px 100%; background-position:11px center;
  }
  .sprockets{ border-bottom:1px solid var(--line); }
  .sprockets-bottom{ border-top:1px solid var(--line); }
  body.view-mode .sprockets, body.view-mode .sprockets-bottom{ display:none; }

  .filmstrip{
    flex:1 1 auto; min-height:0; display:flex; align-items:stretch;
    overflow-x:auto; overflow-y:hidden;
    padding:20px 8px 22px;
    background:var(--bg-well);
    box-shadow: inset 0 10px 18px -14px rgba(0,0,0,.55);
    scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
    touch-action:pan-x;
  }
  body.view-mode .filmstrip{ padding:0; box-shadow:none; }
  /* Normal View (and Trash, which always uses this same layout) fills the filmstrip edge-to-edge
     with white cards once Done is pressed. The rest of the app is dark, so the OS's native
     momentum-scroll indicator defaults to its light/white variant for contrast against that — but
     against these white cards specifically, a white indicator is nearly invisible. color-scheme is
     the one CSS property Safari actually consults to decide the indicator's light/dark variant;
     forcing it to 'light' here (this area only — never on tile-mode, whose gray background already
     shows the white indicator fine) makes Safari pick the dark-on-light variant instead. */
  body.view-mode .filmstrip:not(.tile-mode){ color-scheme:light; }

  /* Select mode is edit-mode-only (see selectBtn), so this never has to coexist with
     body.view-mode's padding:0 above — the base edit-mode padding always applies here first,
     and this just adds the toolbar's live-measured height on top of its existing bottom edge,
     so the last card/row can scroll fully clear of the toolbar instead of ending up hidden
     underneath it. Portrait only — landscape keeps its original behavior unchanged. */
  @media (orientation: portrait){
    .filmstrip{ flex-direction:column; overflow-x:hidden; overflow-y:auto; touch-action:pan-y; padding:14px 12px 20px; }
    body.select-mode .filmstrip{ padding-bottom: calc(20px + var(--select-toolbar-h)); }
  }

  .filmstrip.tile-mode{
    display:grid; grid-auto-flow:column; grid-template-rows:repeat(4, auto);
    grid-auto-columns:185px; gap:10px; align-content:center; justify-content:start;
    overflow-x:auto; overflow-y:hidden; padding:16px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  /* Tile View scrolling is driven manually via filmstripEl.scrollTo() whenever the touch started
     on a .tile (touch-action:none there — see onTilePointerDown), since the browser's own pan
     gesture never gets to start. The native overlay scroll indicator's position/visibility is
     tied to that native pan gesture internally in WebKit, so it doesn't reliably track a purely
     programmatic scrollTo the same way — it can lag, show the wrong position, or not appear at
     all. Hidden here and replaced with #tileScrollbar below, which is driven directly off the
     real scrollTop/scrollLeft on every 'scroll' event, so it can't desync from the real position
     no matter which path (native pan on the gaps, or JS scrollTo from a tile drag) caused it. */
  .filmstrip.tile-mode::-webkit-scrollbar{ display:none; width:0; height:0; }
  @media (orientation: portrait){
    .filmstrip.tile-mode{
      grid-auto-flow:row; grid-template-rows:none; grid-template-columns:repeat(3, 185px);
      grid-auto-rows:100px;
      overflow-x:hidden; overflow-y:auto; align-content:start; justify-content:center;
    }
    body.select-mode .filmstrip.tile-mode{ padding-bottom: calc(16px + var(--select-toolbar-h)); }
  }
  /* Tile View's replacement for the native scroll indicator (see the ::-webkit-scrollbar comment
     above). Track is invisible (matches the native indicator's own minimal look — no visible
     rail, just a floating thumb); position/size of both are set inline from JS in
     updateTileScrollbar() since they depend on live scroll geometry, not just orientation. Fades
     in on scroll and back out ~700ms after it settles, same "flash then fade" feel as native. */
  .tile-scrollbar{ position:absolute; z-index:3; pointer-events:none; opacity:0; transition:opacity .25s ease; }
  .tile-scrollbar.show{ opacity:1; }
  .tile-scrollbar-thumb{ position:absolute; background:rgba(255,255,255,.55); border-radius:3px; pointer-events:auto; }
  .tile-scrollbar-thumb:active{ background:rgba(255,255,255,.8); }
  .tile{
    width:185px; aspect-ratio:1.85; position:relative; flex:0 0 auto;
    background:#fff; border:1.5px solid var(--frame-border); overflow:hidden; cursor:pointer; touch-action:none;
  }
  @media (orientation: portrait){ .tile{ width:185px; height:100px; } }
  .tile img{ position:relative; width:100%; height:100%; object-fit:contain; display:block; -webkit-user-drag:none; }
  .tile-hint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#B8B8BC; }
  .tile-hint svg{ width:16px; height:16px; opacity:.5; }
  .tile-badge{ position:absolute; top:4px; right:5px; font-family:var(--font-mono); font-size:9.5px; color:#fff; background:rgba(20,20,22,.55); padding:2px 5px; border-radius:5px; pointer-events:none; }
  .tile.dragging{ z-index:60; box-shadow:0 20px 40px rgba(0,0,0,.5); }

  .loading-state{ margin:auto; color:var(--text-faint); font-size:13px; font-family:var(--font-mono); }

  .empty-state{ margin:auto; display:flex; flex-direction:column; align-items:center; gap:14px; color:var(--text-dim); padding:40px; text-align:center; }
  .empty-icon{ color:var(--text-faint); }
  .empty-icon svg{ width:46px; height:46px; }
  .empty-state p{ font-size:14.5px; margin:0; }
  .empty-add-btn{ display:flex; align-items:center; gap:8px; padding:11px 20px; border-radius:23px; background:var(--accent); color:#fff; font-weight:700; font-size:13.5px; }
  .empty-add-btn svg{ width:16px; height:16px; }
  body.view-mode .empty-add-btn{ display:none; }

  .gutter{ flex:0 0 30px; display:flex; align-items:center; justify-content:center; position:relative; }
  @media (orientation: portrait){ .gutter{ flex:0 0 20px; } .gutter:not(:first-child){ margin-top:20px; } }
  @media (orientation: portrait){ body.view-mode .gutter{ margin-top:0; } }
  body.view-mode .gutter{ flex:0 0 0; }
  .add-btn{
    width:27px; height:27px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1.6px dashed var(--line-strong); color:var(--text-dim); opacity:.55;
  }

  .add-btn:hover{ opacity:1; border-color:var(--accent); color:var(--accent); }
  .add-btn:active{ transform:scale(.88); }
  body.view-mode .add-btn{ display:none; }

  .cut-unit{
    flex:0 0 clamp(284px, 35.2vw, 354px); min-width:0;
    display:flex; flex-direction:column; height:100%;
    padding:0 6px;
  }
  body.view-mode .cut-unit{ flex-basis:clamp(340px, 44vw, 470px); padding:0; }
  @media (orientation: portrait){
    .cut-unit{ width:100%; height:auto; flex:0 0 auto; padding:0; }
    body.view-mode .cut-unit{ flex-basis:auto; }
    .handle-row{ margin-top:20px; }
  }

  .cut-unit.dragging{ transition:none; z-index:80; }
  .cut-unit.dragging .card{ box-shadow:0 26px 50px rgba(0,0,0,.5); }

  @keyframes justMoved{
    0%{ box-shadow:0 0 0 3px var(--accent), 0 10px 22px rgba(0,0,0,.4); }
    100%{ box-shadow:0 10px 22px rgba(0,0,0,.4); }
  }
  @keyframes justMovedRing{
    0%{ box-shadow:0 0 0 3px rgba(224,80,42,1); }
    100%{ box-shadow:0 0 0 3px rgba(224,80,42,0); }
  }
  .cut-unit.just-moved .card{ animation:justMoved 1600ms ease-out; }
  /* Tiles have no permanent shadow of their own (unlike .card), so use the pure ring fade. */
  .tile.just-moved{ animation:justMovedRing 1600ms ease-out; }
  .project-row.just-moved, .scene-row.just-moved{ animation:justMoved 1600ms ease-out; border-radius:11px; }

  /* handle row: scene (left) / reorder (center) / cut number (right) */
  .handle-row{ flex:0 0 auto; height:30px; margin-bottom:7px; position:relative; }
  .scene-input-top{
    position:absolute; left:0; top:50%; transform:translateY(-50%); width:80px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    color:var(--text); background:var(--bg-elevated-2); border:1px solid var(--line-strong);
    border-radius:8px; padding:5px 8px;
  }
  .scene-input-top::placeholder{ color:var(--text-faint); }
  body.view-mode .scene-input-top{ cursor:default; }
  .cut-badge-top{
    position:absolute; right:2px; top:50%; transform:translateY(-50%);
    font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; color:var(--text-dim);
  }
  .handle-center-group{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:flex; align-items:center; gap:6px;
  }
  .handle-btn{
    width:58px; height:27px; border-radius:14px; background:var(--bg-elevated-2);
    border:1px solid var(--line-strong); color:var(--text-dim); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; touch-action:none;
  }
  .handle-btn svg{ width:15px; height:15px; }
  .handle-btn:hover{ color:var(--text); }
  body.view-mode .handle-btn{ visibility:hidden; }
  .select-circle{
    width:26px; height:26px; border-radius:50%; flex:0 0 auto;
    border:2px solid rgba(255,255,255,.5); background:rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center; touch-action:none;
  }
  .select-circle svg{ width:14px; height:14px; color:#fff; opacity:0; transition:opacity .15s ease; }
  .select-circle.selected{ background:var(--accent); border-color:var(--accent); }
  .select-circle.selected svg{ opacity:1; }
  .tile-select-circle{ position:absolute; top:5px; left:5px; z-index:4; }
  /* Sized to match .select-all-circle in the bottom select toolbar, not the per-shot 26px
     circle it otherwise inherits .select-circle's styling from. */
  .scene-select-circle{ width:20px; height:20px; }
  .scene-select-circle svg{ width:11px; height:11px; }
  /* A short tap on the handle (vs. a drag) reveals this menu instead of the old single Trash
     chip — same reveal mechanism (.cut-unit.menu-open), same pill width/style per row, just
     stacked two rows deep now that there are two options instead of one. */
  .handle-menu{
    display:none; position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:4px;
    flex-direction:column; gap:4px; z-index:5;
  }
  .cut-unit.menu-open .handle-menu{ display:flex; }
  .handle-menu-btn{
    display:flex; align-items:center; justify-content:center; gap:5px; height:26px; padding:0 11px;
    border-radius:13px; font-size:12px; font-weight:700; white-space:nowrap;
  }
  .handle-menu-btn:active{ transform:scale(.95); }
  .handle-menu-btn svg{ width:12px; height:12px; }
  .handle-menu-btn.duplicate-btn{ background:var(--bg-elevated-2); color:var(--text); border:1px solid var(--line-strong); }
  .handle-menu-btn.trash-btn{ background:var(--danger); color:#fff; }

  .card{
    flex:1 1 auto; min-height:0; min-width:0; display:flex; flex-direction:column;
    background:var(--paper); border-radius:0; overflow:hidden;
    box-shadow:0 10px 22px rgba(0,0,0,.4); border:1px solid rgba(0,0,0,.06);
  }
  @media (orientation: portrait){ .card{ flex-direction:row; aspect-ratio:3.7; } }
  body.view-mode .card{ border:1px solid rgba(0,0,0,.7); }

  /* ---------- Frame (cinema-ratio artwork area — drawing only) ---------- */
  .frame{
    position:relative; width:100%; aspect-ratio:1.85; flex:0 0 auto;
    background:#fff; overflow:hidden; border-bottom:1.5px solid var(--frame-border);
  }
  @media (orientation: portrait){
    /* height comes from the card's own aspect-ratio (see .card above), not from this box's own
       aspect-ratio, so it can never be stretched taller than 1.85:1 by the notes column */
    .frame{ width:50%; flex:0 0 50%; height:100%; aspect-ratio:auto; border-bottom:none; border-right:1.5px solid var(--frame-border); }
  }
  .frame-canvas{ position:relative; width:100%; height:100%; display:block; touch-action:pan-x; }
  @media (orientation: portrait){ .frame-canvas{ touch-action:pan-y; } }
  .frame-guide-239{
    position:absolute; left:0; right:0; top:11.3%; bottom:11.3%;
    border-top:1px solid var(--frame-guide); border-bottom:1px solid var(--frame-guide);
    pointer-events:none;
  }
  .frame-guide-133{
    position:absolute; top:0; bottom:0; left:14.05%; right:14.05%;
    border-left:1px solid var(--frame-guide); border-right:1px solid var(--frame-guide);
    pointer-events:none;
  }
  .frame-hint{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; color:#B8B8BC; pointer-events:none; text-align:center;
  }
  .frame-hint svg{ width:18px; height:18px; opacity:.55; }
  .frame-hint span{ font-size:11px; }

  /* ---------- Notes (line-by-line) ---------- */
  .card .notes{ flex:1 1 auto; min-height:0; min-width:0; background:var(--paper); position:relative; }
  @media (orientation: portrait){ .card .notes{ height:100%; } }
  .notes-lines{
    position:relative; height:100%; width:100%; min-width:0; overflow-y:hidden; overflow-x:hidden;
    display:flex; flex-direction:column; padding:0 0 10px;
  }
  .note-line{
    width:100%; min-width:0; height:37.5px; line-height:37.5px; flex:0 0 auto;
    border:none; border-bottom:1.5px solid var(--paper-line); background:transparent; padding:0 16px;
    font-size:20.25px; color:var(--ink); outline:none; white-space:nowrap; overflow:hidden;
  }
  .note-line:focus{ background:var(--accent-soft); }
  body.view-mode .note-line{ cursor:default; }
  /* Ruled line under whatever blank space is left below the last actual line, so the note area
     still reads as lined paper even where nothing's been typed yet — same idea as the old
     tiled-background approach this replaced, just as an ordinary flex:1 sibling that fills
     leftover space in the column (ordinary elements never need a min-height beyond one line: on
     a long note that already needs scrolling, flex-grow naturally contributes ~0 extra height
     here since there's no leftover space to fill; on a short note it stretches to cover the rest
     of the visible area). min-height keeps at least one blank ruled line always visible either
     way. Both the border-bottom above and this element's own background are ordinary painted
     content, not a CSS "attached" background — see the block comment on .notes-lines.expanded
     below for why that distinction is the actual point of this whole change. */
  .notes-lines-filler{
    flex:1 1 auto; min-height:37.5px; width:100%;
    background-image: linear-gradient(var(--paper) 36px, var(--paper-line) 36px, var(--paper-line) 37.5px, var(--paper) 37.5px);
    background-size:100% 37.5px;
  }

  /* Scrolling here (the long-press "expand" zoom) used to desync visibly: the ruled-line pattern
     was a CSS background-image with background-attachment:local, meant to scroll together with
     this element's own overflow content. In principle that's exactly the right tool for a
     scrolling ruled-paper look — but WebKit has a long-standing quirk where a locally-attached
     background doesn't reliably repaint in the same frame as momentum-scrolled content
     (-webkit-overflow-scrolling:touch), so during a scroll/flick the lines and the text visibly
     separated for a moment before catching back up. Fixed by not using a "background" for the
     lines at all: each .note-line now draws its own ruled line as an ordinary border-bottom on
     itself (see above), and the blank space below the last line is covered by .notes-lines-filler,
     an ordinary in-flow sibling with its own plain (non-attached) background. Neither depends on
     WebKit syncing a background repaint to a separate content scroll — a bordered/backgrounded
     element scrolling as part of ordinary page content has nothing to get out of sync with,
     which is the actual "moves as one rigid page, like real paper" behavior that was wanted. */
  .notes-lines.expanded{
    overflow-y:auto; -webkit-overflow-scrolling:touch; outline:none;
  }
  .notes-lines.expanded .note-line{ height:45px; line-height:45px; font-size:23.25px; padding:0 22px; }
  .notes-lines.expanded .notes-lines-filler{
    min-height:45px;
    background-image: linear-gradient(var(--paper) 43.5px, var(--paper-line) 43.5px, var(--paper-line) 45px, var(--paper) 45px);
    background-size:100% 45px;
  }

  /* ---------- Notes expand overlay (long-press) ---------- */
  .notes-expand-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .28s ease; z-index:150; }
  .notes-expand-backdrop.show{ opacity:1; pointer-events:auto; }
  .notes-expand-panel{
    position:fixed; background:var(--paper); z-index:151; border-radius:18px; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 30px 70px rgba(0,0,0,.5);
    opacity:0; pointer-events:none;
    transition:opacity .22s ease, top .32s cubic-bezier(.32,.72,0,1), left .32s cubic-bezier(.32,.72,0,1), width .32s cubic-bezier(.32,.72,0,1), height .32s cubic-bezier(.32,.72,0,1);
  }
  .notes-expand-panel.show{ opacity:1; pointer-events:auto; }
  .notes-expand-header{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--paper-line); background:var(--paper);
  }
  .notes-expand-header-left{ display:flex; align-items:center; gap:14px; min-width:0; }
  .notes-expand-header span{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); letter-spacing:.05em; }
  .notes-history-controls{ display:flex; align-items:center; gap:4px; flex:0 0 auto; }
  .notes-history-btn{
    width:26px; height:26px; border-radius:8px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; color:var(--ink-dim);
  }
  .notes-history-btn svg{ width:15px; height:15px; }
  .notes-history-btn:hover{ background:var(--paper-line); }
  .notes-history-btn.disabled{ opacity:.3; pointer-events:none; }
  .notes-expand-done{ padding:7px 15px; border-radius:16px; background:var(--accent); color:#fff; font-weight:700; font-size:12.5px; }
  .notes-expand-body{ flex:1 1 auto; min-height:0; }

  .notes-format-toolbar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:9px 16px; border-bottom:3px solid var(--ink); background:var(--paper);
  }
  .notes-format-colors{ display:flex; align-items:center; gap:7px; }
  .notes-color-swatch{ width:22px; height:22px; border-radius:50%; border:2px solid transparent; padding:0; flex:0 0 auto; }
  .notes-color-swatch.active{ border-color:var(--ink-dim); }
  .notes-format-styles{ display:flex; align-items:center; gap:4px; }
  .notes-style-btn{
    width:30px; height:30px; border-radius:8px; background:var(--paper-line); color:var(--ink);
    font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .notes-style-btn.active{ background:var(--accent); color:#fff; }
  .notes-delete-all-btn{
    flex:0 0 auto; padding:7px 13px; border-radius:14px; background:var(--danger); color:#fff;
    font-size:12px; font-weight:700; white-space:nowrap;
  }
  .note-line[data-placeholder]:empty::before{ content:attr(data-placeholder); color:var(--ink-dim); pointer-events:none; }

  /* ---- PDF export overlay ---- */
  .pdf-export-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.6); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:160; }
  .pdf-export-backdrop.show{ opacity:1; pointer-events:auto; }
  .pdf-export-panel{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(.96);
    width:min(640px, 92vw); height:min(84vh, 820px); z-index:161;
    background:var(--bg-elevated); border-radius:18px; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 30px 70px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .22s ease, transform .22s ease;
  }
  .pdf-export-panel.show{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  .pdf-export-header{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line); font-weight:700; font-size:14px;
  }
  .pdf-layout-toggle{
    flex:0 0 auto; display:flex; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line);
  }
  .pdf-layout-btn{
    flex:1 1 0; padding:9px 0; border-radius:10px; background:var(--bg-elevated-2);
    border:1px solid var(--line-strong); color:var(--text-dim); font-size:13px; font-weight:700;
  }
  .pdf-layout-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .pdf-scene-range{
    flex:0 0 auto; display:flex; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line);
  }
  .pdf-scene-range-field{ flex:1 1 0; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .pdf-scene-range-field span{ font-size:11px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .pdf-scene-range-field select{
    width:100%; padding:8px 10px; border-radius:9px; background:var(--bg-elevated-2);
    border:1px solid var(--line-strong); color:var(--text); font-size:13px; font-weight:600;
  }
  .pdf-preview-wrap{ flex:1 1 auto; min-height:0; background:#6b6b6e; }
  #pdfPreviewFrame{ width:100%; height:100%; border:none; display:block; background:#6b6b6e; }
  .pdf-export-footer{ flex:0 0 auto; padding:12px 16px; border-top:1px solid var(--line); }
  .pdf-export-go-btn{
    width:100%; padding:12px 0; border-radius:12px; background:var(--accent); color:#fff;
    font-size:14.5px; font-weight:700;
  }

  /* ---------- Editor modal (Frame drawing) ---------- */
  .editor-modal.no-slide-transition{ transition:none; }
  .editor-modal{
    position:fixed; inset:0; background:var(--bg-deep); z-index:100;
    display:flex; flex-direction:column;
    /* 108% instead of exactly 100%: 100dvh-based layouts can leave a subpixel sliver visible
       at the bottom edge when "hidden"; the extra margin guarantees it's fully off-screen. */
    transform:translateY(108%); transition:transform .34s cubic-bezier(.32,.72,0,1);
  }
  .editor-modal.open{ transform:translateY(0); }
  .editor-topbar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 10px;
  }
  .editor-done-btn{ display:flex; align-items:center; gap:6px; padding:9px 16px; border-radius:20px; background:var(--accent); color:#fff; font-weight:700; font-size:13.5px; }
  .editor-done-btn svg{ width:15px; height:15px; }
  .editor-label{ font-family:var(--font-mono); color:var(--text-dim); font-size:12px; letter-spacing:.06em; }
  .editor-topbar-spacer{ width:87px; }

  .editor-canvas-wrap{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 18px; position:relative; }
  .editor-frame-inner{
    position:relative; max-width:100%; max-height:100%; aspect-ratio:1.85; background:#fff;
    border:1.5px solid var(--frame-border); box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  #editorCanvas{ position:relative; width:100%; height:100%; display:block; touch-action:none; }
  .editor-empty-hint{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:rgba(0,0,0,.32); pointer-events:none; text-align:center;
  }
  .editor-empty-hint svg{ width:24px; height:24px; opacity:.6; }
  .editor-empty-hint p{ margin:0; font-size:13px; line-height:1.5; }

  .photo-select-box{ position:absolute; border:2px solid #E0502A; box-sizing:border-box; pointer-events:none; }
  .photo-delete-btn{
    position:absolute; top:-40px; left:50%; transform:translateX(-50%);
    background:#E0502A; color:#fff; border:none; border-radius:8px; padding:7px 16px;
    font-size:12.5px; font-weight:700; white-space:nowrap; pointer-events:auto;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
  }
  /* Without this, the global button:active{transform:scale(.95)} rule (higher specificity —
     see .scene-select-circle above for the same issue) would REPLACE this button's own
     translateX(-50%) centering transform instead of combining with it, so pressing Delete
     visibly shifted the button sideways instead of shrinking it in place. Same fix, same
     scale factor, as .delete-chip below. */
  .photo-delete-btn:active{ transform:translateX(-50%) scale(.95); }

  /* Selection tool (4.x — lasso-select ink, Apple-Notes-style move/resize/rotate). The box is a
     real positioned DOM element (not canvas-drawn) so its corner/rotate handles can be ordinary
     elements with their own pointerdown targets, same approach as .photo-select-box above.
     transform-origin:50% 50% is what lets a single CSS rotate() on the box carry every handle
     around with it for free, instead of having to reposition each one by hand. */
  .selection-box{
    position:absolute; border:1.5px dashed #E0502A; box-sizing:border-box; pointer-events:auto;
    transform-origin:50% 50%; touch-action:none;
  }
  .sel-handle{
    position:absolute; width:16px; height:16px; margin:-8px; border-radius:50%;
    background:#fff; border:2px solid #E0502A; box-sizing:border-box; pointer-events:auto; touch-action:none;
  }
  .sel-handle-nw{ left:0; top:0; }
  .sel-handle-ne{ left:100%; top:0; }
  .sel-handle-se{ left:100%; top:100%; }
  .sel-handle-sw{ left:0; top:100%; }
  .sel-rotate-stem{
    position:absolute; left:50%; top:0; width:1.5px; height:26px; background:#E0502A;
    transform:translate(-50%,-26px); pointer-events:none;
  }
  .sel-handle-rotate{ left:50%; top:0; margin:0; transform:translate(-50%,-33px); }

  /* touch-action:none below, on the toolbar and every one of its controls, is what reliably
     stops the OS's own Scribble (handwriting-to-text) gesture recognizer from claiming an Apple
     Pencil touch that starts here — with the default touch-action:auto, WebKit can hand a
     pencil-down off to Scribble instead of the page, swallowing the tap and writing text
     instead of pressing the button. The tradeoff: touch-action:none also kills the toolbar's
     own native horizontal scroll (overflow-x:auto stops responding to touch/pencil drags once
     touch-action says "no native gesture handling at all here"). So scrolling is reimplemented
     manually in JS below (setupToolbarScroll), the same touch-action:none + manual pointer-
     driven scroll (with the shared momentum helper) already used for tiles and the sidebar scene
     list — see the comment on startMomentumScroll for why that pattern exists. */
  .editor-toolbar{
    flex:0 0 auto; display:flex; align-items:center; gap:9px;
    padding:10px 14px max(12px, env(safe-area-inset-bottom));
    overflow-x:auto; background:rgba(255,255,255,.03); border-top:1px solid var(--line);
    touch-action:none; -webkit-touch-callout:none;
  }
  .tool-divider{ width:1px; align-self:stretch; margin:4px 3px; background:var(--line-strong); flex:0 0 auto; }
  .tool-btn{ width:38px; height:38px; border-radius:10px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:var(--text-dim); border:1px solid transparent; touch-action:none; -webkit-touch-callout:none; }
  .tool-btn svg{ width:19px; height:19px; }
  .tool-btn.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-dim); }
  .pen-input-toggle{ display:flex; gap:2px; background:var(--bg-elevated-2); border-radius:9px; padding:2px; flex:0 0 auto; border:1px solid transparent; touch-action:none; -webkit-touch-callout:none; }
  .pen-input-toggle.tool-active{ border-color:var(--accent-dim); }
  .pen-input-btn{ width:32px; height:32px; border-radius:7px; display:flex; align-items:center; justify-content:center; padding:0; color:var(--text-dim); touch-action:none; -webkit-touch-callout:none; }
  .pen-input-btn svg{ width:17px; height:17px; }
  .pen-input-btn.active{ background:var(--bg-elevated); color:var(--accent); }
  .eraser-type-toggle{ display:flex; gap:2px; background:var(--bg-elevated-2); border-radius:9px; padding:2px; flex:0 0 auto; border:1px solid transparent; touch-action:none; -webkit-touch-callout:none; }
  .eraser-type-toggle.tool-active{ border-color:var(--accent-dim); }
  .eraser-icon-btn{ width:32px; height:32px; display:flex; align-items:center; justify-content:center; padding:0; color:var(--text-dim); touch-action:none; -webkit-touch-callout:none; }
  .eraser-icon-btn svg{ width:17px; height:17px; }
  .eraser-type-btn{ height:32px; padding:0 9px; border-radius:7px; font-size:10.5px; font-weight:700; color:var(--text-dim); white-space:nowrap; display:flex; align-items:center; justify-content:center; touch-action:none; -webkit-touch-callout:none; }
  /* The icon button carries both classes (class="eraser-type-btn eraser-icon-btn"); this
     compound selector outranks the single-class rules above on specificity alone, regardless of
     source order, so its width/padding reliably win over .eraser-type-btn's text-button padding. */
  .eraser-type-btn.eraser-icon-btn{ width:32px; padding:0; }
  .eraser-type-btn.active{ background:var(--bg-elevated); color:var(--accent); }
  .eraser-icon-btn.active{ background:transparent; color:var(--text-dim); }
  .color-swatch{ width:26px; height:26px; border-radius:50%; flex:0 0 auto; background:var(--sw); border:2px solid rgba(255,255,255,.22); touch-action:none; -webkit-touch-callout:none; }
  .color-swatch.active{ box-shadow:0 0 0 3px var(--bg-deep), 0 0 0 5px var(--sw); }
  .size-slider{
    position:relative; width:118px; height:32px; flex:0 0 auto; border-radius:16px;
    background:var(--bg-elevated-2); touch-action:none; -webkit-touch-callout:none;
  }
  .size-slider-track{
    position:absolute; left:14px; right:14px; top:50%; height:14px; transform:translateY(-50%);
    background:var(--line-strong); pointer-events:none;
    clip-path:polygon(0 44%, 100% 14%, 100% 86%, 0 56%);
  }
  .size-slider-thumb{
    position:absolute; top:50%; left:14px; width:26px; height:26px; margin-left:-13px; margin-top:-13px;
    border-radius:50%; background:var(--bg-elevated); border:1px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.25);
    pointer-events:none;
  }
  .size-slider-thumb i{ display:block; border-radius:50%; background:var(--text); font-style:normal; }
  .icon-btn.labeled{ width:auto; padding:0 13px; gap:6px; font-size:12.5px; font-weight:700; border:1px solid var(--line-strong); border-radius:19px; touch-action:none; -webkit-touch-callout:none; }
  .icon-btn.labeled svg{ width:16px; height:16px; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px);
    background:rgba(24,24,27,.94); color:#fff; padding:10px 18px; border-radius:13px;
    font-size:13px; opacity:0; pointer-events:none; z-index:200; backdrop-filter:blur(6px);
    transition:opacity .25s ease, transform .25s ease; max-width:80vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* Unlike .toast (auto-dismisses after ~2s), this stays visible until either a subsequent save
     succeeds (notifyStorageRecovered) or the person taps the dismiss button — losing data
     silently is worse than a toast that's easy to miss, so this needs to actually persist. */
  .storage-warning-banner{
    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 8px); transform:translateX(-50%);
    background:var(--danger); color:#fff; padding:9px 10px 9px 16px; border-radius:12px;
    font-size:12.5px; font-weight:600; z-index:300; display:flex; align-items:center; gap:10px;
    opacity:0; pointer-events:none; transition:opacity .2s ease; max-width:88vw;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .storage-warning-banner.show{ opacity:1; pointer-events:auto; }
  .storage-warning-banner button{
    background:rgba(255,255,255,.22); border:none; color:#fff; border-radius:8px; width:22px; height:22px;
    font-size:13px; line-height:1; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  }

  .confirm-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:250; }
  .confirm-backdrop.show{ opacity:1; pointer-events:auto; }
  .confirm-modal{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-48%); width:min(320px, 84vw);
    background:var(--bg-elevated); border-radius:16px; padding:20px 18px 16px; z-index:251;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .confirm-modal.show{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%); }
  .confirm-modal p{ margin:0 0 18px; font-size:14px; line-height:1.5; color:var(--text); }

  /* Scene long-press popup (Rename / Move / Trash) — replaces the old inline chips, which
     squeezed the scene label into an unreadably narrow column once a third chip was added. */
  .scene-action-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:250; }
  .scene-action-backdrop.show{ opacity:1; pointer-events:auto; }
  .scene-action-sheet{
    position:fixed; width:190px;
    background:var(--bg-elevated); border-radius:14px; padding:6px; z-index:251;
    opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease;
    box-shadow:0 16px 40px rgba(0,0,0,.45); transform:scale(.95); transform-origin:top left;
  }
  .scene-action-sheet.show{ opacity:1; pointer-events:auto; transform:scale(1); }
  /* Export menu reuses .scene-action-sheet's look, but isn't anchored to a pressed row like the
     scene one is (JS-positioned) — it's opened from a single fixed sidebar-footer button, so it
     just centers in the viewport instead. */
  #exportMenuSheet{ left:50%; top:50%; transform:translate(-50%,-50%) scale(.95); transform-origin:center; }
  #exportMenuSheet.show{ transform:translate(-50%,-50%) scale(1); }
  .scene-action-sheet-title{ padding:12px 12px 10px; font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--text-dim); letter-spacing:.04em; text-align:center; }
  .scene-action-sheet-btn{
    display:block; width:100%; padding:13px 14px; border-radius:11px; font-size:14.5px; font-weight:600;
    color:var(--text); text-align:center;
  }
  .scene-action-sheet-btn:hover{ background:var(--bg-elevated-2); }
  .scene-action-sheet-btn + .scene-action-sheet-btn{ margin-top:2px; }
  .scene-action-sheet-btn.danger{ color:var(--danger); }
  .scene-action-sheet-btn.cancel{ margin-top:6px; color:var(--text-dim); border-top:1px solid var(--line); border-radius:0 0 11px 11px; padding-top:15px; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-btn{ flex:1 1 0; padding:11px; border-radius:12px; font-size:14px; font-weight:700; }
  .confirm-cancel{ background:var(--bg-elevated-2); color:var(--text); }
  .confirm-ok{ background:var(--danger); color:#fff; }
  .confirm-ok-primary{ background:var(--accent); color:#fff; }
  .prompt-input{
    width:100%; box-sizing:border-box; margin:0 0 16px; padding:11px 12px;
    background:var(--bg-elevated-2); border:1px solid var(--line-strong); border-radius:10px;
    color:var(--text); font-size:15px; font-weight:600; text-transform:uppercase;
  }
  .prompt-input::placeholder{ color:var(--text-faint); text-transform:none; }

  .select-toolbar{
    position:fixed; left:50%; bottom:0; transform:translate(-50%,108%); width:min(680px, 96vw);
    background:var(--bg-elevated); border-radius:18px 18px 0 0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:14px; z-index:120;
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    border:1px solid var(--line-strong); border-bottom:none;
  }
  /* The shadow only applies once the toolbar is actually on-screen — a permanent shadow on
     the base rule would still bleed upward past the viewport edge (its blur radius reaches
     further than the translateY offset pushes the box down), showing as a smudge at the
     bottom of the screen even while the toolbar itself was fully hidden. */
  body.select-mode .select-toolbar{ transform:translate(-50%,0); box-shadow:0 -10px 30px rgba(0,0,0,.4); }
  /* Select mode: notes shouldn't be focusable/editable — taps should fall through to the
     card's select-toggle handler instead. The Frame's own tap-to-draw/tap-to-edit is guarded
     in JS (setupInlineCanvas) since it also needs to distinguish Apple Pencil input. */
  body.select-mode .cut-unit .note-line{ pointer-events:none; }
  body.select-mode .cut-unit .card{ cursor:pointer; }
  .select-all-btn{ display:flex; align-items:center; gap:7px; flex:0 0 auto; font-size:12px; font-weight:700; color:var(--text-dim); }
  .select-all-circle{ width:20px; height:20px; border-radius:50%; border:2px solid var(--text-faint); display:block; flex:0 0 auto; }
  .select-all-btn.all-selected .select-all-circle{ background:var(--accent); border-color:var(--accent); }
  .select-count{ flex:1 1 auto; font-size:12.5px; color:var(--text-dim); text-align:center; }
  .select-actions{ display:flex; gap:8px; flex:0 0 auto; }
  .select-action-btn{ padding:9px 14px; border-radius:12px; background:var(--bg-elevated-2); color:var(--text); font-size:12.5px; font-weight:700; border:1px solid var(--line-strong); white-space:nowrap; }
  .select-action-btn.danger{ background:var(--danger); color:#fff; border-color:var(--danger); }

  .scene-picker-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:250; }
  .scene-picker-backdrop.show{ opacity:1; pointer-events:auto; }
  .scene-picker-modal{
    position:fixed; left:50%; bottom:0; transform:translate(-50%,108%); width:min(420px, 92vw);
    max-height:70vh; background:var(--bg-elevated); border-radius:18px 18px 0 0; z-index:251;
    display:flex; flex-direction:column; transition:transform .26s cubic-bezier(.32,.72,0,1);
  }
  .scene-picker-modal.show{ transform:translate(-50%,0); box-shadow:0 -20px 50px rgba(0,0,0,.5); }
  .scene-picker-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px; font-size:14px; font-weight:700; color:var(--text); border-bottom:1px solid var(--line); flex:0 0 auto; }
  .scene-picker-cancel{ font-size:13px; font-weight:600; color:var(--accent); }
  .scene-picker-list{ overflow-y:auto; padding:8px 10px calc(14px + env(safe-area-inset-bottom)); }
  .scene-picker-item{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; padding:11px 12px; border-radius:11px; }
  .scene-picker-item:hover{ background:var(--bg-elevated-2); }

  .sidebar-header-count{ font-weight:400; text-transform:none; letter-spacing:0; color:var(--text-faint); font-size:11px; }
  .project-trash-count{ margin-left:auto; padding-left:8px; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); flex:0 0 auto; }
  .trash-folder-icon{ color:var(--danger); }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <button id="sidebarToggle" class="icon-btn" aria-label="Open sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
    </button>
    <button id="topUndoBtn" class="icon-btn disabled" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h9a5 5 0 0 1 0 10h-2M3 10l5-5M3 10l5 5"/></svg>
    </button>
    <button id="topRedoBtn" class="icon-btn disabled" aria-label="Redo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10h-9a5 5 0 0 0 0 10h2M21 10l-5-5M21 10l-5 5"/></svg>
    </button>
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/></svg>
      </span>
      <h1 id="projectTitle" contenteditable="true" spellcheck="false">Untitled Storyboard</h1>
    </div>
    <div class="view-toggle">
      <button id="viewBasicBtn" class="view-toggle-btn active" aria-label="Basic view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
      <button id="viewTileBtn" class="view-toggle-btn" aria-label="Tile view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
      </button>
    </div>
    <div class="topbar-controls" id="topbarMainControls">
      <button id="searchToggleBtn" class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button id="addSceneBtn" class="add-scene-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Scene</span>
      </button>
      <button id="selectBtn" class="select-toggle-btn">Select</button>
      <button id="editToggleBtn" class="edit-toggle-btn">Edit</button>
    </div>
    <div class="topbar-controls" id="topbarTrashControls" style="display:none">
      <button id="trashSelectBtn" class="select-toggle-btn">Select</button>
      <button id="emptyTrashBtn" class="edit-toggle-btn">Empty</button>
    </div>
    <div class="search-panel" id="searchPanel" style="display:none">
      <div class="search-input-row">
        <svg class="search-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Shot # or notes" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="searchClearBtn" class="icon-btn search-panel-close-btn" aria-label="Close search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-scroll">
        <div class="folder-section" id="projectsFolderSection">
          <div class="folder-header-row">
            <button class="folder-header-toggle" id="projectsFolderToggle">
              <svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
              <span>Projects</span>
              <svg class="folder-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <button class="sort-btn" id="projectSortBtn" aria-label="Sort projects">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h12M8.5 11.5h7M11 17h2"/></svg>
            </button>
            <div class="sort-menu" id="projectSortMenu">
              <button class="sort-option" data-field="title">Title <span class="sort-dir"></span></button>
              <button class="sort-option" data-field="created">Date Created <span class="sort-dir"></span></button>
              <button class="sort-option" data-field="updated">Date Edited <span class="sort-dir"></span></button>
            </div>
          </div>
          <div class="folder-body" id="projectsList"></div>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-header">Scenes <span class="sidebar-header-count" id="scenesCutCount"></span></div>
        <div class="sidebar-list" id="sidebarSceneList"></div>
        <div class="sidebar-divider"></div>
        <div class="folder-section collapsed" id="trashFolderSection">
          <div class="folder-header-row">
            <button class="folder-header-toggle" id="trashFolderToggle">
              <svg class="folder-icon trash-folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 1 12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-12"/></svg>
              <span>Trash</span>
              <svg class="folder-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
          <div class="folder-body" id="trashProjectsList"></div>
        </div>
      </div>
      <div class="sidebar-footer">
        <div class="backup-row">
          <button id="clearBlankShotsBtn" class="backup-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.5 6.5l2 2M15.5 15.5l2 2M6.5 17.5l2-2M15.5 8.5l2-2"/></svg>
            <span>Clear Blank Shots</span>
          </button>
        </div>
        <div class="backup-row">
          <button id="exportBtn" class="backup-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            <span>Export</span>
          </button>
          <button id="importBtn" class="backup-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0 4 4m-4-4-4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            <span>Import</span>
          </button>
        </div>
        <input type="file" id="importInput" accept="application/json,.json" hidden>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <div class="stage">
      <div class="sprockets"></div>
      <div class="filmstrip" id="filmstrip">
        <div class="loading-state">Loading…</div>
      </div>
      <div class="sprockets-bottom"></div>
      <div class="tile-scrollbar" id="tileScrollbar"><div class="tile-scrollbar-thumb" id="tileScrollbarThumb"></div></div>
      <div class="nav-buttons hidden" id="navButtons">
        <button id="navFirstBtn" class="nav-btn" aria-label="Jump to first shot"></button>
        <button id="navLastBtn" class="nav-btn" aria-label="Jump to last shot"></button>
      </div>
    </div>
  </div>
</div>

<div class="notes-expand-backdrop" id="notesExpandBackdrop"></div>
<div class="notes-expand-panel" id="notesExpandPanel">
  <div class="notes-expand-header">
    <div class="notes-expand-header-left">
      <span id="notesExpandLabel">SHOT 01 — NOTES</span>
      <div class="notes-history-controls">
        <button id="notesUndoBtn" class="notes-history-btn disabled" aria-label="Undo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h9a5 5 0 0 1 0 10h-2M3 10l5-5M3 10l5 5"/></svg>
        </button>
        <button id="notesRedoBtn" class="notes-history-btn disabled" aria-label="Redo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10h-9a5 5 0 0 0 0 10h2M21 10l-5-5M21 10l-5 5"/></svg>
        </button>
      </div>
    </div>
    <button id="notesExpandDone" class="notes-expand-done">Done</button>
  </div>
  <div class="notes-format-toolbar" id="notesFormatToolbar">
    <div class="notes-format-colors" id="notesColorSwatches">
      <button class="notes-color-swatch active" data-color="#221F1C" style="background:#221F1C"></button>
      <button class="notes-color-swatch" data-color="#E0502A" style="background:#E0502A"></button>
      <button class="notes-color-swatch" data-color="#2E6BE0" style="background:#2E6BE0"></button>
      <button class="notes-color-swatch" data-color="#2E9E4F" style="background:#2E9E4F"></button>
      <button class="notes-color-swatch" data-color="#9B4FE0" style="background:#9B4FE0"></button>
      <button class="notes-color-swatch" data-color="#9A9A9E" style="background:#9A9A9E"></button>
    </div>
    <div class="notes-format-styles">
      <button class="notes-style-btn" data-style="bold" title="Bold"><b>B</b></button>
      <button class="notes-style-btn" data-style="italic" title="Italic"><i>I</i></button>
      <button class="notes-style-btn" data-style="underline" title="Underline"><u>U</u></button>
      <button class="notes-style-btn" data-style="strikethrough" title="Strikethrough"><s>S</s></button>
    </div>
  </div>
  <div class="notes-expand-body">
    <div class="notes-lines expanded" id="notesExpandLines"></div>
  </div>
</div>

<div class="pdf-export-backdrop" id="pdfExportBackdrop"></div>
<div class="pdf-export-panel" id="pdfExportPanel">
  <div class="pdf-export-header">
    <span>Export PDF</span>
    <button id="pdfExportCloseBtn" class="icon-btn" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="pdf-layout-toggle" id="pdfLayoutToggle">
    <button class="pdf-layout-btn active" data-layout="vertical">Vertical</button>
